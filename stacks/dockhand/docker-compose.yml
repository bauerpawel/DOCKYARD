services:
  dockhand:
    image: fnsys/dockhand:latest@sha256:e82db7e76024d288c40a96ed023537961cfa4e60f1a87087f1990f64bde39fac
    restart: unless-stopped
    ports:
      - 127.0.0.1:${DOCKHAND_PORT:-3010}:3000
    volumes:
      - data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  data: {}
