services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: inventree
    volumes:
      - database:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U inventree -d inventree"]
      interval: 5s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    restart: unless-stopped
    command: [valkey-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    image: inventree/inventree:1.7.4@sha256:0b7a1b433fcdc0459f92ea0526bf5ae3dd147d498a5afce5397611b7cebd5104
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      INVENTREE_SITE_URL: ${INVENTREE_SITE_URL:?Set INVENTREE_SITE_URL}
      INVENTREE_SERVER: http://server:8000
      INVENTREE_WEB_PORT: "8000"
      INVENTREE_DB_ENGINE: postgresql
      INVENTREE_DB_NAME: inventree
      INVENTREE_DB_HOST: db
      INVENTREE_DB_PORT: "5432"
      INVENTREE_DB_USER: inventree
      INVENTREE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      INVENTREE_CACHE_ENABLED: "True"
      INVENTREE_CACHE_HOST: valkey
      INVENTREE_CACHE_PORT: "6379"
      INVENTREE_USE_X_FORWARDED_HOST: "True"
      INVENTREE_USE_X_FORWARDED_PORT: "True"
      INVENTREE_USE_X_FORWARDED_PROTO: "True"
      INVENTREE_AUTO_UPDATE: "True"
      INVENTREE_PLUGINS_ENABLED: "False"
      INVENTREE_LOG_LEVEL: WARNING
      INVENTREE_ADMIN_USER: ${INVENTREE_ADMIN_USER:-admin}
      INVENTREE_ADMIN_EMAIL: ${INVENTREE_ADMIN_EMAIL:?Set INVENTREE_ADMIN_EMAIL}
      INVENTREE_ADMIN_PASSWORD: ${INVENTREE_ADMIN_PASSWORD:?Set INVENTREE_ADMIN_PASSWORD}
    volumes:
      - data:/home/inventree/data
    healthcheck:
      test: [CMD-SHELL, "invoke server-health --address http://localhost:8000"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
  worker:
    image: inventree/inventree:1.7.4@sha256:0b7a1b433fcdc0459f92ea0526bf5ae3dd147d498a5afce5397611b7cebd5104
    restart: unless-stopped
    command: invoke worker
    depends_on:
      server:
        condition: service_healthy
    environment:
      INVENTREE_SITE_URL: ${INVENTREE_SITE_URL:?Set INVENTREE_SITE_URL}
      INVENTREE_DB_ENGINE: postgresql
      INVENTREE_DB_NAME: inventree
      INVENTREE_DB_HOST: db
      INVENTREE_DB_PORT: "5432"
      INVENTREE_DB_USER: inventree
      INVENTREE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      INVENTREE_CACHE_ENABLED: "True"
      INVENTREE_CACHE_HOST: valkey
      INVENTREE_CACHE_PORT: "6379"
      INVENTREE_PLUGINS_ENABLED: "False"
      INVENTREE_LOG_LEVEL: WARNING
    volumes:
      - data:/home/inventree/data
  proxy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - 127.0.0.1:${INVENTREE_PORT:-8095}:80
    volumes:
      - data:/var/www:ro
configs:
  caddyfile:
    content: |
      {
        auto_https off
        admin off
      }

      :80 {
        encode gzip
        request_body {
          max_size 100MB
        }
        handle_path /static/* {
          root * /var/www/static
          file_server
        }
        handle_path /media/* {
          root * /var/www/media
          file_server
          header Content-Disposition attachment
          forward_auth server:8000 {
            uri /auth/
          }
        }
        reverse_proxy server:8000
      }
volumes:
  database: {}
  data: {}
