# Inline configs require Docker Compose 2.23.1+.
# Based on netbird v0.82.0 infrastructure_files/getting-started.sh.
services:
  server:
    image: netbirdio/netbird-server:0.82.0@sha256:7b5b53b2dc8bc25639f791cf72d47cf86911894ff3f8a97cb79bab9be958109c
    restart: unless-stopped
    command: [--config, /etc/netbird/config.yaml]
    ports:
      - "3478:3478/udp"
    volumes:
      - server-data:/var/lib/netbird
    configs:
      - source: server-config
        target: /etc/netbird/config.yaml
    networks: [backend]
  dashboard:
    image: netbirdio/dashboard:v2.34.0@sha256:b435b54f6a74428a0443b4b768356b2978fecf1460ac25bfb1d348569dfdda01
    restart: unless-stopped
    environment:
      NETBIRD_MGMT_API_ENDPOINT: "https://${NETBIRD_DOMAIN:?Set NETBIRD_DOMAIN}"
      NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://${NETBIRD_DOMAIN:?Set NETBIRD_DOMAIN}"
      AUTH_AUDIENCE: netbird-dashboard
      AUTH_CLIENT_ID: netbird-dashboard
      AUTH_AUTHORITY: "https://${NETBIRD_DOMAIN:?Set NETBIRD_DOMAIN}/oauth2"
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: openid profile email groups
      AUTH_REDIRECT_URI: /nb-auth
      AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
      NGINX_SSL_PORT: "443"
      LETSENCRYPT_DOMAIN: none
    networks: [backend]
  caddy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddy-config
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [server, dashboard]
    networks:
      backend:
        ipv4_address: 172.30.0.10
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  server-data:
  caddy-data:
  caddy-config:
configs:
  server-config:
    content: |
      server:
        listenAddress: ":80"
        exposedAddress: "https://${NETBIRD_DOMAIN:?Set NETBIRD_DOMAIN}:443"
        stunPorts: [3478]
        metricsPort: 9090
        healthcheckAddress: ":9000"
        logLevel: info
        logFile: console
        authSecret: "${NETBIRD_RELAY_AUTH_SECRET:?Set NETBIRD_RELAY_AUTH_SECRET}"
        dataDir: /var/lib/netbird
        auth:
          issuer: "https://${NETBIRD_DOMAIN:?Set NETBIRD_DOMAIN}/oauth2"
          signKeyRefreshEnabled: true
          sessionCookieEncryptionKey: "${NETBIRD_SESSION_COOKIE_ENCRYPTION_KEY:?Set NETBIRD_SESSION_COOKIE_ENCRYPTION_KEY}"
          dashboardRedirectURIs:
            - "https://${NETBIRD_DOMAIN:?Set NETBIRD_DOMAIN}/nb-auth"
            - "https://${NETBIRD_DOMAIN:?Set NETBIRD_DOMAIN}/nb-silent-auth"
          cliRedirectURIs: ["http://localhost:53000/"]
        reverseProxy:
          trustedHTTPProxies: ["172.30.0.10/32"]
        store:
          engine: sqlite
          encryptionKey: "${NETBIRD_DATASTORE_ENCRYPTION_KEY:?Set NETBIRD_DATASTORE_ENCRYPTION_KEY}"
  caddy-config:
    content: |
      ${NETBIRD_DOMAIN:?Set NETBIRD_DOMAIN} {
        tls ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL}
        @grpc header Content-Type application/grpc*
        reverse_proxy @grpc h2c://server:80
        @backend path /relay* /ws-proxy/* /api/* /oauth2/*
        reverse_proxy @backend server:80
        reverse_proxy dashboard:80
      }
