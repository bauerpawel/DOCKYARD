services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: ryot
      POSTGRES_USER: ryot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ryot -d ryot
      interval: 5s
      timeout: 5s
      retries: 20
  ryot:
    image: ignisda/ryot:v10@sha256:d7a07c2eac3d8ee3c2be16e21da4a158cb1e550d9fd073a8c98da63ef0d67710
    restart: unless-stopped
    environment:
      FRONTEND_URL: ${RYOT_URL:?Set RYOT_URL}
      DATABASE_URL: postgres://ryot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/ryot
      SERVER_ADMIN_ACCESS_TOKEN: ${SERVER_ADMIN_ACCESS_TOKEN:?Set SERVER_ADMIN_ACCESS_TOKEN}
    ports:
      - 127.0.0.1:${RYOT_PORT:-8001}:8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  database: {}
