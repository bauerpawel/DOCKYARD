services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U glitchtip -d glitchtip
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - max_locks_per_transaction=512
  web:
    image: glitchtip/glitchtip:latest@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    restart: unless-stopped
    ports:
      - 127.0.0.1:${GLITCHTIP_PORT:-8000}:8000
    environment:
      DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/glitchtip
      VALKEY_URL: ''
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@example.com}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:?Set GLITCHTIP_DOMAIN}
      ENABLE_USER_REGISTRATION: 'False'
      SERVER_ROLE: all_in_one
    volumes:
      - uploads:/code/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  database: null
  uploads: null
