services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: typebot
      POSTGRES_DB: typebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U typebot -d typebot
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8.6-alpine@sha256:f4ed7d6732f9a5dcc6b64e2b347860b9f329334bfd4839a672f78cd981a8bba6
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - --appendonly
      - 'yes'
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 30
  builder:
    image: baptistearno/typebot-builder:latest@sha256:9b277e31c84773f49a07ef2d48c90dc83b01cabeaeef6eb1c43005264d194fdd
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://typebot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/typebot
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL:?Set NEXT_PUBLIC_VIEWER_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      NODE_OPTIONS: --no-node-snapshot
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      NEXT_PUBLIC_SMTP_FROM: ${NEXT_PUBLIC_SMTP_FROM:?Set NEXT_PUBLIC_SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
    ports:
      - 127.0.0.1:${TYPEBOT_BUILDER_PORT:-3011}:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  viewer:
    image: baptistearno/typebot-viewer:latest@sha256:1fba8b9a165c196af09c652e44feef01f6948204261d956cf7b545b2acd24425
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://typebot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/typebot
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL:?Set NEXT_PUBLIC_VIEWER_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      NODE_OPTIONS: --no-node-snapshot
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      NEXT_PUBLIC_SMTP_FROM: ${NEXT_PUBLIC_SMTP_FROM:?Set NEXT_PUBLIC_SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
    ports:
      - 127.0.0.1:${TYPEBOT_VIEWER_PORT:-3012}:3000
    depends_on:
      builder:
        condition: service_healthy
volumes:
  database: {}
  redis: {}
