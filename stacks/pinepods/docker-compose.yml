services:
  pinepods:
    image: madeofpendletonwool/pinepods:latest@sha256:a0463a3a2d7762ba198f94c6aee8856feb0393594792ad0466ae4c170e4bb86c
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      SEARCH_API_URL: ${SEARCH_API_URL:-https://search.pinepods.online/api/search}
      PEOPLE_API_URL: ${PEOPLE_API_URL:-https://people.pinepods.online}
      HOSTNAME: ${HOSTNAME:-http://127.0.0.1:8040}
      DB_TYPE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: pinepods_database
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      DEBUG_MODE: "false"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - 127.0.0.1:${PINEPODS_PORT:-8040}:8040
    volumes:
      - downloads:/opt/pinepods/downloads
      - backups:/opt/pinepods/backups
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: pinepods_database
    volumes:
      - database:/var/lib/postgresql
    shm_size: 1gb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d pinepods_database"]
      interval: 5s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    restart: unless-stopped
    command: [valkey-server, --appendonly, "yes"]
    volumes:
      - cache:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  downloads: {}
  backups: {}
  database: {}
  cache: {}
