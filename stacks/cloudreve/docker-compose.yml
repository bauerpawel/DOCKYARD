services:
  cloudreve:
    image: cloudreve/cloudreve:4.19.1@sha256:5c6c5baf7fa5bc6e1bb9a7509c09dde00e80b618d180244eb1d5f7e36b358ea2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      CR_CONF_Database.Type: postgres
      CR_CONF_Database.Host: db
      CR_CONF_Database.Port: "5432"
      CR_CONF_Database.User: cloudreve
      CR_CONF_Database.Password: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CR_CONF_Database.Name: cloudreve
      CR_CONF_Redis.Server: valkey:6379
    ports:
      - 127.0.0.1:${CLOUDREVE_PORT:-5212}:5212
    volumes:
      - data:/cloudreve/data
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudreve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: cloudreve
    volumes:
      - database:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cloudreve -d cloudreve"]
      interval: 5s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    restart: unless-stopped
    command: [valkey-server, --appendonly, "yes"]
    volumes:
      - cache:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  data: {}
  database: {}
  cache: {}
