      OPR_EXECUTOR_MAINTENANCE_INTERVAL: '600'
      OPR_EXECUTOR_NETWORK: runtimes
      OPR_EXECUTOR_ENV: production
      OPR_EXECUTOR_RUNTIMES: node-22,static-1
      OPR_EXECUTOR_SECRET: ${_APP_EXECUTOR_SECRET:?Set _APP_EXECUTOR_SECRET}
      OPR_EXECUTOR_RUNTIME_VERSIONS: v5
      OPEN_RUNTIMES_NFT: enabled
      OPR_EXECUTOR_CONNECTION_STORAGE: local://localhost
      OPR_EXECUTOR_CONNECTION_BUILD_CACHE_STORAGE: ''
    healthcheck:
      test:
      - CMD-SHELL
      - 'curl -fsS -H "Authorization: Bearer $$OPR_EXECUTOR_SECRET" http://localhost/v1/health >/dev/null'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  orchestrator:
    hostname: orchestrator
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    image: ghcr.io/open-runtimes/orchestrator/orchestrator:2.2.4@sha256:bd70ebf43f0ae093ec835c10ce170d21079bfc37ea04de2d28b5472473af86bb
    restart: unless-stopped
    user: root
    networks:
    - appwrite
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ORCHESTRATOR_BACKEND: docker
      ORCHESTRATOR_NETWORK: appwrite
      DOCKER_NETWORK: appwrite
      ARTIFACT_ENDPOINT: http://orchestrator:8080
  postgresql:
    image: appwrite/postgres:0.1.0@sha256:77156232a16d80f5830d914edb44f52a0853058939f2365cc3301d08db9d05e9
    init: true
    shm_size: 1g
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    networks:
    - appwrite
    volumes:
    - appwrite-postgresql:/var/lib/postgresql:rw
    environment:
      POSTGRES_DB: ${_APP_DB_SCHEMA:-appwrite}
      POSTGRES_USER: ${_APP_DB_USER:-appwrite}
      POSTGRES_PASSWORD: ${_APP_DB_PASS:?Set _APP_DB_PASS}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
    - postgres
    restart: unless-stopped
  redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    command:
    - redis-server
    - --maxmemory
    - 512mb
    - --maxmemory-policy
    - allkeys-lru
    - --maxmemory-samples
    - '5'
    networks:
    - appwrite
    volumes:
    - appwrite-redis:/data:rw
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
configs:
  clickhouse-config:
    content: "<?xml version=\"1.0\"?>\n<!--\n    Retention for ClickHouse's own system log tables.\n\n    Every\
      \ <ttl> in the image's config.xml sits inside an XML comment, so these\n    tables keep every row forever,\
      \ and the metric ones add a row per second\n    whether or not the instance serves traffic. Left alone they\
      \ outgrow the\n    usage data they sit next to and fill the volume.\n\n    When a window here changes, ClickHouse\
      \ replaces the table on the next\n    restart and keeps the old one, rows and all, as <log>_<N>.\n    clickhouse-init.sh\
      \ gives those old tables the same window.\n-->\n<clickhouse>\n    <!-- The metric, trace and profile logs\
      \ sample the server every second whether\n         or not Appwrite serves traffic, and nothing reads them\
      \ back, so their\n         writes and the merges behind them are pure overhead. -->\n    <asynchronous_metric_log\
      \ remove=\"1\"/>\n    <metric_log remove=\"1\"/>\n    <histogram_metric_log remove=\"1\"/>\n    <query_metric_log\
      \ remove=\"1\"/>\n    <processors_profile_log remove=\"1\"/>\n    <trace_log remove=\"1\"/>\n    <!-- text_log\
      \ repeats the server log the container already writes. -->\n    <text_log remove=\"1\"/>\n\n    <!-- Kept\
      \ for debugging, capped so they cannot fill the volume. -->\n    <asynchronous_insert_log><ttl>event_date\
      \ + INTERVAL 3 DAY DELETE</ttl></asynchronous_insert_log>\n    <query_log><ttl>event_date + INTERVAL 7 DAY\
      \ DELETE</ttl></query_log>\n    <query_views_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_views_log>\n\
      \    <query_thread_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_thread_log>\n    <part_log><ttl>event_date\
      \ + INTERVAL 7 DAY DELETE</ttl></part_log>\n    <background_schedule_pool_log><ttl>event_date + INTERVAL 7\
      \ DAY DELETE</ttl></background_schedule_pool_log>\n\n    <!-- Longer, so it still covers a report that reaches\
      \ us late. crash_log is\n         deliberately left alone: it is tiny and worth keeping. -->\n    <error_log><ttl>event_date\
      \ + INTERVAL 14 DAY DELETE</ttl></error_log>\n</clickhouse>\n"
  clickhouse-init:
    content: "#!/bin/bash\n# The ClickHouse entrypoint sources this file, so a subshell keeps these options out\
      \ of it.\n(\n  set -euo pipefail\n\n  client() {\n    clickhouse-client --host 127.0.0.1 --user \"$$CLICKHOUSE_USER\"\
      \ --password \"$$CLICKHOUSE_PASSWORD\" \"$$@\"\n  }\n\n  # Flushing replaces log tables whose definition changed,\
      \ keeping each old table as <log>_<N>.\n  client --query 'SYSTEM FLUSH LOGS'\n\n  # Tables left behind never\
      \ expire on their own: take the TTL of the log that\n  # replaced this one, or a week when the log is no longer\
      \ written at all.\n  # The named logs must match the ones clickhouse-config.xml removes: a log that\n  # is\
      \ still written gets replaced on the next restart if its TTL is altered here.\n  client --format TSVRaw <<'SQL'\
      \ | client --multiquery\nSELECT concat('ALTER TABLE system.', stale.name, ' MODIFY TTL ', if(active.name =\
      \ '', 'event_date + INTERVAL 7 DAY DELETE', splitByString(' SETTINGS ', splitByString(' TTL ', active.engine_full)[2])[1]),\
      \ ';')\nFROM (\n  SELECT name, splitByChar('_', name)[-1] AS suffix, arrayStringConcat(arrayPopBack(splitByChar('_',\
      \ name)), '_') AS log\n  FROM system.tables\n  WHERE database = 'system'\n    AND position(engine_full, '\
      \ TTL ') = 0\n    AND endsWith(engine, 'MergeTree')\n    AND name IN (SELECT table FROM system.columns WHERE\
      \ database = 'system' AND name = 'event_date' AND type = 'Date')\n) AS stale\nLEFT JOIN system.tables AS active\n\
      \  ON active.database = 'system'\n  AND active.name = stale.log\n  AND position(active.engine_full, ' TTL\
      \ ') > 0\nWHERE (endsWith(stale.log, '_log') AND toUInt64OrNull(stale.suffix) IS NOT NULL)\n  OR stale.name\
      \ IN ('asynchronous_metric_log', 'metric_log', 'histogram_metric_log', 'query_metric_log', 'processors_profile_log',\
      \ 'trace_log', 'text_log')\nSQL\n)\n"
