services:
  traefik:
    image: traefik:3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    command:
    - --providers.file.directory=/storage/config
    - --providers.file.watch=true
    - --providers.docker=true
    - --providers.docker.exposedByDefault=false
    - --providers.docker.constraints=Label(`traefik.constraint-label-stack`,`appwrite`)
    - --entrypoints.appwrite_web.address=:80
    - --entrypoints.appwrite_websecure.address=:443
    - --entrypoints.appwrite_mqtt.address=:8883
    - --entrypoints.appwrite_mqtt_ws.address=:8084
    ports:
    - ${_APP_HTTP_PORT:-8081}:80
    - ${_APP_HTTPS_PORT:-8443}:443
    - ${_APP_MQTT_PORT:-8883}:8883
    - ${_APP_MQTT_WSS_PORT:-8084}:8084
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - appwrite-config:/storage/config:ro
    - appwrite-certificates:/storage/certificates:ro
    depends_on:
      appwrite:
        condition: service_started
    networks:
    - gateway
    - appwrite
    restart: unless-stopped
  appwrite:
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    image: appwrite/appwrite:2.6.2@sha256:bc2d41def03f9a493fb383b0e9bc793cc77a7fcb232da2e1f9893cc6954ea239
    healthcheck:
      test:
      - CMD-SHELL
      - 'test -f /tmp/.appwrite-ready && curl -fsS -o /dev/null -H "Host: $${_APP_DOMAIN:-localhost}" http://localhost/v1/health/version'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
    - appwrite
    - browser
    labels:
    - traefik.enable=true
    - traefik.constraint-label-stack=appwrite
    - traefik.docker.network=appwrite
    - traefik.http.services.appwrite_api.loadbalancer.server.port=80
    - traefik.http.routers.appwrite_api_http.entrypoints=appwrite_web
    - traefik.http.routers.appwrite_api_http.rule=PathPrefix(`/`)
    - traefik.http.routers.appwrite_api_http.service=appwrite_api
    - traefik.http.routers.appwrite_api_https.entrypoints=appwrite_websecure
    - traefik.http.routers.appwrite_api_https.rule=PathPrefix(`/`)
    - traefik.http.routers.appwrite_api_https.service=appwrite_api
    - traefik.http.routers.appwrite_api_https.tls=true
    volumes:
    - appwrite-uploads:/storage/uploads:rw
    - appwrite-imports:/storage/imports:rw
    - appwrite-cache:/storage/cache:rw
    - appwrite-config:/storage/config:rw
    - appwrite-certificates:/storage/certificates:rw
    - appwrite-functions:/storage/functions:rw
    - appwrite-sites:/storage/sites:rw
    - appwrite-builds:/storage/builds:rw
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      appwrite-geo:
        condition: service_started
      appwrite-autogravity:
        condition: service_started
      appwrite-exiftool:
        condition: service_started
    environment: *id001
    restart: unless-stopped
  appwrite-console:
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    image: appwrite/new:1.2.108-self-hosted@sha256:14edc23e68d8b525ad3ae3fcc887b6f3e19e9e0d09729dde24df40a4851db481
    restart: unless-stopped
    networks:
    - appwrite
    environment:
      VITE_CONSOLE_PROFILE: self-hosted
      VITE_APPWRITE_VERSION: 2.6.2
      APPWRITE_ENDPOINT_SAME_ORIGIN: 'true'
    labels:
    - traefik.enable=true
    - traefik.constraint-label-stack=appwrite
    - traefik.docker.network=appwrite
    - traefik.http.services.appwrite_console.loadbalancer.server.port=3000
    - traefik.http.routers.appwrite_console_http.entrypoints=appwrite_web
    - traefik.http.routers.appwrite_console_http.rule=(Host(`${_APP_DOMAIN:?Set _APP_DOMAIN}`) || Host(`${_APP_DOMAIN:?Set
      _APP_DOMAIN}`)) && !PathPrefix(`/v1`) && !PathPrefix(`/.well-known`) && !HeaderRegexp(`x-appwrite-hostname`,
      `.+`)
    - traefik.http.routers.appwrite_console_http.service=appwrite_console
    - traefik.http.routers.appwrite_console_https.entrypoints=appwrite_websecure
    - traefik.http.routers.appwrite_console_https.rule=(Host(`${_APP_DOMAIN:?Set _APP_DOMAIN}`) || Host(`${_APP_DOMAIN:?Set
      _APP_DOMAIN}`)) && !PathPrefix(`/v1`) && !PathPrefix(`/.well-known`) && !HeaderRegexp(`x-appwrite-hostname`,
      `.+`)
    - traefik.http.routers.appwrite_console_https.service=appwrite_console
    - traefik.http.routers.appwrite_console_https.tls=true
  appwrite-realtime:
    entrypoint: realtime
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    image: appwrite/appwrite:2.6.2@sha256:bc2d41def03f9a493fb383b0e9bc793cc77a7fcb232da2e1f9893cc6954ea239
    restart: unless-stopped
    labels:
    - traefik.enable=true
    - traefik.constraint-label-stack=appwrite
    - traefik.docker.network=appwrite
    - traefik.http.services.appwrite_realtime.loadbalancer.server.port=80
    - traefik.http.routers.appwrite_realtime_ws.entrypoints=appwrite_web
    - traefik.http.routers.appwrite_realtime_ws.rule=PathPrefix(`/v1/realtime`)
    - traefik.http.routers.appwrite_realtime_ws.service=appwrite_realtime
    - traefik.http.routers.appwrite_realtime_wss.entrypoints=appwrite_websecure
    - traefik.http.routers.appwrite_realtime_wss.rule=PathPrefix(`/v1/realtime`)
    - traefik.http.routers.appwrite_realtime_wss.service=appwrite_realtime
    - traefik.http.routers.appwrite_realtime_wss.tls=true
    networks:
    - appwrite
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *id001
  appwrite-mqtt:
    entrypoint: mqtt
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    image: appwrite/appwrite:2.6.2@sha256:bc2d41def03f9a493fb383b0e9bc793cc77a7fcb232da2e1f9893cc6954ea239
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - php
      - -r
      - 'exit(@fsockopen(''127.0.0.1'', 1883) ? 0 : 1);'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    labels:
    - traefik.enable=true
    - traefik.constraint-label-stack=appwrite
    - traefik.docker.network=appwrite
    - traefik.tcp.routers.appwrite_mqtt.entrypoints=appwrite_mqtt
    - traefik.tcp.routers.appwrite_mqtt.rule=HostSNI(`*`)
    - traefik.tcp.routers.appwrite_mqtt.tls=true
    - traefik.tcp.routers.appwrite_mqtt.service=appwrite_mqtt
    - traefik.tcp.services.appwrite_mqtt.loadbalancer.server.port=1883
    - traefik.http.routers.appwrite_mqtt_ws.entrypoints=appwrite_mqtt_ws
    - traefik.http.routers.appwrite_mqtt_ws.rule=PathPrefix(`/`)
    - traefik.http.routers.appwrite_mqtt_ws.service=appwrite_mqtt_ws
    - traefik.http.routers.appwrite_mqtt_ws.tls=true
    - traefik.http.services.appwrite_mqtt_ws.loadbalancer.server.port=8083
    networks:
    - appwrite
    environment: *id001
  appwrite-worker:
    entrypoint: worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    image: appwrite/appwrite:2.6.2@sha256:bc2d41def03f9a493fb383b0e9bc793cc77a7fcb232da2e1f9893cc6954ea239
    networks:
    - appwrite
    - browser
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    volumes:
    - appwrite-uploads:/storage/uploads:rw
    - appwrite-cache:/storage/cache:rw
    - appwrite-functions:/storage/functions:rw
    - appwrite-sites:/storage/sites:rw
    - appwrite-builds:/storage/builds:rw
    - appwrite-certificates:/storage/certificates:rw
    - appwrite-config:/storage/config:rw
    - appwrite-imports:/storage/imports:rw
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      <<: *id001
      _APP_WORKERS_NUM: '1'
      _APP_WORKER_MAX_COROUTINES: '79'
  appwrite-task-scheduler:
    entrypoint: schedule
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    image: appwrite/appwrite:2.6.2@sha256:bc2d41def03f9a493fb383b0e9bc793cc77a7fcb232da2e1f9893cc6954ea239
    networks:
    - appwrite
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *id001
      _APP_WORKER_MAX_COROUTINES: '8'
  appwrite-task-maintenance:
    entrypoint: maintenance
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    image: appwrite/appwrite:2.6.2@sha256:bc2d41def03f9a493fb383b0e9bc793cc77a7fcb232da2e1f9893cc6954ea239
    networks:
    - appwrite
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *id001
  appwrite-task-interval:
    entrypoint: interval
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
