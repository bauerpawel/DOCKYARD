services:
  directus:
    image: directus/directus:12.6.0@sha256:5a475c31cf547da604b3ef1bd85097145825ca6aab8841dc784bb08eaa21681b
    restart: unless-stopped
    ports:
      - ${DIRECTUS_PORT:-8055}:8055
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      SECRET: ${SECRET:?Set SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      WEBSOCKETS_ENABLED: 'true'
    volumes:
      - uploads:/directus/uploads
      - extensions:/directus/extensions
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U directus -d directus
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  database: null
  uploads: null
  extensions: null
