services:
  bugsink:
    image: bugsink/bugsink:2.6.2@sha256:a013fe0da745b753d65f9816020d36f91620e6d1c62ac22d82463b3a6ec2d71e
    restart: unless-stopped
    ports:
      - "${BUGSINK_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY}"
      CREATE_SUPERUSER: "${BUGSINK_ADMIN_EMAIL:?Set BUGSINK_ADMIN_EMAIL}:${BUGSINK_ADMIN_PASSWORD:?Set BUGSINK_ADMIN_PASSWORD}"
      BASE_URL: "${BASE_URL:?Set BASE_URL}"
      DATABASE_URL: "postgresql://bugsink:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/bugsink"
      BEHIND_HTTPS_PROXY: "${BEHIND_HTTPS_PROXY:-false}"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: bugsink
      POSTGRES_USER: bugsink
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bugsink -d bugsink"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  database:
  data:
