services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    restart: unless-stopped
    environment:
      CRON_SCHEDULE: ${CRON_SCHEDULE:-@daily}
      TZ: ${TZ:-Etc/UTC}
      RECYCLARR_CREATE_CONFIG: 'false'
    volumes:
      - config:/config
    configs:
      - source: recyclarr-config
        target: /config/recyclarr.yml
configs:
  recyclarr-config:
    content: |
      sonarr:
        main:
          base_url: ${SONARR_URL:?Set SONARR_URL}
          api_key: ${SONARR_API_KEY:?Set SONARR_API_KEY}
          quality_definition:
            type: series
volumes:
  config: {}
