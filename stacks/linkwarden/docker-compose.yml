services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.16.3@sha256:0664c28a039bda8ffa6663389e8536b2fc717219e329f85b83faca7efed3b144
    restart: unless-stopped
    ports:
      - ${LINKWARDEN_PORT:-3008}:3000
    environment:
      DATABASE_URL: postgresql://linkwarden:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/linkwarden
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${NEXT_PUBLIC_DISABLE_REGISTRATION:-false}
      MEILI_HOST: http://search:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}
    volumes:
      - archive:/data/data
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U linkwarden -d linkwarden
      interval: 5s
      timeout: 5s
      retries: 15
  search:
    image: getmeili/meilisearch:v1.13.3@sha256:bed3fb650e62da53145777204891159242f6ea4ce69e215b36223af4aa64a0ae
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - search:/meili_data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:7700/health
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  database: null
  archive: null
  search: null
