services:
  frontend:
    image: codewithcj/sparkyfitness:latest@sha256:864b052f7cbbc522f5bea2b2696c3734ba79e873abf9f144cb261ad3bd3539e5
    restart: unless-stopped
    ports:
      - ${SPARKYFITNESS_PORT:-3004}:80
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:?Set SPARKY_FITNESS_FRONTEND_URL}
      SPARKY_FITNESS_SERVER_HOST: server
      SPARKY_FITNESS_SERVER_PORT: '3010'
      NGINX_LISTEN_PORT: '80'
    depends_on:
      server:
        condition: service_started
  server:
    image: codewithcj/sparkyfitness_server:latest@sha256:375e0f2df6e8e4c54186cfe0cc6acdef6fcf02177314f287c8f037e29ce5d9f0
    restart: unless-stopped
    environment:
      SPARKY_FITNESS_DB_HOST: db
      SPARKY_FITNESS_DB_PORT: '5432'
      SPARKY_FITNESS_DB_NAME: sparkyfitness
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPARKY_FITNESS_APP_DB_USER: sparky_app
      SPARKY_FITNESS_APP_DB_PASSWORD: ${SPARKY_APP_DB_PASSWORD:?Set SPARKY_APP_DB_PASSWORD}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKY_FITNESS_API_ENCRYPTION_KEY:?Set SPARKY_FITNESS_API_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:?Set SPARKY_FITNESS_FRONTEND_URL}
      SPARKY_FITNESS_ADMIN_EMAIL: ${SPARKY_FITNESS_ADMIN_EMAIL:?Set SPARKY_FITNESS_ADMIN_EMAIL}
      SPARKY_FITNESS_SERVER_PORT: '3010'
      NODE_ENV: production
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - uploads:/app/SparkyFitnessServer/uploads
      - backups:/app/SparkyFitnessServer/backup
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 20s
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparkyfitness
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U sparky -d sparkyfitness
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  database: null
  uploads: null
  backups: null
