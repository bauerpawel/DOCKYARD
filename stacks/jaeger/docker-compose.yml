services:
  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    restart: unless-stopped
    command: [--config, /etc/jaeger/config.yaml]
    configs:
      - source: jaeger-config
        target: /etc/jaeger/config.yaml
    ports:
      - 127.0.0.1:${JAEGER_UI_PORT:-16686}:16686
      - 127.0.0.1:${JAEGER_OTLP_GRPC_PORT:-4317}:4317
      - 127.0.0.1:${JAEGER_OTLP_HTTP_PORT:-4318}:4318
    volumes:
      - data:/tmp
configs:
  jaeger-config:
    content: |
      service:
        extensions: [jaeger_storage, jaeger_query, healthcheckv2]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [jaeger_storage_exporter]
        telemetry:
          resource:
            service.name: jaeger
          logs:
            level: info
      extensions:
        healthcheckv2:
          use_v2: true
          http:
            endpoint: 0.0.0.0:13133
        jaeger_query:
          storage:
            traces: badger_store
          http:
            endpoint: 0.0.0.0:16686
          grpc:
            endpoint: 0.0.0.0:16685
        jaeger_storage:
          backends:
            badger_store:
              badger:
                directories:
                  keys: /tmp/jaeger/keys
                  values: /tmp/jaeger/values
                ephemeral: false
                ttl:
                  spans: ${JAEGER_RETENTION:-168h}
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch:
      exporters:
        jaeger_storage_exporter:
          trace_storage: badger_store
volumes:
  data: {}
