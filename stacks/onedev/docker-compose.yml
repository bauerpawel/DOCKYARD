services:
  onedev:
    image: 1dev/server:17.2.4@sha256:da5add944fc39270ea8f3cf05a98b9a589429e2e45e5ba3b99bc162bbd092fdd
    restart: unless-stopped
    tty: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      hibernate_dialect: io.onedev.server.persistence.PostgreSQLDialect
      hibernate_connection_driver_class: org.postgresql.Driver
      hibernate_connection_url: jdbc:postgresql://db:5432/onedev
      hibernate_connection_username: onedev
      hibernate_connection_password: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:${ONEDEV_PORT:-6610}:6610
      - ${ONEDEV_SSH_PORT:-6611}:6611
    volumes:
      - data:/opt/onedev
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: onedev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: onedev
    volumes:
      - database:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U onedev -d onedev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  data: {}
  database: {}
