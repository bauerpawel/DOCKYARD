services:
  taiga-db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: taiga
      POSTGRES_DB: taiga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U taiga -d taiga
      interval: 5s
      timeout: 5s
      retries: 30
  taiga-back:
    image: taigaio/taiga-back:latest@sha256:4beed8f62c9ffbbcea824aa01c48fa72a2c2f713be6732e2ee37d2e777843f51
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST: taiga-db
      TAIGA_SECRET_KEY: ${TAIGA_SECRET_KEY:?Set TAIGA_SECRET_KEY}
      TAIGA_SITES_SCHEME: https
      TAIGA_SITES_DOMAIN: ${TAIGA_DOMAIN:?Set TAIGA_DOMAIN}
      TAIGA_SUBPATH: ''
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      DEFAULT_FROM_EMAIL: ${SMTP_FROM:?Set SMTP_FROM}
      EMAIL_USE_TLS: 'True'
      EMAIL_USE_SSL: 'False'
      EMAIL_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      EMAIL_PORT: ${SMTP_PORT:-587}
      EMAIL_HOST_USER: ${SMTP_USER:?Set SMTP_USER}
      EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      RABBITMQ_USER: taiga
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      ENABLE_TELEMETRY: 'False'
    volumes:
      - taiga-static-data:/taiga-back/static
      - taiga-media-data:/taiga-back/media
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_healthy
      taiga-async-rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    platform: linux/amd64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1',8000),2).close()
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
  taiga-async:
    image: taigaio/taiga-back:latest@sha256:4beed8f62c9ffbbcea824aa01c48fa72a2c2f713be6732e2ee37d2e777843f51
    entrypoint:
      - /taiga-back/docker/async_entrypoint.sh
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST: taiga-db
      TAIGA_SECRET_KEY: ${TAIGA_SECRET_KEY:?Set TAIGA_SECRET_KEY}
      TAIGA_SITES_SCHEME: https
      TAIGA_SITES_DOMAIN: ${TAIGA_DOMAIN:?Set TAIGA_DOMAIN}
      TAIGA_SUBPATH: ''
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      DEFAULT_FROM_EMAIL: ${SMTP_FROM:?Set SMTP_FROM}
      EMAIL_USE_TLS: 'True'
      EMAIL_USE_SSL: 'False'
      EMAIL_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      EMAIL_PORT: ${SMTP_PORT:-587}
      EMAIL_HOST_USER: ${SMTP_USER:?Set SMTP_USER}
      EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      RABBITMQ_USER: taiga
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      ENABLE_TELEMETRY: 'False'
    volumes:
      - taiga-static-data:/taiga-back/static
      - taiga-media-data:/taiga-back/media
    depends_on:
      taiga-back:
        condition: service_healthy
      taiga-async-rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    platform: linux/amd64
  taiga-async-rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE_SECRET:?Set RABBITMQ_COOKIE_SECRET}
      RABBITMQ_DEFAULT_USER: taiga
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: taiga
    hostname: taiga-async-rabbitmq
    volumes:
      - taiga-async-rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 10s
      retries: 30
  taiga-front:
    image: taigaio/taiga-front:latest@sha256:570c8792ce802ff803a2275967e1d593cdd7c748e2d63163c4dab35fe2d2d646
    environment:
      TAIGA_URL: https://${TAIGA_DOMAIN:?Set TAIGA_DOMAIN}
      TAIGA_WEBSOCKETS_URL: wss://${TAIGA_DOMAIN:?Set TAIGA_DOMAIN}
      TAIGA_SUBPATH: ''
    restart: unless-stopped
    platform: linux/amd64
  taiga-events:
    image: taigaio/taiga-events:latest@sha256:92fc0822564f891700d74d23fa44951adf2845cf50c9e56bfd0ef29abdc1ab40
    environment:
      RABBITMQ_USER: taiga
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      TAIGA_SECRET_KEY: ${TAIGA_SECRET_KEY:?Set TAIGA_SECRET_KEY}
    depends_on:
      taiga-events-rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    platform: linux/amd64
  taiga-events-rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE_SECRET:?Set RABBITMQ_COOKIE_SECRET}
      RABBITMQ_DEFAULT_USER: taiga
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: taiga
    hostname: taiga-events-rabbitmq
    volumes:
      - taiga-events-rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 10s
      retries: 30
  taiga-protected:
    image: taigaio/taiga-protected:latest@sha256:fd4568a97a59225db90f422594cf0e05010be50c9a2a383c01477c5ee521d393
    environment:
      MAX_AGE: '360'
      SECRET_KEY: ${TAIGA_SECRET_KEY:?Set TAIGA_SECRET_KEY}
    restart: unless-stopped
    platform: linux/amd64
  taiga-gateway:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    ports:
      - 127.0.0.1:${TAIGA_PORT:-9001}:80
    volumes:
      - taiga-static-data:/taiga/static:ro
      - taiga-media-data:/taiga/media:ro
    depends_on:
      taiga-back:
        condition: service_healthy
      taiga-front:
        condition: service_started
      taiga-events:
        condition: service_started
      taiga-protected:
        condition: service_started
    restart: unless-stopped
    configs:
      - source: taiga-nginx
        target: /etc/nginx/conf.d/default.conf
configs:
  taiga-nginx:
    content: |
      server {
          listen 80 default_server;

          client_max_body_size 100M;
          charset utf-8;

          # Frontend
          location / {
              proxy_pass http://taiga-front/;
              proxy_pass_header Server;
              proxy_set_header Host $$http_host;
              proxy_redirect off;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme https;
          }

          # API
          location /api/ {
              proxy_pass http://taiga-back:8000/api/;
              proxy_pass_header Server;
              proxy_set_header Host $$http_host;
              proxy_redirect off;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme https;
          }

          # Admin
          location /admin/ {
              proxy_pass http://taiga-back:8000/admin/;
              proxy_pass_header Server;
              proxy_set_header Host $$http_host;
              proxy_redirect off;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme https;
          }

          # Static
          location /static/ {
              alias /taiga/static/;
          }

          # Media
          location /_protected/ {
              internal;
              alias /taiga/media/;
              add_header Content-disposition "attachment";
          }

          # Unprotected section
          location /media/exports/ {
              alias /taiga/media/exports/;
              add_header Content-disposition "attachment";
          }

          location /media/ {
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme https;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_pass http://taiga-protected:8003/;
              proxy_redirect off;
          }

          # Events
          location /events {
              proxy_pass http://taiga-events:8888/events;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_connect_timeout 7d;
              proxy_send_timeout 7d;
              proxy_read_timeout 7d;
          }
      }
volumes:
  database: {}
  taiga-static-data: {}
  taiga-media-data: {}
  taiga-async-rabbitmq-data: {}
  taiga-events-rabbitmq-data: {}
