services:
  opensearch:
    image: opensearchproject/opensearch:latest@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OS_ADMIN_PASSWORD:?Set OS_ADMIN_PASSWORD}
    ports:
      - 127.0.0.1:${OPENSEARCH_API_PORT:-9200}:9200
    volumes:
      - data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD-SHELL
        - curl --silent --fail --insecure --user "admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD" "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          >/dev/null
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 40
  security-init:
    image: opensearchproject/opensearch:latest@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e
    restart: 'no'
    user: 0:0
    entrypoint:
      - /bin/bash
      - -euc
    command:
      - |
        set -o pipefail
        if [ -f /dockyard/initialized ]; then
          echo "Users already initialized; use security tools for later changes."
          exit 0
        fi
        if [ ! -f config/kirk.pem ]; then
          plugins/opensearch-security/tools/install_demo_configuration.sh -y -i -s
        fi
        ADMIN_HASH="$$(plugins/opensearch-security/tools/hash.sh -p "$$OPENSEARCH_INITIAL_ADMIN_PASSWORD" | tail -n 1)"
        DASHBOARD_HASH="$$(plugins/opensearch-security/tools/hash.sh -p "$$OS_DASHBOARDS_PASSWORD" | tail -n 1)"
        test -n "$$ADMIN_HASH"
        test -n "$$DASHBOARD_HASH"
        umask 077
        cat > /tmp/dockyard-users.yml <<EOF
        _meta:
          type: internalusers
          config_version: 2
        admin:
          hash: "$$ADMIN_HASH"
          reserved: true
          backend_roles: [admin]
        kibanaserver:
          hash: "$$DASHBOARD_HASH"
          reserved: true
        EOF
        plugins/opensearch-security/tools/securityadmin.sh \
          -h opensearch -p 9200 -icl -nhnv \
          -cacert config/root-ca.pem -cert config/kirk.pem -key config/kirk-key.pem \
          -f /tmp/dockyard-users.yml -t internalusers
        touch /dockyard/initialized
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OS_ADMIN_PASSWORD:?Set OS_ADMIN_PASSWORD}
      OS_DASHBOARDS_PASSWORD: ${OS_DASHBOARDS_PASSWORD:?Set OS_DASHBOARDS_PASSWORD}
      OPENSEARCH_JAVA_OPTS: -Xms128m -Xmx256m
    volumes:
      - security-state:/dockyard
    depends_on:
      opensearch:
        condition: service_healthy
  dashboards:
    image: opensearchproject/opensearch-dashboards:latest@sha256:256d4cea5928868ac09bca642a0ac8285a2b7e4b7fdd45c4ec06e75a5cf3184c
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: kibanaserver
      OPENSEARCH_PASSWORD: ${OS_DASHBOARDS_PASSWORD:?Set OS_DASHBOARDS_PASSWORD}
      OPENSEARCH_SSL_VERIFICATIONMODE: none
      SERVER_HOST: 0.0.0.0
    ports:
      - 127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601
    depends_on:
      security-init:
        condition: service_completed_successfully
volumes:
  data: {}
  security-state: {}
