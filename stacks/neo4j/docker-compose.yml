services:
  neo4j:
    image: neo4j:2026.10.2-community@sha256:4a2fd4f41ce384aa7d6a74b399f22c202e154f3966119c28a18ed9a500904f5e
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - 127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474
      - 127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687
    volumes:
      - data:/data
volumes:
  data: {}
