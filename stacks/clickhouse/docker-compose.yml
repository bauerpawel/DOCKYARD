services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dockyard}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - 127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123
      - 127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000
    volumes:
      - data:/var/lib/clickhouse
      - logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
volumes:
  data: {}
  logs: {}
