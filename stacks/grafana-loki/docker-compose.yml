services:
  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    restart: unless-stopped
    command: [-config.file=/etc/loki/dockyard.yaml]
    configs:
      - source: loki-config
        target: /etc/loki/dockyard.yaml
    ports:
      - 127.0.0.1:${LOKI_PORT:-3100}:3100
    volumes:
      - loki:/loki
  grafana:
    image: grafana/grafana:13.0.14@sha256:5b9445edbd1a35e7a09a4c5688e03f2138d3f8a1b1b70619707d35dc4388a1bb
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/loki.yaml
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3030}:3000
    volumes:
      - grafana:/var/lib/grafana
configs:
  loki-config:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      schema_config:
        configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      analytics:
        reporting_enabled: false
  grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: true
          editable: false
volumes:
  loki: {}
  grafana: {}
