services:
  shoko:
    image: ghcr.io/shokoanime/server:latest@sha256:b841f8249c9edfba102e4072e2b2a3eae4179e5dd553f29e11b9898a44f1e836
    restart: unless-stopped
    shm_size: 256m
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - 127.0.0.1:${SHOKO_PORT:-8111}:8111
    volumes:
      - config:/home/shoko/.shoko
      - type: bind
        source: ${SHOKO_MEDIA_DIR:?Set SHOKO_MEDIA_DIR}
        target: /mnt/anime
        read_only: true
        bind:
          create_host_path: false
volumes:
  config: {}
