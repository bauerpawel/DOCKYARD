services:
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest@sha256:352e42dec74ecfd68d13bb198fbc6d9346e3a8c55003026e1814e59319a2176d
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:?Set ORIGIN}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      PARSER_HOST: parser
      PARSER_PORT: '5000'
    ports:
      - 127.0.0.1:${PROFILARR_PORT:-6868}:6868
    volumes:
      - config:/config
    depends_on:
      parser:
        condition: service_started
  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:latest@sha256:234084df7037e76b98c66f5ab220dc0d10ef8f34145ded57b9af257f057bdda6
    restart: unless-stopped
volumes:
  config: {}
