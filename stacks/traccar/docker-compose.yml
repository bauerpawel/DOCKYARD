services:
  traccar:
    image: traccar/traccar:6.17.0@sha256:b32d9346adf46df7c33c58577e17ad60f6feadd1f3cd87c876041f6c79317ef1
    restart: unless-stopped
    ports:
      - 127.0.0.1:${TRACCAR_WEB_PORT:-8082}:8082
      - ${TRACCAR_DEVICE_PORT:-5055}:5055/tcp
      - ${TRACCAR_DEVICE_PORT:-5055}:5055/udp
    volumes:
      - logs:/opt/traccar/logs
    configs:
      - source: traccar-config
        target: /opt/traccar/conf/traccar.xml
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U traccar -d traccar
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  database: null
  logs: null
configs:
  traccar-config:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE properties SYSTEM 'http://java.sun.com/dtd/properties.dtd'>
      <properties>
        <entry key='database.driver'>org.postgresql.Driver</entry>
        <entry key='database.url'>jdbc:postgresql://db:5432/traccar</entry>
        <entry key='database.user'>traccar</entry>
        <entry key='database.password'>${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}</entry>
      </properties>
