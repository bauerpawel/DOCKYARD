services:
  jellystat:
    image: cyfershepard/jellystat:latest@sha256:e61c759ec706da378bc8374e797da1dfd298ab30f804cefd82d192c301a888c7
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_IP: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: jfstat
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - 127.0.0.1:${JELLYSTAT_PORT:-3000}:3000
    volumes:
      - backup:/app/backend/backup-data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: jfstat
    volumes:
      - database:/var/lib/postgresql
    shm_size: 1gb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d jfstat"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  backup: {}
  database: {}
