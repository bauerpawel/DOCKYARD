services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: calendso
      POSTGRES_DB: calendso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U calendso -d calendso
      interval: 5s
      timeout: 5s
      retries: 30
  calcom:
    image: calcom/cal.com:v5.6.19@sha256:751923ca75fed7a264b8f72ac737c45f67b7b224a9e492676a296ec4f07b958f
    restart: unless-stopped
    platform: linux/amd64
    environment:
      DATABASE_HOST: db:5432
      DATABASE_URL: postgresql://calendso:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/calendso
      DATABASE_DIRECT_URL: postgresql://calendso:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/calendso
      NEXT_PUBLIC_WEBAPP_URL: ${CALCOM_URL:?Set CALCOM_URL}
      NEXT_PUBLIC_WEBSITE_URL: ${CALCOM_URL:?Set CALCOM_URL}
      NEXTAUTH_URL: ${CALCOM_URL:?Set CALCOM_URL}/api/auth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY:?Set CALENDSO_ENCRYPTION_KEY}
      CALCOM_TELEMETRY_DISABLED: '1'
      EMAIL_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Calendar}
      EMAIL_SERVER_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      EMAIL_SERVER_PORT: ${SMTP_PORT:-587}
      EMAIL_SERVER_USER: ${SMTP_USER:?Set SMTP_USER}
      EMAIL_SERVER_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
    ports:
      - 127.0.0.1:${CALCOM_PORT:-3000}:3000
    depends_on:
      db:
        condition: service_healthy
volumes:
  database: {}
