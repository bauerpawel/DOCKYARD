services:
  photoview:
    image: photoview/photoview:2.4.0@sha256:03fe7681ece6afcc49533fdaedec338fe6feacdb2211369161570769d55baeb2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHOTOVIEW_DATABASE_DRIVER: postgres
      PHOTOVIEW_POSTGRES_URL: postgres://photoview:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/photoview?sslmode=disable
      PHOTOVIEW_LISTEN_IP: 0.0.0.0
      PHOTOVIEW_LISTEN_PORT: "8080"
      PHOTOVIEW_MEDIA_CACHE: /home/photoview/media-cache
      TZ: ${TZ:-Etc/UTC}
    ports:
      - 127.0.0.1:${PHOTOVIEW_PORT:-8000}:8080
    volumes:
      - home:/home/photoview
      - type: bind
        source: ${PHOTOVIEW_PHOTOS_DIR:?Set PHOTOVIEW_PHOTOS_DIR}
        target: /photos
        read_only: true
        bind:
          create_host_path: false
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: photoview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: photoview
    volumes:
      - database:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U photoview -d photoview"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  home: {}
  database: {}
