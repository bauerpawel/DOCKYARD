services:
  server:
    image: ghcr.io/windmill-labs/windmill:main@sha256:bc1a4c9af16831a11054cf70c100d55d6ffe16145649e3dae684492f609b8831
    restart: unless-stopped
    ports:
      - ${WINDMILL_BIND_IP:-127.0.0.1}:${WINDMILL_PORT:-8001}:8000
    environment:
      DATABASE_URL: postgresql://windmill:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/windmill?sslmode=disable
      MODE: server
    volumes:
      - logs:/tmp/windmill/logs
    depends_on:
      db:
        condition: service_healthy
  worker:
    image: ghcr.io/windmill-labs/windmill:main@sha256:bc1a4c9af16831a11054cf70c100d55d6ffe16145649e3dae684492f609b8831
    restart: unless-stopped
    privileged: true
    environment:
      DATABASE_URL: postgresql://windmill:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/windmill?sslmode=disable
      MODE: worker
      WORKER_GROUP: default
      FAVOR_UNSHARE_PID: 'true'
    volumes:
      - dependency-cache:/tmp/windmill/cache
      - logs:/tmp/windmill/logs
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2048m
  native-worker:
    image: ghcr.io/windmill-labs/windmill:main@sha256:bc1a4c9af16831a11054cf70c100d55d6ffe16145649e3dae684492f609b8831
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://windmill:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/windmill?sslmode=disable
      MODE: worker
      WORKER_GROUP: native
      NATIVE_MODE: 'true'
      SLEEP_QUEUE: '200'
    volumes:
      - logs:/tmp/windmill/logs
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2048m
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: windmill
      POSTGRES_USER: windmill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U windmill -d windmill
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  database: null
  logs: null
  dependency-cache: null
