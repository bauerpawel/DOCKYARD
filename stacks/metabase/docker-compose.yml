services:
  metabase:
    image: metabase/metabase:v0.64.3@sha256:af7d417252600549ea64c3ed1be50bdce2714054f072426223458b74ee34e57c
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      MB_ENCRYPTION_SECRET_KEY: "${MB_ENCRYPTION_SECRET_KEY:?Set MB_ENCRYPTION_SECRET_KEY}"
      MB_SITE_URL: "${MB_SITE_URL:-http://localhost:3000}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  database:
