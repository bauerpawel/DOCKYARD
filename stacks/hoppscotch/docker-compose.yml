services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoppscotch
      POSTGRES_USER: hoppscotch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U hoppscotch -d hoppscotch
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: hoppscotch/hoppscotch:latest@sha256:b4ba7d797fc84f66d55160645453d58620d79490743ae5c74016b20b2516ff9c
    restart: 'no'
    working_dir: /dist/backend
    command:
      - sh
      - -c
      - pnpm exec prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://hoppscotch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/hoppscotch
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY}
      ENABLE_SUBPATH_BASED_ACCESS: 'true'
      VITE_BASE_URL: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL}
      VITE_SHORTCODE_BASE_URL: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL}
      VITE_ADMIN_URL: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL}/admin
      VITE_BACKEND_GQL_URL: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL}/backend/graphql
      VITE_BACKEND_API_URL: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL}/backend/v1
      VITE_BACKEND_WS_URL: ${HOPPSCOTCH_WS_URL:?Set HOPPSCOTCH_WS_URL}/backend/graphql
      WHITELISTED_ORIGINS: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL},app://localhost_3200,app://hoppscotch
      TRUST_PROXY: 'false'
    depends_on:
      db:
        condition: service_healthy
  hoppscotch:
    image: hoppscotch/hoppscotch:latest@sha256:b4ba7d797fc84f66d55160645453d58620d79490743ae5c74016b20b2516ff9c
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hoppscotch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/hoppscotch
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY}
      ENABLE_SUBPATH_BASED_ACCESS: 'true'
      VITE_BASE_URL: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL}
      VITE_SHORTCODE_BASE_URL: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL}
      VITE_ADMIN_URL: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL}/admin
      VITE_BACKEND_GQL_URL: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL}/backend/graphql
      VITE_BACKEND_API_URL: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL}/backend/v1
      VITE_BACKEND_WS_URL: ${HOPPSCOTCH_WS_URL:?Set HOPPSCOTCH_WS_URL}/backend/graphql
      WHITELISTED_ORIGINS: ${HOPPSCOTCH_URL:?Set HOPPSCOTCH_URL},app://localhost_3200,app://hoppscotch
      TRUST_PROXY: 'false'
    volumes:
      - signing-keys:/data
    ports:
      - 127.0.0.1:${HOPPSCOTCH_PORT:-3000}:80
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  database: {}
  signing-keys: {}
