services:
  migrate:
    image: flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35
    restart: "no"
    command: [migrate]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flagsmith:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/flagsmith
      DJANGO_SECRET_KEY: ${FLAGSMITH_SECRET_KEY:?Set FLAGSMITH_SECRET_KEY}
      ENVIRONMENT: production
  flagsmith:
    image: flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35
    restart: unless-stopped
    command: [serve]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://flagsmith:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/flagsmith
      DJANGO_SECRET_KEY: ${FLAGSMITH_SECRET_KEY:?Set FLAGSMITH_SECRET_KEY}
      ENVIRONMENT: production
      DJANGO_ALLOWED_HOSTS: "*"
      FLAGSMITH_DOMAIN: ${FLAGSMITH_DOMAIN:-localhost:8000}
      USE_POSTGRES_FOR_ANALYTICS: "true"
      TASK_RUN_METHOD: TASK_PROCESSOR
      ALLOW_REGISTRATION_WITHOUT_INVITE: "false"
      ENABLE_TELEMETRY: "false"
    ports:
      - 127.0.0.1:${FLAGSMITH_PORT:-8000}:8000
  task-processor:
    image: flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35
    restart: unless-stopped
    command: [run-task-processor]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://flagsmith:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/flagsmith
      DJANGO_SECRET_KEY: ${FLAGSMITH_SECRET_KEY:?Set FLAGSMITH_SECRET_KEY}
      ENVIRONMENT: production
      USE_POSTGRES_FOR_ANALYTICS: "true"
      TASK_RUN_METHOD: TASK_PROCESSOR
      ENABLE_TELEMETRY: "false"
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: flagsmith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: flagsmith
    volumes:
      - database:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U flagsmith -d flagsmith"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  database: {}
