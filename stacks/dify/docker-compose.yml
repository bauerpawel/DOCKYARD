  ssrf_proxy-common:
    content: "# Shared Squid configuration used by both ssrf_proxy and agent_ssrf_proxy.\n\n##################################\
      \ ACL Definitions ################################\nacl client_localnet src 0.0.0.1-0.255.255.255\t# RFC 1122 \"this\"\
      \ network (LAN)\nacl client_localnet src 10.0.0.0/8\t\t# RFC 1918 local private network (LAN)\nacl client_localnet src\
      \ 100.64.0.0/10\t\t# RFC 6598 shared address space (CGN)\nacl client_localnet src 169.254.0.0/16 \t# RFC 3927 link-local\
      \ (directly plugged) machines\nacl client_localnet src 172.16.0.0/12\t\t# RFC 1918 local private network (LAN)\nacl\
      \ client_localnet src 192.168.0.0/16\t\t# RFC 1918 local private network (LAN)\nacl client_localnet src fc00::/7   \
      \    \t# RFC 4193 local private network range\nacl client_localnet src fe80::/10      \t# RFC 4291 link-local (directly\
      \ plugged) machines\n\nacl to_private_networks dst 0.0.0.0/8\nacl to_private_networks dst 10.0.0.0/8\nacl to_private_networks\
      \ dst 100.64.0.0/10\nacl to_private_networks dst 127.0.0.0/8\nacl to_private_networks dst 169.254.0.0/16\nacl to_private_networks\
      \ dst 172.16.0.0/12\nacl to_private_networks dst 192.168.0.0/16\nacl to_private_networks dst 224.0.0.0/4\nacl to_private_networks\
      \ dst 240.0.0.0/4\nacl to_private_networks dst ::/128\nacl to_private_networks dst ::1/128\nacl to_private_networks\
      \ dst ::ffff:0:0/96    # IPv4-mapped\nacl to_private_networks dst ::/96            # deprecated IPv4-compatible\nacl\
      \ to_private_networks dst fc00::/7\nacl to_private_networks dst fe80::/10\n\nacl SSL_ports port 443\nacl Safe_ports\
      \ port 80\t\t# http\nacl Safe_ports port 21\t\t# ftp\nacl Safe_ports port 443\t\t# https\nacl Safe_ports port 70\t\t\
      # gopher\nacl Safe_ports port 210\t\t# wais\nacl Safe_ports port 1025-65535\t# unregistered ports\nacl Safe_ports port\
      \ 280\t\t# http-mgmt\nacl Safe_ports port 488\t\t# gss-http\nacl Safe_ports port 591\t\t# filemaker\nacl Safe_ports\
      \ port 777\t\t# multiling http\nacl CONNECT method CONNECT\n\n################################## Common Parameters ################################\n\
      \ntcp_outgoing_address 0.0.0.0\n\n################################## Proxy Server ################################\n\
      coredump_dir $${COREDUMP_DIR}\nrefresh_pattern ^ftp:\t\t1440\t20%\t10080\nrefresh_pattern ^gopher:\t1440\t0%\t1440\n\
      refresh_pattern -i (/cgi-bin/|\\?) 0\t0%\t0\nrefresh_pattern \\/(Packages|Sources)(|\\.bz2|\\.gz|\\.xz)$$ 0 0% 0 refresh-ims\n\
      refresh_pattern \\/Release(|\\.gpg)$$ 0 0% 0 refresh-ims\nrefresh_pattern \\/InRelease$$ 0 0% 0 refresh-ims\nrefresh_pattern\
      \ \\/(Translation-.*)(|\\.bz2|\\.gz|\\.xz)$$ 0 0% 0 refresh-ims\nrefresh_pattern .\t\t0\t20%\t4320\n\n##################################\
      \ Request Buffer ################################\nclient_request_buffer_max_size 100 MB\n\n##################################\
      \ Performance & Concurrency ###############################\nmax_filedescriptors 65536\nconnect_timeout 30 seconds\n\
      request_timeout 2 minutes\nread_timeout 2 minutes\nclient_lifetime 5 minutes\nshutdown_lifetime 30 seconds\n\nserver_persistent_connections\
      \ on\nclient_persistent_connections on\npersistent_request_timeout 30 seconds\npconn_timeout 1 minute\n\nclient_db on\n\
      server_idle_pconn_timeout 2 minutes\nclient_idle_pconn_timeout 2 minutes\n\nquick_abort_min 16 KB\nquick_abort_max 16\
      \ MB\nquick_abort_pct 95\n\nmemory_cache_mode disk\ncache_mem 256 MB\nmaximum_object_size_in_memory 512 KB\n\ndns_timeout\
      \ 30 seconds\ndns_retransmit_interval 5 seconds\n\nlogformat dify_log %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un\
      \ %Sh/%<a %mt\naccess_log daemon:/var/log/squid/access.log dify_log\nlogfile_rotate 10\n"
  ssrf_proxy-entry:
    content: |
      #!/bin/bash

      # Modified based on Squid OCI image entrypoint

      # This entrypoint aims to forward the squid logs to stdout to assist users of
      # common container related tooling (e.g., kubernetes, docker-compose, etc) to
      # access the service logs.

      # Moreover, it invokes the squid binary, leaving all the desired parameters to
      # be provided by the "command" passed to the spawned container. If no command
      # is provided by the user, the default behavior (as per the CMD statement in
      # the Dockerfile) will be to use Ubuntu's default configuration [1] and run
      # squid with the "-NYC" options to mimic the behavior of the Ubuntu provided
      # systemd unit.

      # [1] The default configuration is changed in the Dockerfile to allow local
      # network connections. See the Dockerfile for further information.

      echo "[ENTRYPOINT] re-create snakeoil self-signed certificate removed in the build process"
      if [ ! -f /etc/ssl/private/ssl-cert-snakeoil.key ]; then
          /usr/sbin/make-ssl-cert generate-default-snakeoil --force-overwrite > /dev/null 2>&1
      fi

      tail -F /var/log/squid/access.log 2>/dev/null &
      tail -F /var/log/squid/error.log 2>/dev/null &
      tail -F /var/log/squid/store.log 2>/dev/null &
      tail -F /var/log/squid/cache.log 2>/dev/null &

      ALLOW_PRIVATE_CONF=/etc/squid/dify_allow_private.conf
      SANDBOX_PROXY_CONF=/etc/squid/dify_sandbox_proxy.conf

      write_optional_private_allowlist() {
          local env_name="$$1"
          local acl_name="$$2"
          local acl_type="$$3"
          local raw_values="$${!env_name:-}"

          raw_values="$${raw_values//,/ }"

          if [ -z "$${raw_values//[[:space:]]/}" ]; then
              return
          fi

          printf 'acl %s %s' "$$acl_name" "$$acl_type" >> "$$ALLOW_PRIVATE_CONF"
          for value in $$raw_values; do
              printf ' %s' "$$value" >> "$$ALLOW_PRIVATE_CONF"
          done
          printf '\nhttp_access allow client_localnet %s\n' "$$acl_name" >> "$$ALLOW_PRIVATE_CONF"
      }

      {
          echo "# Generated by docker-entrypoint.sh."
          echo "# Allows selected private targets before the default private-network deny rule."
      } > "$$ALLOW_PRIVATE_CONF"
      write_optional_private_allowlist "SSRF_PROXY_ALLOW_PRIVATE_IPS" "dify_allowed_private_networks" "dst"
      write_optional_private_allowlist "SSRF_PROXY_ALLOW_PRIVATE_DOMAINS" "dify_allowed_private_domains" "dstdomain"

      {
          echo "# Generated by docker-entrypoint.sh."
          echo "# Enables the middleware-only sandbox host bridge when configured."
      } > "$$SANDBOX_PROXY_CONF"

      if [ -n "$${SSRF_SANDBOX_PROXY_PORT:-}" ]; then
          sandbox_proxy_host="$${SSRF_SANDBOX_PROXY_HOST:-sandbox}"
          sandbox_proxy_target_port="$${SANDBOX_PORT:-8194}"

          {
              printf 'http_port %s accel vhost\n' "$$SSRF_SANDBOX_PROXY_PORT"
              printf 'cache_peer %s parent %s 0 no-query originserver name=dify_sandbox\n' \
                  "$$sandbox_proxy_host" \
                  "$$sandbox_proxy_target_port"
              printf 'acl dify_sandbox_proxy_port localport %s\n' "$$SSRF_SANDBOX_PROXY_PORT"
              printf 'http_access allow dify_sandbox_proxy_port\n'
          } >> "$$SANDBOX_PROXY_CONF"
      fi

      # Replace environment variables in a template file.
      expand_env() {
          awk '{
              while(match($$0, /\$${[A-Za-z_][A-Za-z_0-9]*}/)) {
                  var = substr($$0, RSTART+2, RLENGTH-3)
                  val = ENVIRON[var]
                  $$0 = substr($$0, 1, RSTART-1) val substr($$0, RSTART+RLENGTH)
              }
              print
          }' "$$1"
      }

      # Replace environment variables in the templates and output to squid.conf
      echo "[ENTRYPOINT] replacing environment variables in the templates"
      expand_env /etc/squid/squid.conf.template > /etc/squid/squid.conf
      expand_env /etc/squid/dify_common.conf.template > /etc/squid/dify_common.conf

      /usr/sbin/squid -Nz
      echo "[ENTRYPOINT] starting squid"
      /usr/sbin/squid -f /etc/squid/squid.conf -NYC 1
  agent_ssrf_proxy-main:
    content: |
      # Dedicated Squid config for the dify-agent local_sandbox SSRF proxy.
      # All traffic on this proxy is restricted to:
      #   - agent_backend /agent-stub/* endpoints
      #   - Dify API /files/* endpoints (signed upload/download URLs)
      # External internet is allowed; all other private-network destinations are denied.

      include /etc/squid/dify_common.conf

      acl dst_agent_backend dstdomain agent_backend
      acl dst_dify_api dstdomain api
      acl path_files urlpath_regex -i ^/files/
      acl path_agent_stub urlpath_regex -i ^/agent-stub/

      http_port $${HTTP_PORT}

      http_access deny !Safe_ports
      http_access deny CONNECT !SSL_ports
      http_access allow dst_agent_backend path_agent_stub
      http_access allow dst_dify_api path_files
      include /etc/squid/dify_allow_private.conf
      http_access deny to_private_networks
      http_access allow all
