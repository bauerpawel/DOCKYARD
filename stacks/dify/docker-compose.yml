      \ to_private_networks dst fc00::/7\nacl to_private_networks dst fe80::/10\n\nacl SSL_ports port 443\nacl Safe_ports\
      \ port 80\t\t# http\nacl Safe_ports port 21\t\t# ftp\nacl Safe_ports port 443\t\t# https\nacl Safe_ports port 70\t\t\
