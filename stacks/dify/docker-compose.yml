  agent_ssrf_proxy-entry:
    content: |
      #!/bin/bash

      tail -F /var/log/squid/access.log 2>/dev/null &
      tail -F /var/log/squid/error.log 2>/dev/null &
      tail -F /var/log/squid/store.log 2>/dev/null &
      tail -F /var/log/squid/cache.log 2>/dev/null &

      ALLOW_PRIVATE_CONF=/etc/squid/dify_allow_private.conf

      write_optional_private_allowlist() {
          local env_name="$$1"
          local acl_name="$$2"
          local acl_type="$$3"
          local raw_values="$${!env_name:-}"
          local -a tokens=()

          raw_values="$${raw_values//,/ }"
          raw_values="$${raw_values//$$'\n'/ }"
          raw_values="$${raw_values//$$'\r'/ }"

          if [ -z "$${raw_values//[[:space:]]/}" ]; then
              return
          fi

          read -r -a tokens <<< "$$raw_values"

          printf 'acl %s %s' "$$acl_name" "$$acl_type" >> "$$ALLOW_PRIVATE_CONF"
          for value in "$${tokens[@]}"; do
              [ -z "$${value//[[:space:]]/}" ] && continue
              printf ' %s' "$$value" >> "$$ALLOW_PRIVATE_CONF"
          done
          printf '\nhttp_access allow client_localnet %s\n' "$$acl_name" >> "$$ALLOW_PRIVATE_CONF"
      }

      {
          echo "# Generated by docker-agent-entrypoint.sh."
          echo "# Allows selected private targets before the default private-network deny rule."
      } > "$$ALLOW_PRIVATE_CONF"
      write_optional_private_allowlist "SSRF_PROXY_ALLOW_PRIVATE_IPS" "dify_allowed_private_networks" "dst"
      write_optional_private_allowlist "SSRF_PROXY_ALLOW_PRIVATE_DOMAINS" "dify_allowed_private_domains" "dstdomain"

      expand_env() {
          awk '{
              while(match($$0, /\$${[A-Za-z_][A-Za-z_0-9]*}/)) {
                  var = substr($$0, RSTART+2, RLENGTH-3)
                  val = ENVIRON[var]
                  $$0 = substr($$0, 1, RSTART-1) val substr($$0, RSTART+RLENGTH)
              }
              print
          }' "$$1"
      }

      echo "[ENTRYPOINT] replacing environment variables in the templates"
      expand_env /etc/squid/squid.conf.template > /etc/squid/squid.conf
      expand_env /etc/squid/dify_common.conf.template > /etc/squid/dify_common.conf

      /usr/sbin/squid -Nz
      echo "[ENTRYPOINT] starting squid"
      /usr/sbin/squid -f /etc/squid/squid.conf -NYC 1
  nginx-default:
    content: "map $$http_x_forwarded_proto $$dify_scheme { default $$http_x_forwarded_proto; \"\" $$scheme; }\n# Please do\
      \ not directly edit this file. Instead, modify the .env variables related to NGINX configuration.\n\nserver {\n    listen\
      \ 80;\n    server_name _;\n    client_max_body_size 100M;\n    resolver 127.0.0.11 valid=30s ipv6=off;\n\n    location\
      \ /console/api {\n      set $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n      include proxy.conf;\n\
      \    }\n\n    location /api {\n      set $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n      include\
      \ proxy.conf;\n    }\n\n    location /socket.io/ {\n      set $$socket_io_upstream api_websocket:5001;\n      proxy_pass\
      \ http://$$socket_io_upstream;\n      include proxy.conf;\n      proxy_set_header Upgrade $$http_upgrade;\n      proxy_set_header\
      \ Connection \"upgrade\";\n      proxy_cache_bypass $$http_upgrade;\n    }\n\n    location /v1 {\n      set $$api_upstream\
      \ api:5001;\n      proxy_pass http://$$api_upstream;\n      include proxy.conf;\n    }\n\n    location /openapi {\n\
      \      set $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n      include proxy.conf;\n    }\n\n \
      \   location /files {\n      set $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n      include proxy.conf;\n\
      \    }\n\n    location /explore {\n      set $$web_upstream web:3000;\n      proxy_pass http://$$web_upstream;\n   \
      \   include proxy.conf;\n    }\n\n    location /e/ {\n      set $$plugin_daemon_upstream plugin_daemon:5002;\n     \
      \ proxy_pass http://$$plugin_daemon_upstream;\n      proxy_set_header Dify-Hook-Url $$scheme://$$host$$request_uri;\n\
      \      include proxy.conf;\n    }\n\n    location / {\n      set $$web_upstream web:3000;\n      proxy_pass http://$$web_upstream;\n\
      \      include proxy.conf;\n    }\n\n    location /mcp {\n      set $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n\
      \      include proxy.conf;\n    }\n\n    location /triggers {\n      set $$api_upstream api:5001;\n      proxy_pass\
      \ http://$$api_upstream;\n      include proxy.conf;\n    }\n    \n    # placeholder for acme challenge location\n  \
      \  \n\n    # placeholder for https config defined in https.conf.template\n    \n}\n"
  nginx-proxy:
    content: |
      # Please do not directly edit this file. Instead, modify the .env variables related to NGINX configuration.

      proxy_set_header Host $$host;
      # real_ip configuration must validate upstream proxies before replacing $$remote_addr.
      proxy_set_header X-Forwarded-For $$remote_addr;
      proxy_set_header X-Forwarded-Proto $$dify_scheme;
      proxy_set_header X-Forwarded-Port $$server_port;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
