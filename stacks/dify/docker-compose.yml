    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ${DIFY_URL:?Set DIFY_URL}
      CONSOLE_WEB_URL: ${DIFY_URL:?Set DIFY_URL}
      SERVICE_API_URL: ${DIFY_URL:?Set DIFY_URL}
      APP_API_URL: ${DIFY_URL:?Set DIFY_URL}
      APP_WEB_URL: ${DIFY_URL:?Set DIFY_URL}
      FILES_URL: ${DIFY_URL:?Set DIFY_URL}
      INTERNAL_FILES_URL: http://api:5001
      TRIGGER_URL: ${DIFY_URL:?Set DIFY_URL}
      ENDPOINT_URL_TEMPLATE: ${DIFY_URL:?Set DIFY_URL}/e/{hook_id}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      INIT_PASSWORD: ${INIT_PASSWORD:?Set INIT_PASSWORD}
      DEPLOY_ENV: PRODUCTION
      LOG_LEVEL: INFO
      DEBUG: 'false'
      FLASK_DEBUG: 'false'
      DB_TYPE: postgresql
      DB_HOST: db_postgres
      DB_PORT: '5432'
      DB_USERNAME: dify
      DB_DATABASE: dify
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_DB: '0'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_GRPC_ENDPOINT: grpc://weaviate:50051
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:?Set WEAVIATE_API_KEY}
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:?Set SANDBOX_API_KEY}
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:?Set PLUGIN_DAEMON_KEY}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:?Set PLUGIN_DIFY_INNER_API_KEY}
      AGENT_BACKEND_BASE_URL: http://agent_backend:5050
      AGENT_BACKEND_API_TOKEN: ${DIFY_AGENT_API_TOKEN:?Set DIFY_AGENT_API_TOKEN}
      ENABLE_COLLABORATION_MODE: 'true'
      WEB_API_CORS_ALLOW_ORIGINS: ${DIFY_URL:?Set DIFY_URL}
