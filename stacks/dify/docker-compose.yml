      SERVER_WORKER_AMOUNT: '1'
      SERVER_WORKER_CLASS: geventwebsocket.gunicorn.workers.GeventWebSocketWorker
      SERVER_WORKER_CONNECTIONS: '1000'
      GUNICORN_TIMEOUT: '360'
    volumes:
      - app-storage:/app/api/storage
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - ssrf_proxy_network
      - default
  init_permissions:
    image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    restart: 'no'
    user: 0:0
    command:
      - sh
      - -ec
      - if [ ! -f /app/api/storage/.init_permissions ]; then chown -R 1001:1001 /app/api/storage; touch /app/api/storage/.init_permissions;
        fi
    volumes:
      - app-storage:/app/api/storage
  web:
    image: langgenius/dify-web:1.18.0@sha256:e55a6bf1addf109c3655567663f906624f0980061efed864e0f07d23c71fa385
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ${DIFY_URL:?Set DIFY_URL}
      SERVER_CONSOLE_API_URL: http://api:5001
      APP_API_URL: ${DIFY_URL:?Set DIFY_URL}
      NEXT_PUBLIC_SOCKET_URL: ${DIFY_SOCKET_URL:?Set DIFY_SOCKET_URL}
      NEXT_TELEMETRY_DISABLED: '1'
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MARKETPLACE_URL: https://marketplace.dify.ai
    depends_on:
      api:
        condition: service_healthy
  db_postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: dify
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dify -d dify
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - max_connections=200
    configs:
      - source: database-init
        target: /docker-entrypoint-initdb.d/10-dify-plugin.sql
  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDISCLI_AUTH"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
  weaviate:
    image: semitechnologies/weaviate:1.39.13@sha256:ad2b986bbe4666fbd5302a5ee0cc6c74a048c4c769198d46147ea232d46a2dd8
    restart: unless-stopped
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: '25'
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:?Set WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS: dify
      AUTHORIZATION_ADMINLIST_ENABLED: 'true'
      AUTHORIZATION_ADMINLIST_USERS: dify
      DISABLE_TELEMETRY: 'true'
    volumes:
      - vectors:/var/lib/weaviate
  sandbox:
    image: langgenius/dify-sandbox:0.2.15@sha256:750e1111426ef31a9217b81c98cccfb750f17b182af3221102e420afa9f0928e
    restart: unless-stopped
    environment:
      API_KEY: ${SANDBOX_API_KEY:?Set SANDBOX_API_KEY}
      GIN_MODE: release
      WORKER_TIMEOUT: '15'
      ENABLE_NETWORK: 'true'
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: '8194'
    volumes:
      - sandbox-dependencies:/dependencies
      - sandbox-config:/conf
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8194/health
    networks:
      - ssrf_proxy_network
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local@sha256:34412a22d1e1d1a6c73727fef88cffbcdd9be7a21bf9ad3076b4bf5c1b88fd9b
    restart: unless-stopped
    environment:
      DB_TYPE: postgresql
      DB_HOST: db_postgres
      DB_PORT: '5432'
      DB_USERNAME: dify
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDIS_DB: '0'
      SERVER_PORT: '5002'
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:?Set PLUGIN_DAEMON_KEY}
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:?Set PLUGIN_DIFY_INNER_API_KEY}
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      FORCE_VERIFYING_SIGNATURE: 'true'
      PLUGIN_PYTHON_ENV_INIT_TIMEOUT: '120'
      PLUGIN_MAX_EXECUTION_TIMEOUT: '600'
    volumes:
      - plugins:/app/storage
    depends_on:
      db_postgres:
        condition: service_healthy
    networks:
      - ssrf_proxy_network
      - default
  agent_backend:
    image: langgenius/dify-agent-backend:1.18.0@sha256:80d638d7114bb0fbe954952e37da1f464b61969ff870c0b173963b9f2b91e06e
    restart: unless-stopped
    environment:
      DIFY_AGENT_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      DIFY_AGENT_PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      DIFY_AGENT_PLUGIN_DAEMON_API_KEY: ${PLUGIN_DAEMON_KEY:?Set PLUGIN_DAEMON_KEY}
      DIFY_AGENT_INNER_API_URL: http://api:5001
      DIFY_AGENT_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:?Set PLUGIN_DIFY_INNER_API_KEY}
      DIFY_AGENT_RUNTIME_BACKEND: local
      DIFY_AGENT_LOCAL_SANDBOX_ENDPOINT: http://local_sandbox:5004
      DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN: ${DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN:?Set DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN}
      DIFY_AGENT_STUB_API_BASE_URL: http://agent_backend:5050/agent-stub
      DIFY_AGENT_SANDBOX_FILES_BASE_URL: http://api:5001
      DIFY_AGENT_SERVER_SECRET_KEY: ${DIFY_AGENT_SERVER_SECRET_KEY:?Set DIFY_AGENT_SERVER_SECRET_KEY}
      DIFY_AGENT_API_TOKEN: ${DIFY_AGENT_API_TOKEN:?Set DIFY_AGENT_API_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      plugin_daemon:
        condition: service_started
    networks:
      - default
      - agent_sandbox_network
  local_sandbox:
    image: langgenius/dify-agent-local-sandbox:1.18.0@sha256:4c0bdcae2069df2bc4ba4e32547ac898cb66204378634f630d874c51ad81b1fd
    restart: unless-stopped
    command:
      - shellctl
      - serve
      - --listen
      - 0.0.0.0:5004
      - --require-auth-token
    environment:
      SHELLCTL_AUTH_TOKEN: ${DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN:?Set DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN}
      HTTP_PROXY: http://agent_ssrf_proxy:3128
      HTTPS_PROXY: http://agent_ssrf_proxy:3128
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - agent-home:/home/dify
      - agent-workspace:/workspace
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5004/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agent_sandbox_network
      - local_sandbox_proxy_network
  ssrf_proxy:
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - /docker-entrypoint-mount.sh
    environment:
      HTTP_PORT: '3128'
      COREDUMP_DIR: /var/spool/squid
    configs:
      - source: ssrf_proxy-main
        target: /etc/squid/squid.conf.template
      - source: ssrf_proxy-common
        target: /etc/squid/dify_common.conf.template
      - source: ssrf_proxy-entry
        target: /docker-entrypoint-mount.sh
    networks:
      - default
      - ssrf_proxy_network
  agent_ssrf_proxy:
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - /docker-entrypoint-mount.sh
    environment:
      HTTP_PORT: '3128'
      COREDUMP_DIR: /var/spool/squid
    configs:
      - source: agent_ssrf_proxy-main
        target: /etc/squid/squid.conf.template
      - source: agent_ssrf_proxy-common
        target: /etc/squid/dify_common.conf.template
      - source: agent_ssrf_proxy-entry
        target: /docker-entrypoint-mount.sh
    networks:
      - default
      - local_sandbox_proxy_network
  nginx:
