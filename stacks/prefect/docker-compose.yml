services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_DB: prefect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U prefect -d prefect
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8.6-alpine@sha256:f4ed7d6732f9a5dcc6b64e2b347860b9f329334bfd4839a672f78cd981a8bba6
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - --appendonly
      - 'yes'
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 30
  server:
    image: prefecthq/prefect:3-latest@sha256:affb0ef57af6237c9f37d4e3e37cdf5501b69fd61720649b0ccc17978a14ae69
    restart: unless-stopped
    command:
      - prefect
      - server
      - start
      - --no-services
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/prefect
      PREFECT_SERVER_EVENTS_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_SERVER_EVENTS_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: '6379'
      PREFECT_REDIS_MESSAGING_DB: '0'
      PREFECT_REDIS_MESSAGING_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: ${PREFECT_URL:?Set PREFECT_URL}/api
      PREFECT_SERVER_API_AUTH_STRING: admin:${PREFECT_API_PASSWORD:?Set PREFECT_API_PASSWORD}
    ports:
      - 127.0.0.1:${PREFECT_PORT:-4200}:4200
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u,os,base64; h=base64.b64encode(os.environ['PREFECT_SERVER_API_AUTH_STRING'].encode()).decode();
          u.urlopen(u.Request('http://localhost:4200/api/health',headers={'Authorization':'Basic '+h}),timeout=3)
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  services:
    image: prefecthq/prefect:3-latest@sha256:affb0ef57af6237c9f37d4e3e37cdf5501b69fd61720649b0ccc17978a14ae69
    restart: unless-stopped
    command:
      - prefect
      - server
      - services
      - start
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/prefect
      PREFECT_SERVER_EVENTS_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_SERVER_EVENTS_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: '6379'
      PREFECT_REDIS_MESSAGING_DB: '0'
      PREFECT_REDIS_MESSAGING_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    depends_on:
      server:
        condition: service_healthy
  worker:
    image: prefecthq/prefect:3-latest@sha256:affb0ef57af6237c9f37d4e3e37cdf5501b69fd61720649b0ccc17978a14ae69
    restart: unless-stopped
    command:
      - prefect
      - worker
      - start
      - --pool
      - local-pool
      - --type
      - process
    environment:
      PREFECT_API_URL: http://server:4200/api
      PREFECT_API_AUTH_STRING: admin:${PREFECT_API_PASSWORD:?Set PREFECT_API_PASSWORD}
    volumes:
      - flows:/opt/prefect/flows
    depends_on:
      server:
        condition: service_healthy
volumes:
  database: {}
  redis: {}
  flows: {}
