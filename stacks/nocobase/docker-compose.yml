services:
  nocobase:
    image: nocobase/nocobase:2.2.37-full@sha256:4d219e0965c3f36b35d94da301188455a8aa18a70eb92f6a99eeea16f9b04298
    restart: unless-stopped
    init: true
    ports:
      - ${NOCOBASE_PORT:-13000}:80
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      ENCRYPTION_FIELD_KEY: ${ENCRYPTION_FIELD_KEY:?Set ENCRYPTION_FIELD_KEY}
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      INIT_ROOT_EMAIL: ${INIT_ROOT_EMAIL:?Set INIT_ROOT_EMAIL}
      INIT_ROOT_PASSWORD: ${INIT_ROOT_PASSWORD:?Set INIT_ROOT_PASSWORD}
      INIT_ROOT_NICKNAME: Administrator
    volumes:
      - storage:/app/nocobase/storage
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocobase
      POSTGRES_USER: nocobase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U nocobase -d nocobase
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - wal_level=logical
volumes:
  database: null
  storage: null
