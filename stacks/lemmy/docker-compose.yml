services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: lemmy
      POSTGRES_DB: lemmy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U lemmy -d lemmy
      interval: 5s
      timeout: 5s
      retries: 30
  image-init:
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    restart: 'no'
    user: 0:0
    command:
      - sh
      - -ec
      - chown 991:991 /mnt
    volumes:
      - images:/mnt
  pictrs:
    image: asonix/pictrs:0.5.25@sha256:6c64d7d282b67931716861b92bce48392791b57b571f5b7bbe132a10b4f0c39e
    restart: unless-stopped
    user: 991:991
    environment:
      PICTRS__SERVER__API_KEY: ${PICTRS_API_KEY:?Set PICTRS_API_KEY}
    volumes:
      - images:/mnt
    depends_on:
      image-init:
        condition: service_completed_successfully
  lemmy:
    image: dessalines/lemmy:0.19.21@sha256:839d72704b10d574a21dacab046d9369e241366e4092b950d801e821f779de29
    restart: unless-stopped
    environment:
      RUST_LOG: warn
    configs:
      - source: lemmy-config
        target: /config/config.hjson
    depends_on:
      db:
        condition: service_healthy
      pictrs:
        condition: service_started
  lemmy-ui:
    image: dessalines/lemmy-ui:0.19.21@sha256:d78d073a888c780f83e10850867841eca03261c8c459b65465fa337b4071768d
    restart: unless-stopped
    environment:
      LEMMY_UI_LEMMY_INTERNAL_HOST: lemmy:8536
      LEMMY_UI_LEMMY_EXTERNAL_HOST: ${LEMMY_HOSTNAME:?Set LEMMY_HOSTNAME}
      LEMMY_UI_HTTPS: 'true'
    volumes:
      - themes:/app/extra_themes
    depends_on:
      lemmy:
        condition: service_started
  gateway:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    restart: unless-stopped
    ports:
      - 127.0.0.1:${LEMMY_PORT:-10633}:8536
    configs:
      - source: lemmy-nginx
        target: /etc/nginx/nginx.conf
    depends_on:
      lemmy-ui:
        condition: service_started
      lemmy:
        condition: service_started
configs:
  lemmy-config:
    content: |
      {
        "database": {
          "host": "db",
          "user": "lemmy",
          "password": "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}",
          "database": "lemmy",
          "port": 5432
        },
        "hostname": "${LEMMY_HOSTNAME:?Set LEMMY_HOSTNAME}",
        "bind": "0.0.0.0",
        "port": 8536,
        "tls_enabled": true,
        "pictrs": {
          "url": "http://pictrs:8080/",
          "api_key": "${PICTRS_API_KEY:?Set PICTRS_API_KEY}"
        },
        "setup": {
          "admin_username": "${LEMMY_ADMIN_USERNAME:-admin}",
          "admin_password": "${LEMMY_ADMIN_PASSWORD:?Set LEMMY_ADMIN_PASSWORD}",
          "site_name": "${LEMMY_SITE_NAME:-My community}",
          "admin_email": "${LEMMY_ADMIN_EMAIL:?Set LEMMY_ADMIN_EMAIL}"
        },
        "email": {
          "smtp_server": "${SMTP_HOST:?Set SMTP_HOST}:${SMTP_PORT:-587}",
          "smtp_login": "${SMTP_USER:?Set SMTP_USER}",
          "smtp_password": "${SMTP_PASSWORD:?Set SMTP_PASSWORD}",
          "smtp_from_address": "${SMTP_FROM:?Set SMTP_FROM}",
          "tls_type": "starttls"
        }
      }
  lemmy-nginx:
    content: |
      # Adapted from LemmyNet/lemmy-ansible; ActivityPub requests use the backend.
      worker_processes auto;
      events { worker_connections 1024; }
      http {
        resolver 127.0.0.11 valid=5s ipv6=off;
        map "$$request_method:$$http_accept" $$proxpass {
          default "http://lemmy-ui:1234";
          "~^(?:GET|HEAD):.*?application\/(?:activity|ld)\+json" "http://lemmy:8536";
          "~^(?!(GET|HEAD)).*:" "http://lemmy:8536";
        }
        server {
          listen 8536;
          server_name _;
          server_tokens off;
          client_max_body_size 20M;
          set $$backend "lemmy:8536";
          set $$frontend "lemmy-ui:1234";
          proxy_set_header Host $$http_host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_buffering off;
          location / { proxy_pass $$proxpass; }
          location = /.well-known/security.txt { proxy_pass http://$$frontend; }
          location ~ ^/(api|pictrs|feeds|nodeinfo|\.well-known|version|sitemap\.xml) {
            proxy_pass http://$$backend;
          }
        }
      }
volumes:
  database: {}
  images: {}
  themes: {}
