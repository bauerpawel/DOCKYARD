services:
  app:
    image: onetimesecret/onetimesecret:v0.26.19@sha256:eb630051046042195a1dee73367f4f02a33ab3275bdc4d77a5d2c3dba88d3f0e
    restart: unless-stopped
    entrypoint: ['./bin/entrypoint.sh']
    ports:
      - 127.0.0.1:${ONETIME_PORT:-3000}:3000
    environment:
      RACK_ENV: production
      AUTHENTICATION_MODE: simple
      SECRET: ${SECRET:?Set SECRET}
      VALKEY_URL: redis://:${VALKEY_PASSWORD:?Set VALKEY_PASSWORD}@maindb:6379/0
      HOST: ${ONETIME_HOST:?Set ONETIME_HOST}
      SSL: ${ONETIME_SSL:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    depends_on:
      maindb:
        condition: service_healthy
  maindb:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD}
    command: ['sh', '-ec', 'exec valkey-server --appendonly yes --requirepass "$$REDISCLI_AUTH" --databases 1']
    volumes:
      - data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  data:
