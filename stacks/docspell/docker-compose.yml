# Current upstream Docspell application images support linux/amd64 only.
services:
  restserver:
    image: ghcr.io/docspell/restserver:latest@sha256:bc8f0c0e072726aca121f07b9f4519ea8360ee3e0a6464f4cd960d3260093826
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${DOCSPELL_PORT:-7880}:7880"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      DOCSPELL_SERVER_INTERNAL__URL: http://restserver:7880
      DOCSPELL_SERVER_ADMIN__ENDPOINT_SECRET: "${DOCSPELL_ADMIN_SECRET:?Set DOCSPELL_ADMIN_SECRET}"
      DOCSPELL_SERVER_AUTH_SERVER__SECRET: "${DOCSPELL_AUTH_SECRET:?Set DOCSPELL_AUTH_SECRET}"
      DOCSPELL_SERVER_BACKEND_JDBC_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      DOCSPELL_SERVER_BACKEND_JDBC_URL: jdbc:postgresql://db:5432/docspell
      DOCSPELL_SERVER_BACKEND_JDBC_USER: docspell
      DOCSPELL_SERVER_BIND_ADDRESS: 0.0.0.0
      DOCSPELL_SERVER_FULL__TEXT__SEARCH_ENABLED: 'true'
      DOCSPELL_SERVER_FULL__TEXT__SEARCH_SOLR_URL: http://solr:8983/solr/docspell
      DOCSPELL_SERVER_INTEGRATION__ENDPOINT_ENABLED: 'false'
      DOCSPELL_SERVER_BACKEND_SIGNUP_MODE: invite
      DOCSPELL_SERVER_BACKEND_SIGNUP_NEW__INVITE__PASSWORD: "${DOCSPELL_INVITE_PASSWORD:?Set DOCSPELL_INVITE_PASSWORD}"
      DOCSPELL_SERVER_BACKEND_ADDONS_ENABLED: 'false'
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
  joex:
    image: ghcr.io/docspell/joex:latest@sha256:19c8daf22de5ff7625c16abb319c6bcb1354ada0782bd546d91b2be72acbb34f
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Etc/UTC}"
      DOCSPELL_JOEX_APP__ID: joex1
      DOCSPELL_JOEX_PERIODIC__SCHEDULER_NAME: joex1
      DOCSPELL_JOEX_SCHEDULER_NAME: joex1
      DOCSPELL_JOEX_BASE__URL: http://joex:7878
      DOCSPELL_JOEX_BIND_ADDRESS: 0.0.0.0
      DOCSPELL_JOEX_FULL__TEXT__SEARCH_ENABLED: 'true'
      DOCSPELL_JOEX_FULL__TEXT__SEARCH_SOLR_URL: http://solr:8983/solr/docspell
      DOCSPELL_JOEX_JDBC_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      DOCSPELL_JOEX_JDBC_URL: jdbc:postgresql://db:5432/docspell
      DOCSPELL_JOEX_JDBC_USER: docspell
      DOCSPELL_JOEX_ADDONS_EXECUTOR__CONFIG_RUNNER: trivial
      DOCSPELL_JOEX_CONVERT_HTML__CONVERTER: weasyprint
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: docspell
      POSTGRES_USER: docspell
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U docspell -d docspell]
      interval: 5s
      timeout: 5s
      retries: 10
  solr:
    image: solr:10@sha256:e0d7878bc8cbc8060c31f102d6a0add169d390b0a5b87cca554a7c8b3ae0f298
    restart: unless-stopped
    environment:
      SOLR_OPTS: -Dsolr.modules=analysis-extras
    command: [bash, -c, 'precreate-core docspell; exec solr start -f --user-managed']
    volumes:
      - search-data:/var/solr
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8983/solr/docspell/admin/ping]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
volumes:
  database:
  search-data:
