services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: workout
      POSTGRES_DB: workout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U workout -d workout
      interval: 5s
      timeout: 5s
      retries: 30
  workout:
    image: ghcr.io/snouzy/workout-cool:latest@sha256:f0cdfcef359557bb35472ac06f6dd7f314f68e7d763be15370218ff463275839
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        pnpm exec prisma migrate deploy
        pnpm exec prisma generate
        if [ "$$SEED_SAMPLE_DATA" = "true" ] && [ -f /app/data/sample-exercises.csv ]; then
          pnpm exec tsx scripts/import-exercises-with-attributes.ts /app/data/sample-exercises.csv
        fi
        exec pnpm start
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://workout:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/workout
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${WORKOUT_URL:?Set WORKOUT_URL}
      NEXT_PUBLIC_APP_URL: ${WORKOUT_URL:?Set WORKOUT_URL}
      DEFAULT_BILLING_MODE: DISABLED
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASS: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      OPENPANEL_SECRET_KEY: ''
      NEXT_PUBLIC_OPENPANEL_CLIENT_ID: ''
      REVENUECAT_SECRET_KEY: ''
    ports:
      - 127.0.0.1:${WORKOUT_PORT:-3000}:3000
    depends_on:
      db:
        condition: service_healthy
volumes:
  database: {}
