services:
  mediamtx:
    image: bluenviron/mediamtx:1@sha256:59e43552f3be43695b70c19424dc2a42fcec18075f88d91561a24ac5d70a586c
    restart: unless-stopped
    ports:
      - 8554:8554
      - 1936:1935
      - 8888:8888
      - 8889:8889
      - 8189:8189/udp
    configs:
      - source: mediamtx-config
        target: /mediamtx.yml
configs:
  mediamtx-config:
    content: |
      logLevel: info
      authMethod: internal
      authInternalUsers:
        - user: publisher
          pass: ${MEDIAMTX_PUBLISH_PASSWORD:?Set MEDIAMTX_PUBLISH_PASSWORD}
          ips: []
          permissions:
            - action: publish
              path: ''
        - user: viewer
          pass: ${MEDIAMTX_READ_PASSWORD:?Set MEDIAMTX_READ_PASSWORD}
          ips: []
          permissions:
            - action: read
              path: ''
            - action: playback
              path: ''
      api: false
      metrics: false
      pprof: false
      rtsp: true
      rtspTransports:
        - tcp
      rtmp: true
      hls: true
      webrtc: true
      webrtcAdditionalHosts:
        - ${MEDIAMTX_PUBLIC_HOST:?Set MEDIAMTX_PUBLIC_HOST}
      srt: false
      paths:
        all_others: {}
