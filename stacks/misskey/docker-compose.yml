services:
  files-init:
    image: misskey/misskey:2026.11.1@sha256:681dc608791d36936895772ff255114d3ac3ea47e6bbea409d82113e92f9cfde
    restart: "no"
    user: "0:0"
    entrypoint: [chown, "991:991", /misskey/files]
    volumes:
      - files:/misskey/files
  misskey:
    image: misskey/misskey:2026.11.1@sha256:681dc608791d36936895772ff255114d3ac3ea47e6bbea409d82113e92f9cfde
    restart: unless-stopped
    depends_on:
      files-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    configs:
      - source: misskey-config
        target: /misskey/.config/default.yml
    ports:
      - 127.0.0.1:${MK_PORT:-3000}:3000
    volumes:
      - files:/misskey/files
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: misskey
    volumes:
      - database:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U misskey -d misskey"]
      interval: 5s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    restart: unless-stopped
    command: [valkey-server, --appendonly, "yes"]
    volumes:
      - cache:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
configs:
  misskey-config:
    content: |
      url: ${MK_URL:?Set MK_URL}
      port: 3000
      setupPassword: '${MK_SETUP_PASSWORD:?Set MK_SETUP_PASSWORD}'
      db:
        host: db
        port: 5432
        db: misskey
        user: misskey
        pass: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}'
      dbReplications: false
      redis:
        host: valkey
        port: 6379
      fulltextSearch:
        provider: sqlLike
      id: 'aidx'
      proxyBypassHosts:
        - api.deepl.com
        - api-free.deepl.com
        - www.recaptcha.net
        - hcaptcha.com
        - challenges.cloudflare.com
volumes:
  files: {}
  database: {}
  cache: {}
