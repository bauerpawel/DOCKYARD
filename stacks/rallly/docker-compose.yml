# Adapted from lukevella/rallly-selfhosted; use an existing HTTPS reverse proxy.
# Inline Garage config requires Docker Compose 2.23.1+.
services:
  rallly:
    image: lukevella/rallly:4.16.3@sha256:7837f8148cc6db5e3e9a8df199912950adaee66898ebad4949d9dbb2f30aa02b
    restart: unless-stopped
    ports:
      - "${RALLLY_PORT:-3012}:3000"
    environment:
      NEXT_PUBLIC_BASE_URL: "${NEXT_PUBLIC_BASE_URL:?Set NEXT_PUBLIC_BASE_URL}"
      DATABASE_URL: "postgresql://rallly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/rallly"
      SECRET_PASSWORD: "${SECRET_PASSWORD:?Set SECRET_PASSWORD}"
      INITIAL_ADMIN_EMAIL: "${RALLLY_ADMIN_EMAIL:?Set RALLLY_ADMIN_EMAIL}"
      SUPPORT_EMAIL: "${RALLLY_ADMIN_EMAIL:?Set RALLLY_ADMIN_EMAIL}"
      NOREPLY_EMAIL: "${RALLLY_ADMIN_EMAIL:?Set RALLLY_ADMIN_EMAIL}"
      ALLOWED_EMAILS: "${RALLLY_ADMIN_EMAIL:?Set RALLLY_ADMIN_EMAIL}"
      SMTP_HOST: "${SMTP_HOST:?Set SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:?Set SMTP_USER}"
      SMTP_PWD: "${SMTP_PWD:?Set SMTP_PWD}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET_NAME: rallly
      S3_REGION: garage
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}"
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: rallly
      POSTGRES_USER: rallly
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rallly -d rallly]
      interval: 5s
      timeout: 5s
      retries: 10
  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    restart: unless-stopped
    command: [/garage, server, --single-node, --default-bucket]
    environment:
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET}"
      GARAGE_DEFAULT_ACCESS_KEY: "${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}"
      GARAGE_DEFAULT_SECRET_KEY: "${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}"
      GARAGE_DEFAULT_BUCKET: rallly
    configs:
      - source: garage-config
        target: /etc/garage.toml
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: [CMD, /garage, stats, -a]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
configs:
  garage-config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      [s3_api]
      api_bind_addr = "[::]:3900"
      s3_region = "garage"
      root_domain = ".s3.garage.localhost"
      [admin]
      api_bind_addr = "[::]:3903"
volumes:
  database:
  garage-meta:
  garage-data:
