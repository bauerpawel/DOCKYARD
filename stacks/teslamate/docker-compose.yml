services:
  teslamate:
    image: teslamate/teslamate:latest@sha256:c85b3d447502683ed7bf12fb478e0dae9a985fe975ac22cccb64faeb4c4a5d31
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      DATABASE_USER: teslamate
      DATABASE_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_NAME: teslamate
      DATABASE_HOST: db
      MQTT_HOST: mosquitto
      TZ: ${TZ:-Etc/UTC}
    ports:
      - 127.0.0.1:${TESLAMATE_PORT:-4000}:4000
    volumes:
      - import:/opt/app/import
    cap_drop:
      - ALL
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: teslamate
    volumes:
      - database:/var/lib/postgresql
    shm_size: 1gb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U teslamate -d teslamate"]
      interval: 5s
      timeout: 5s
      retries: 10
  grafana:
    image: teslamate/grafana:latest@sha256:2dd1fae85cd891e1d851350d13b547abf000efd602c8d0e5734eda6d43e22e01
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_USER: teslamate
      DATABASE_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_NAME: teslamate
      DATABASE_HOST: db
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana:/var/lib/grafana
  mosquitto:
    image: eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-conf:/mosquitto/config
      - mosquitto-data:/mosquitto/data
volumes:
  database: {}
  grafana: {}
  import: {}
  mosquitto-conf: {}
  mosquitto-data: {}
