services:
  zoraxy:
    image: zoraxydocker/zoraxy:latest@sha256:c64ed57e10631d8f7482ce1ed6b337e653052a05646bd5dd77b009dcf0ae786d
    restart: unless-stopped
    ports:
      - 127.0.0.1:${ZORAXY_ADMIN_PORT:-8002}:8000
      - ${ZORAXY_HTTP_PORT:-80}:80
      - ${ZORAXY_HTTPS_PORT:-443}:443
      - ${ZORAXY_HTTPS_PORT:-443}:443/udp
    environment:
      TZ: ${TZ:-Etc/UTC}
      FASTGEOIP: 'false'
      NOAUTH: 'false'
    volumes:
      - config:/opt/zoraxy/config
      - plugins:/opt/zoraxy/plugin
    extra_hosts:
      - host.docker.internal:host-gateway
volumes:
  config: {}
  plugins: {}
