services:
  peertube:
    image: chocobozzz/peertube:production@sha256:a780d76ce6e119adb444484db227f85574b857e3c17612dc77c7a82e015f2b7d
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      PEERTUBE_WEBSERVER_HOSTNAME: ${PEERTUBE_WEBSERVER_HOSTNAME:?Set PEERTUBE_WEBSERVER_HOSTNAME}
      PEERTUBE_WEBSERVER_PORT: ${PEERTUBE_WEBSERVER_PORT:-9000}
      PEERTUBE_WEBSERVER_HTTPS: ${PEERTUBE_WEBSERVER_HTTPS:-false}
      PEERTUBE_TRUST_PROXY: '${PEERTUBE_TRUST_PROXY:-["127.0.0.1", "loopback"]}'
      PEERTUBE_SECRET: ${PEERTUBE_SECRET:?Set PEERTUBE_SECRET}
      PEERTUBE_ADMIN_EMAIL: ${PEERTUBE_ADMIN_EMAIL:?Set PEERTUBE_ADMIN_EMAIL}
      PEERTUBE_DB_HOSTNAME: db
      PEERTUBE_DB_USERNAME: peertube
      PEERTUBE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PEERTUBE_DB_SSL: "false"
      PEERTUBE_DB_NAME: peertube
      PEERTUBE_REDIS_HOSTNAME: redis
      PEERTUBE_SMTP_HOSTNAME: ${PEERTUBE_SMTP_HOSTNAME:?Set PEERTUBE_SMTP_HOSTNAME}
      PEERTUBE_SMTP_PORT: ${PEERTUBE_SMTP_PORT:-587}
      PEERTUBE_SMTP_FROM: ${PEERTUBE_SMTP_FROM:?Set PEERTUBE_SMTP_FROM}
      PEERTUBE_SMTP_USERNAME: ${PEERTUBE_SMTP_USERNAME:-}
      PEERTUBE_SMTP_PASSWORD: ${PEERTUBE_SMTP_PASSWORD:-}
      PEERTUBE_SMTP_TLS: ${PEERTUBE_SMTP_TLS:-false}
      PEERTUBE_SMTP_DISABLE_STARTTLS: ${PEERTUBE_SMTP_DISABLE_STARTTLS:-false}
      PEERTUBE_SIGNUP_ENABLED: "false"
    ports:
      - 127.0.0.1:${PEERTUBE_PORT:-9000}:9000
    volumes:
      - data:/data
      - config:/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: peertube
      POSTGRES_DB: peertube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U peertube -d peertube"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    volumes:
      - cache:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  data: {}
  config: {}
  database: {}
  cache: {}
