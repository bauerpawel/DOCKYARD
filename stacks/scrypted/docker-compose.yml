services:
  scrypted:
    image: ghcr.io/koush/scrypted:latest@sha256:e78b4fcecdd6c61acaaf22b50ccef303c738da58cc0be57afdb116521df52296
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Etc/UTC}
      SCRYPTED_DOCKER_AVAHI: 'true'
    volumes:
      - data:/server/volume
volumes:
  data: {}
