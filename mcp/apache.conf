# Dockyard MCP — fragment wirtualnego hosta Apache 2.4.
# Wymaga modułów alias i rewrite: a2enmod alias rewrite
#
# 1. Skopiuj na serwer całe repozytorium albo co najmniej:
#      /var/www/dockyard/templates.json   (opcjonalnie, zapas gdy CDN nie odpowiada)
#      /var/www/dockyard/stacks/          (opcjonalnie, lokalne pliki Compose)
#      /var/www/dockyard/mcp/             (ten katalog)
# 2. Popraw ścieżkę Alias i Directory poniżej.
# 3. Dołącz ten plik z vhosta: Include /var/www/dockyard/mcp/apache.conf
# 4. PHP 8.1+, włączone allow_url_fopen (pobieranie publicznych stackfile z GitHuba).
# 5. Sprawdź, że POST nie dostaje przekierowania (pierwsza linia: HTTP/1.1 200, nie 301/302):
#      curl -s -D- -o /dev/null -X POST https://TWOJA-DOMENA/mcp -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ping\"}"
#    Adres bez .php, który zwraca 200, wklejasz ludziom do agentów.
#
# DirectorySlash jest wyłączone, bo przekierowanie /mcp -> /mcp/ zamienia
# POST agenta w GET i gubi treść JSON-RPC.

Alias /mcp /var/www/dockyard/mcp

<Directory /var/www/dockyard/mcp>
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
    DirectorySlash Off

    # Feed schodzi z oficjalnego CDN i leży 15 minut w cache/ (opis w INSTRUKCJA.md). Inny adres feedu:
    # SetEnv DOCKYARD_TEMPLATES_URL https://cdn.jsdelivr.net/gh/OWNER/REPO@main/templates.json

    RewriteEngine On
    # Bez tego /mcp (bez slasha) omija reguły poniżej i kończy się 404.
    RewriteOptions AllowNoSlash
    RewriteRule ^(?:cache(?:/|$)|vendor(?:/|$)|guide(?:/|$)|composer\.(?:json|lock)$|templates\.json$|AGENT\.md$|INSTRUKCJA\.md$|apache\.conf$|\.gitignore$) - [F,END]
    RewriteRule ^index\.php$ - [END]
    RewriteRule ^$ index.php [END]
    RewriteRule . index.php [END]
</Directory>
