name: Intellij-idea
slug: intellij-idea
category: Development
type: container
image: linuxserver/intellij-idea:latest
description: '[IntelliJ IDEA](https://www.jetbrains.com/idea/) helps you write code faster with tools
  that eliminate tedious tasks and let you focus on what matters – building great software.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/intellij-idea-logo.png
website: https://github.com/linuxserver/docker-intellij-idea
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/intellij-idea/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
