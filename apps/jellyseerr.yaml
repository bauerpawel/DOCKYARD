name: Jellyseerr
slug: jellyseerr
category: Other
type: container
image: fallenbagel/jellyseerr:latest
description: Jellyseer is a free and open source software application for managing requests for your media
  library.
logo: https://raw.githubusercontent.com/Qballjos/portainer_templates/master/Images/jellyseerr.png
website: https://github.com/seerr-team/seerr
ports:
- 5055:5055/tcp
volumes:
- container: /app/config
  bind: /portainer/Files/AppData/Config/Jellyseerr
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
