name: ArchiSteamFarm
slug: archisteamfarm
category: Other
type: container
image: justarchi/archisteamfarm:latest
description: C# application with primary purpose of farming Steam cards from multiple accounts simultaneously.
logo: https://raw.githubusercontent.com/JustArchiNET/ArchiSteamFarm/main/resources/ASF_184x184.png
website: https://github.com/JustArchiNET/ArchiSteamFarm
ports:
- 1242:1242/tcp
volumes:
- container: /app/config
  bind: /portainer/Files/AppData/Config/ArchiSteamFarm/config
- container: /app/plugins
  bind: /portainer/Files/AppData/Config/ArchiSteamFarm/plugins
- container: /app/logs
  bind: /portainer/Files/AppData/Config/ArchiSteamFarm/logs
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
