name: Synclounge
slug: synclounge
category: Media
type: container
image: linuxserver/synclounge:latest
description: '[Synclounge](https://github.com/samcm/synclounge) is a third party tool that allows you
  to watch Plex in sync with your friends/family, wherever you are.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/synclounge-banner.png
website: https://github.com/linuxserver/docker-synclounge
ports:
- 8088:8088/tcp
volumes:
- container: /config
  bind: /srv/lsio/synclounge/config
env:
- name: AUTH_LIST
  label: AUTH_LIST
  default: plexuser1,plexuser2,email1,machineid1
  description: If set, only the users defined here and the users of the plex servers defined here will
    be able to access the server. Use e-mails, plex usernames and/or plex server machine ids, comma separated,
    no spaces. [OPTIONAL]
