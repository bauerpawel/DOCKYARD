name: Ombi (container)
slug: ombi-container
category: Downloaders
type: container
image: linuxserver/ombi:latest
description: '[Ombi](https://ombi.io) allows you to host your own Plex Request and user management system.
  If you are sharing your Plex server with other users, allow them to request new content using an easy
  to manage interface! Manage all your requests for Movies and TV with ease, leave notes for the user
  and get notification when a user requests something. Allow your users to post issues against their requests
  so you know there is a problem with the audio etc. Even automatically send them weekly newsletters of
  new content that has been added to your Plex server!'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ombi.png
website: https://github.com/linuxserver/docker-ombi
ports:
- 3579:3579/tcp
volumes:
- container: /config
  bind: /srv/lsio/ombi/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: BASE_URL
  label: BASE_URL
  default: /
  description: Subfolder can optionally be defined as an env variable for reverse proxies. Keep in mind
    that once this value is defined, the gui setting for base url no longer works. To use the gui setting,
    remove this env variable. [OPTIONAL]
