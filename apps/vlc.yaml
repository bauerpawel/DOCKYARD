name: Vlc
slug: vlc
category: Media
type: container
image: linuxserver/vlc:latest
description: '[VLC Media Player](https://www.videolan.org/vlc/) is a free and open source cross-platform
  multimedia player and framework that delivers dependable performance across multiple devices.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vlc-logo.png
website: https://github.com/linuxserver/docker-vlc
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/vlc/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: VLC_CLI
  label: VLC_CLI
  default: --no-qt-minimal-view
  description: Specify one or multiple VLC CLI flags, this string will be passed to the application in
    full. [OPTIONAL]
