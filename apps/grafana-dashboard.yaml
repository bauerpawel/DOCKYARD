name: Grafana Dashboard
slug: grafana-dashboard
category: Other
type: compose
repository:
  url: https://github.com/portainer/templates
  stackfile: edge/grafana/docker-compose.yml
description: Multi-platform open-source interactive visualization web application
logo: https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Grafana_logo.svg/1200px-Grafana_logo.svg.png
website: https://grafana.com
env:
- name: grafana_admin
  label: Grafana Dashboard Username
  description: Username for the initial Grafana administrator account. Existing Grafana users are stored
    in its database and are not renamed by changing this value.
- name: grafana_password
  label: Grafana Dashboard Password
  description: Private password for the initial Grafana administrator account. Supply it before first
    initialization; changing it does not rotate an existing account password.
