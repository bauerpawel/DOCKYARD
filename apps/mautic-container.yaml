name: Mautic (container)
slug: mautic-container
category: Business & Finance
type: container
image: mautic/mautic:latest@sha256:83461b9ec7c109413281490180e1f96c379aa935bd92f80c68294f98487a9015
description: Open-source marketing automation platform
logo: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/mautic.png
website: https://www.mautic.org
ports:
- 80/tcp
volumes:
- container: /var/www/html
env:
- name: MAUTIC_DB_HOST
  label: MySQL database host
  description: MySQL or MariaDB hostname reachable from Mautic. Provide a running database with matching
    account, password and database settings.
- name: MAUTIC_DB_PASSWORD
  label: Database password
  description: Private password for Mautic's database account. Match the database service and retain
    existing credentials when reusing its data.
