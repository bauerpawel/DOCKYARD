name: Mediaelch
slug: mediaelch
category: Media
type: container
image: linuxserver/mediaelch:latest
description: '[MediaElch](https://github.com/Komet/MediaElch) is a MediaManager for Kodi. Information
  about Movies, TV Shows, Concerts and Music are stored as nfo files. Fanarts are downloaded automatically
  from fanart.tv. Using the nfo generator, MediaElch can be used with other MediaCenters as well.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mediaelch-logo.png
website: https://github.com/linuxserver/docker-mediaelch
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/mediaelch/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
