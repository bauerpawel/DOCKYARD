name: MinIO
slug: minio
category: Other
type: container
image: minio/minio:latest
description: MinIO is a High Performance Object Storage released under GNU Affero GPL v3.0. It is API
  compatible with Amazon S3 cloud storage service.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/minio.png
website: https://min.io
ports:
- 8760:9000/tcp
- 8761:9090/tcp
volumes:
- container: /data
  bind: /portainer/Files/AppData/Config/MinIO
env:
- default: '1000'
  label: PUID
  name: PUID
- default: '1000'
  label: PGID
  name: PGID
- default: ROOTUSER
  label: MINIO_ROOT_USER
  name: MINIO_ROOT_USER
- default: CHANGEME123
  label: MINIO_ROOT_PASSWORD
  name: MINIO_ROOT_PASSWORD
- default: ''
  label: MINIO_SERVER_URL
  name: MINIO_SERVER_URL
  description: URL hostname for MinIO Console if any
