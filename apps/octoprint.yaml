name: OctoPrint
slug: octoprint
category: Other
type: container
image: octoprint/octoprint:latest
description: OctoPrint is an open source 3D printer controller application, which provides a web interface
  for the connected printers.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/octoprint.png
website: https://octoprint.org
ports:
- 8051:80/tcp
volumes:
- container: /octoprint
  bind: /portainer/Files/AppData/Config/OctoPrint
- container: /dev
  bind: /dev
env:
- default: 'development '
  label: NODE_ENV
  name: NODE_ENV
  description: Legacy Node.js environment selector included in this OctoPrint template. Do not assume
    it configures OctoPrint's Python server; use only when the selected image documents support.
- default: 'true'
  label: ENABLE_MJPG_STREAMER
  name: ENABLE_MJPG_STREAMER
  description: true starts the image's supported MJPG webcam streamer; false disables it. The host camera
    device and any required mappings must be configured separately.
