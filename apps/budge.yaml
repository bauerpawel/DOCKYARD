name: Budge
slug: budge
category: Business & Finance
type: container
image: linuxserver/budge:latest
description: Budge is an open-source "budgeting with envelopes" personal finance app, in the spirit
  of YNAB.
logo: https://opengraph.githubassets.com/1/linuxserver/budge
website: https://github.com/linuxserver/budge
ports:
  - 80/tcp
  - 443/tcp
volumes:
  - container: /config
env:
  - name: PUID
    label: PUID
    default: "1000"
    description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
  - name: PGID
    label: PGID
    default: "1000"
    description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
  - name: TZ
    label: Timezone
    default: Etc/UTC
