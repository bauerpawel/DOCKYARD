name: iobroker
slug: iobroker
category: Automation
type: container
image: buanet/iobroker:latest
description: 'IoBroker is a open source IoT platform written in JavaScript that easily connects smarthome
  components from different manufactures. With the help of plugins (called: adapters) ioBroker is able
  to communicate with a big variety of IoT hardware and services using different protocols and APIs.'
logo: https://github.com/buanet/ioBroker.docker/raw/main/docs/img/iobroker_logo.png
website: https://github.com/buanet/ioBroker.docker
ports:
- 8081:8081/tcp
volumes:
- container: /opt/iobroker
  bind: /portainer/Files/AppData/Config/iobrokerdata
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
