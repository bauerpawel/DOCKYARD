name: Readarr (container)
slug: readarr-container
category: Downloaders
type: container
image: ghcr.io/linuxserver/readarr:nightly
description: Readarr - Book Manager and Automation (Sonarr for Ebooks)
logo: https://mediadepot.github.io/templates/img/readarr-logo.png
website: https://github.com/linuxserver/docker-readarr
ports:
- 8787/tcp
volumes:
- container: /config
  bind: /opt/mediadepot/apps/readarr
- container: /downloads
  bind: /media/storage/downloads/ebooks
- container: /books
  bind: /media/storage/ebooks
- container: /blackhole
  bind: /media/temp/blackhole/ebooks
- container: /etc/localtime
  bind: /etc/localtime
  readonly: true
env:
- name: PGID
  label: PGID
  default: '15000'
  preset: true
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- name: PUID
  label: PUID
  default: '15000'
  preset: true
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- name: TZ
  label: TZ
  default: America/Los_Angeles
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
