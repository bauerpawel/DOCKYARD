name: Dokuwiki
slug: dokuwiki
category: CMS
type: container
image: linuxserver/dokuwiki:latest
description: '[Dokuwiki](https://www.dokuwiki.org/dokuwiki/) is a simple to use and highly versatile Open
  Source wiki software that doesn''t require a database. It is loved by users for its clean and readable
  syntax. The ease of maintenance, backup and integration makes it an administrator''s favorite. Built
  in access controls and authentication connectors make DokuWiki especially useful in the enterprise context
  and the large number of plugins contributed by its vibrant community allow for a broad range of use
  cases beyond a traditional wiki.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dokuwiki-icon.png
website: https://github.com/linuxserver/docker-dokuwiki
ports:
- 80:80/tcp
- 443:443/tcp
volumes:
- container: /config
  bind: /srv/lsio/dokuwiki/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
