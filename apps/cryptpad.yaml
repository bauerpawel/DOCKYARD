name: CryptPad
slug: cryptpad
category: Productivity
type: compose
repository:
  url: https://github.com/lissy93/portainer-templates
  stackfile: sources/stacks/cryptpad.yml
description: 'Collaboration suite, encrypted and open-source. Source: https://github.com/cryptpad/cryptpad'
logo: https://avatars.githubusercontent.com/u/20967956
website: https://cryptpad.org
env:
- default: https://cryptpad.example.com
  label: Main domain (full URL) — your public CryptPad address
  name: CPAD_MAIN_DOMAIN
  description: Full public CryptPad URL, for example https://cryptpad.example.com. Configure matching
    DNS, TLS and reverse proxy routing.
- default: https://cryptpad-ui.example.com
  label: Sandbox domain (full URL) — MUST be a DIFFERENT origin from the main domain
  name: CPAD_SANDBOX_DOMAIN
  description: Full URL on a different origin from CPAD_MAIN_DOMAIN, for example https://cryptpad-sandbox.example.com.
    CryptPad uses this separate origin to isolate untrusted document content.
