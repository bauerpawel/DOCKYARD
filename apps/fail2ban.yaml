name: Fail2ban
slug: fail2ban
category: Networking
type: container
image: linuxserver/fail2ban:latest
description: '[Fail2ban](http://www.fail2ban.org/) is a daemon to ban hosts that cause multiple authentication
  errors.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/fail2ban-logo.png
website: https://github.com/linuxserver/docker-fail2ban
ports:
- 80:80/tcp
volumes:
- container: /config
  bind: /srv/lsio/fail2ban/config
- container: /var/log
  bind: /srv/lsio/fail2ban/var/log
  readonly: true
- container: /remotelogs/airsonic
  bind: /srv/lsio/fail2ban/remotelogs/airsonic
  readonly: true
- container: /remotelogs/apache2
  bind: /srv/lsio/fail2ban/remotelogs/apache2
  readonly: true
- container: /remotelogs/authelia
  bind: /srv/lsio/fail2ban/remotelogs/authelia
  readonly: true
- container: /remotelogs/emby
  bind: /srv/lsio/fail2ban/remotelogs/emby
  readonly: true
- container: /remotelogs/filebrowser
  bind: /srv/lsio/fail2ban/remotelogs/filebrowser
  readonly: true
- container: /remotelogs/homeassistant
  bind: /srv/lsio/fail2ban/remotelogs/homeassistant
  readonly: true
- container: /remotelogs/lighttpd
  bind: /srv/lsio/fail2ban/remotelogs/lighttpd
  readonly: true
- container: /remotelogs/nextcloud
  bind: /srv/lsio/fail2ban/remotelogs/nextcloud
  readonly: true
- container: /remotelogs/nginx
  bind: /srv/lsio/fail2ban/remotelogs/nginx
  readonly: true
- container: /remotelogs/nzbget
  bind: /srv/lsio/fail2ban/remotelogs/nzbget
  readonly: true
- container: /remotelogs/overseerr
  bind: /srv/lsio/fail2ban/remotelogs/overseerr
  readonly: true
- container: /remotelogs/prowlarr
  bind: /srv/lsio/fail2ban/remotelogs/prowlarr
  readonly: true
- container: /remotelogs/radarr
  bind: /srv/lsio/fail2ban/remotelogs/radarr
  readonly: true
- container: /remotelogs/sabnzbd
  bind: /srv/lsio/fail2ban/remotelogs/sabnzbd
  readonly: true
- container: /remotelogs/sonarr
  bind: /srv/lsio/fail2ban/remotelogs/sonarr
  readonly: true
- container: /remotelogs/unificontroller
  bind: /srv/lsio/fail2ban/remotelogs/unificontroller
  readonly: true
- container: /remotelogs/vaultwarden
  bind: /srv/lsio/fail2ban/remotelogs/vaultwarden
  readonly: true
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: VERBOSITY
  label: VERBOSITY
  default: -vv
  description: Set the container log verbosity. Valid options are -v, -vv, -vvv, -vvvv, or leaving the
    value blank or not setting the variable. [OPTIONAL]
