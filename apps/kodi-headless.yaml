name: Kodi Headless
slug: kodi-headless
category: Media
type: container
image: lsioarmhf/kodi-headless:latest
description: '[DEPRECATED] Headless installation of Kodi™ (formerly known as XBMC™), to enable library
  updates.'
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/kodi-icon.png
website: https://github.com/linuxserver-archive/docker-kodi-headless-armhf
ports:
- 8081:8080/tcp
- 9090:9090/tcp
- 9777:9777/udp
volumes:
- container: /config/.kodi
  bind: /portainer/Files/AppData/Config/Kodi
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
