name: Pydio
slug: pydio
category: Cloud & Storage
type: container
image: linuxserver/pydio:latest
description: 'Pydio (formerly AjaXplorer) is a mature open source software solution for file sharing and
  synchronization. With intuitive user interfaces (web / mobile / desktop), Pydio provides enterprise-grade
  features to gain back control and privacy of your data: user directory connectors, legacy filesystems
  drivers, comprehensive admin interface, and much more.'
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/pydio-icon.png
website: https://github.com/pydio/pydio-core
ports:
- 443/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/Pydio
- container: /data
  bind: /portainer/Files/AppData/Pydio
env:
- default: '1000'
  label: PUID
  name: PUID
- default: '100'
  label: PGID
  name: PGID
