name: Kasm
slug: kasm
category: Business & Finance
type: container
image: linuxserver/kasm:latest
description: '[Kasm](https://www.kasmweb.com/?utm_campaign=LinuxServer&utm_source=listing) Workspaces
  is a docker container streaming platform for delivering browser-based access to desktops, applications,
  and web services. Kasm uses devops-enabled Containerized Desktop Infrastructure (CDI) to create on-demand,
  disposable, docker containers that are accessible via web browser. Example use-cases include Remote
  Browser Isolation (RBI), Data Loss Prevention (DLP), Desktop as a Service (DaaS), Secure Remote Access
  Services (RAS), and Open Source Intelligence (OSINT) collections. The rendering of the graphical-based
  containers is powered by the open-source project [KasmVNC](https://www.kasmweb.com/kasmvnc.html?utm_campaign=LinuxServer&utm_source=kasmvnc).'
logo: https://kasm-ci.s3.amazonaws.com/kasm_wide.png
website: https://github.com/linuxserver/docker-kasm
ports:
- 3000:3000/tcp
- 443:443/tcp
volumes:
- container: /opt
  bind: /srv/lsio/kasm/opt
- container: /profiles
  bind: /srv/lsio/kasm/profiles
- container: /dev/input
  bind: /dev/input
- container: /run/udev/data
  bind: /run/udev/data
env:
- name: KASM_PORT
  label: KASM_PORT
  default: '443'
  description: Specify the port you bind to the outside for Kasm Workspaces.
- name: DOCKER_HUB_USERNAME
  label: DOCKER_HUB_USERNAME
  default: USER
  description: Optionally specify a DockerHub Username to pull private images. [OPTIONAL]
- name: DOCKER_HUB_PASSWORD
  label: DOCKER_HUB_PASSWORD
  default: PASS
  description: Optionally specify a DockerHub password to pull private images. [OPTIONAL]
- name: DOCKER_MTU
  label: DOCKER_MTU
  default: '1500'
  description: Optionally specify the mtu options passed to dockerd. [OPTIONAL]
