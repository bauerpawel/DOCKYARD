name: Slink
slug: slink
category: Media
type: container
image: anirdev/slink:latest@sha256:776093d7c3a4ff3b7e09c37e073ad9c0e34f2768404191fb577f4e957ddccb5a
description: >-
  Self-hosted image hosting with collections, private sharing links, optional passwords and expiry dates.
  Uses local image storage and a persistent application database. New accounts require administrator approval
  in this template.
note: >-
  Set ORIGIN to the exact public browser origin including scheme and port. Create an account at /profile/signup,
  then run slink user:activate --email=YOUR_EMAIL and slink user:grant:role --email=YOUR_EMAIL ROLE_ADMIN
  inside the container. Keep user approval enabled. Back up both /app/var/data and /app/slink/images. Documentation:
  https://docs.slinkapp.io/
logo: https://cdn.jsdelivr.net/gh/selfhst/icons/png/slink.png
website: https://docs.slinkapp.io/
restart_policy: unless-stopped
ports:
  - 3004:3000/tcp
volumes:
  - container: /app/var/data
  - container: /app/slink/images
env:
  - name: ORIGIN
    label: Browser origin
    description: Required. Exact browser origin without a trailing slash, for example https://images.example.com.
  - name: USER_APPROVAL_REQUIRED
    label: Approve new accounts
    description: New accounts must be activated by an administrator before uploading.
    default: 'true'
  - name: STORAGE_PROVIDER
    label: Storage provider
    description: Uses the persistent local image volume.
    default: local
    preset: true
  - name: IMAGE_MAX_SIZE
    label: Maximum image size
    description: Per-image upload limit with a unit, for example 15M.
    default: 15M
  - name: TZ
    label: Time zone
    description: IANA time zone.
    default: Etc/UTC
