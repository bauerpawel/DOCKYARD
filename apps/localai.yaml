name: LocalAI
slug: localai
category: Development
type: container
image: localai/localai:v5.0.1@sha256:7240f75f2b7f00eeb4e77ff2921c25f77ab265b4e5888933e702e0c3b49d876d
description: >-
  Local inference server with an OpenAI-compatible API and a web UI for chat, embeddings, image generation, speech
  and transcription. This template uses the CPU image; GPU users can switch to a latest-gpu-* tag and add device
  access themselves. Models, backends, dynamic configuration and data persist in separate volumes. Every request
  needs the API key.
note: >-
  Set LOCALAI_API_KEY before starting; without it the API and web UI accept anonymous requests. Open port 8080,
  install models from the gallery in the web UI, and point OpenAI clients at http://HOST:8080/v1 with the key as
  the bearer token. Backends are downloaded on first use, so allow several gigabytes in the /backends and /models
  volumes. Put the server behind an HTTPS reverse proxy before sharing it beyond a trusted network. Documentation:
  https://localai.io/basics/container/
logo: https://cdn.jsdelivr.net/gh/selfhst/icons/png/localai.png
website: https://localai.io/
restart_policy: unless-stopped
ports:
  - 8080:8080/tcp
volumes:
  - container: /models
  - container: /backends
  - container: /configuration
  - container: /data
env:
  - name: LOCALAI_API_KEY
    label: API key
    description: Required. Generate with openssl rand -hex 32; clients send it as a bearer token.
