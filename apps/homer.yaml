name: Homer
slug: homer
category: Other
type: container
image: b4bz/homer:latest
description: A dead simple static HOMepage for your servER to keep your s ervices on hand, from a simple
  yaml configuration file.
logo: https://raw.githubusercontent.com/Qballjos/portainer_templates/master/Images/homer.png
website: https://github.com/bastienwirtz/homer
ports:
- 8902:8080/tcp
volumes:
- container: /www/assets
  bind: /portainer/Files/AppData/Config/Homer/assets
- container: /www/config.yml
  bind: /portainer/Files/AppData/Config/Homer
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
