name: Peppermint
slug: peppermint
category: Other
type: container
image: pepperlabs/peppermint:latest
description: Peppermint is a free and open source tickeg management solution with a range of features
logo: https://raw.githubusercontent.com/Peppermint-Lab/peppermint/master/public/logo.svg
website: https://github.com/Peppermint-Lab/peppermint
ports:
- 5001:5001/tcp
volumes:
- container: /data
  bind: /srv/dev-disk-by-label-media/Files/AppData/Config/peppermint
env:
- name: PUID
  label: PUID
  default: '1000'
- name: PGID
  label: PGID
  default: '100'
- name: PORT
  label: PORT
  default: '5001'
- name: DB_USERNAME
  label: DB_USERNAME
  default: peppermint
- name: DB_PASSWORD
  label: DB_PASSWORD
  default: '1234'
- name: DB_HOST
  label: DB_HOST
  default: postgres
