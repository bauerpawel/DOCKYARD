name: LLDAP
slug: lldap
category: Utilities
type: container
image: nitnelave/lldap:stable-debian
description: This project is a lightweight authentication server that provides an opinionated, simplified
  LDAP interface for authentication.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/lldap.png
website: https://github.com/lldap/lldap
ports:
- 3890:3890/tcp
- 17170:17170/tcp
volumes:
- container: /data
  bind: /portainer/Files/AppData/Config/lldap/data
env:
- default: somesecretjwt
  label: LLDAP_JWT_SECRET
  name: LLDAP_JWT_SECRET
  description: Private signing secret for LLDAP authentication tokens. Generate a unique random value
    and keep it across updates instead of using the template example.
- default: someadminpassword
  label: LLDAP_LDAP_USER_PASS
  name: LLDAP_LDAP_USER_PASS
  description: Private password for LLDAP's administrator account. Replace the template example before
    initial setup; manage changes to an existing administrator according to the release's account procedure.
- default: dc=example,dc=com
  label: LLDAP_LDAP_BASE_DN
  name: LLDAP_LDAP_BASE_DN
  description: LDAP base distinguished name, for example dc=example,dc=com. Match it in all LDAP clients
    and keep the value appropriate for your directory.
