name: Oscam
slug: oscam
category: Media
type: container
image: linuxserver/oscam:latest
description: '[Oscam](https://git.streamboard.tv/common/oscam) is an Open Source Conditional Access Module
  software used for descrambling DVB transmissions using smart cards. It''s both a server and a client.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/oscam-logo.png
website: https://github.com/linuxserver/docker-oscam
ports:
- 8888:8888/tcp
volumes:
- container: /config
  bind: /srv/lsio/oscam/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
