name: Murmur
slug: murmur
category: Other
type: container
image: yhaenggi/murmur:1.3.4
description: Mumble is a voicechat program for gamers written on top of Qt and Opus. Murmur is the server
  backend for Mumble.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/Mumble-logo.png
website: https://github.com/yhaenggi/murmur-docker
ports:
- 64738:64738/tcp
- 64738:64738/udp
volumes:
- container: /etc/localtime
  bind: /etc/localtime
  readonly: true
- container: /opt/murmur/config
  bind: /portainer/Files/Config/Murmur
- container: /opt/murmur/data
  bind: /portainer/Files/Murmur/data
- container: /opt/murmur/log
  bind: /portainer/Files/Murmur/log
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- default: America/New_York
  label: TZ
  name: TZ
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
