name: Homarr (container)
slug: homarr-container
category: Utilities
type: container
image: ghcr.io/ajnart/homarr:latest
description: Homarr is a simple and lightweight homepage for your server, that helps you easily access
  all of your services in one place.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/homarr.png
website: https://homarr.dev
ports:
- 7575:7575/tcp
volumes:
- container: /var/run/docker.sock
  bind: /var/run/docker.sock
- container: /app/data/configs
  bind: /portainer/Files/AppData/Config/Homarr/configs
- container: /app/public/icons
  bind: /portainer/Files/AppData/Config/Homarr/icons
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
