name: Minisatip
slug: minisatip
category: Media
type: container
image: linuxserver/minisatip:latest
description: '[Minisatip](https://github.com/catalinii/minisatip) is a multi-threaded satip server version
  1.2 that runs under Linux and it was tested with DVB-S, DVB-S2, DVB-T, DVB-T2, DVB-C, DVB-C2, ATSC and
  ISDB-T cards.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/minisatip-icon.png
website: https://github.com/linuxserver/docker-minisatip
ports:
- 8875:8875/tcp
- 554:554/tcp
- 1900:1900/udp
volumes:
- container: /config
  bind: /srv/lsio/minisatip/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: RUN_OPTS
  label: RUN_OPTS
  default: ''
  description: Specify specific run params for minisatip
