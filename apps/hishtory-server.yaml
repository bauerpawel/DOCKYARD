name: Hishtory-server
slug: hishtory-server
category: Utilities
type: container
image: linuxserver/hishtory-server:latest
description: '[hiSHtory](https://github.com/ddworken/hishtory) is a better shell history. It stores your
  shell history in context (what directory you ran the command in, whether it succeeded or failed, how
  long it took, etc). This is all stored locally and end-to-end encrypted for syncing to to all your other
  computers.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/hishtory-server-icon.png
website: https://github.com/linuxserver/docker-hishtory-server
ports:
- 8080:8080/tcp
volumes:
- container: /config
  bind: /srv/lsio/hishtory-server/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: HISHTORY_POSTGRES_DB
  label: HISHTORY_POSTGRES_DB
  default: postgresql://${HISHTORY_DB_USER}:${HISHTORY_DB_PASS}@hishtory-db:5432/hishtory?sslmode=disable
  description: Postgres DB [Connection URI](https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-CONNSTRING).
    Special characters must be [URL encoded](https://en.wikipedia.org/wiki/URL_encoding). [OPTIONAL]
- name: HISHTORY_SQLITE_DB
  label: HISHTORY_SQLITE_DB
  default: /config/hishtory.db
  description: SQLite database path. Needs to be a mounted volume for persistence. Don't set at the same
    time as HISHTORY_POSTGRES_DB. [OPTIONAL]
