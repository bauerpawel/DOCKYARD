name: FlareSolverr
slug: flaresolverr
category: Other
type: container
image: ghcr.io/flaresolverr/flaresolverr:latest
description: FlareSolverr is a proxy server to bypass Cloudflare and DDoS-GUARD protection.
logo: https://raw.githubusercontent.com/FlareSolverr/FlareSolverr/c48d342b9cfb65d7696b96e9867fcff0ae87a0e2/resources/flaresolverr_logo.svg
website: https://github.com/FlareSolverr/FlareSolverr
ports:
- 8191:8191/tcp
env:
- default: info
  label: LOG_LEVEL
  name: LOG_LEVEL
  description: FlareSolverr log verbosity, such as debug, info, warning or error as supported by the
    deployed release. Debug output can include request details and produce more logs.
- default: 'false'
  label: LOG_HTML
  name: LOG_HTML
  description: true includes retrieved HTML in FlareSolverr logs; false leaves it out. HTML logs can
    contain page content and increase log volume.
- default: none
  label: CAPTCHA_SOLVER
  name: CAPTCHA_SOLVER
  description: Legacy CAPTCHA solver selection from FlareSolverr. Leave none when no supported solver
    is configured; this field does not provide a working solver or guarantee CAPTCHA handling.
- default: America/New_York
  label: TZ
  name: TZ
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
