name: InfluxDB for Edge
slug: influxdb-for-edge
category: Other
type: compose
repository:
  url: https://github.com/portainer/templates
  stackfile: edge/influxdb/docker-compose.yml
description: InfluxDB Time Series Data Platformm - Single Server deployment
logo: https://store-images.s-microsoft.com/image/apps.61965.8c5e9f22-6a18-49a8-b8b9-6632de74e76c.3c45348f-0adf-4238-b024-bb993be0b664.ccdeeb79-9767-4e92-af5a-1b56f274aa99
website: https://www.influxdata.com
env:
- name: influxadmin
  label: Influx Admin Username
  description: Username for the initial InfluxDB administrator account. Choose it before initializing
    empty InfluxDB storage.
- name: influxadminpass
  label: Influx Admin User Password
  description: Private password for the initial InfluxDB administrator. Retain or rotate the existing
    account through InfluxDB administration when reusing data.
- name: influxorg
  label: Influx Org Name
  description: InfluxDB organization name used during first initialization. Match the organization expected
    by clients and retain the existing organization when reusing storage.
- name: influxbucket
  label: Influx Bucket Name
  description: Name of the initial InfluxDB bucket storing time-series data. Match the bucket configured
    in clients; changing this does not rename an existing bucket.
