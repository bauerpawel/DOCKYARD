name: Eufy Security WS
slug: eufy-security-ws
category: Utilities
type: container
image: bropat/eufy-security-ws:latest
description: Eufy Security Web Socket. Edit container and add username & password.
logo: https://github.com/bropat/eufy-security-ws/raw/master/docs/_media/eufy-security-ws.png
website: https://github.com/bropat/eufy-security-ws
ports:
- 3993:3000/tcp
volumes:
- container: /data
  bind: /portainer/Files/AppData/Config/eufy-security-ws
env:
- default: InputUSER-email
  label: USERNAME
  name: USERNAME
  description: Email address of the Eufy Security account used by the bridge. Replace the placeholder
    with the account intended for this integration.
- default: InputPWD
  label: PASSWORD
  name: PASSWORD
  description: Private password for the Eufy Security account specified by USERNAME. Replace the template
    placeholder and complete any required account verification separately.
