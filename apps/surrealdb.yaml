name: SurrealDB
slug: surrealdb
category: Database
type: container
image: surrealdb/surrealdb:latest
description: SurrealDB is an end-to-end cloud-native database for web, mobile, serverless, jamstack,
  backend and traditional applications. It combines a document, graph and relational data model with
  a single query language (SurrealQL).
logo: https://opengraph.githubassets.com/1/surrealdb/surrealdb
website: https://surrealdb.com/
ports:
  - 8000/tcp
volumes:
  - container: /data
command: start --user ${SDB_USERNAME} --pass ${SDB_PASSWORD} file:/data/database.db
env:
  - name: SDB_USERNAME
    label: Root username
    default: default_username
    description: SurrealDB root account username for image releases using this legacy variable. Replace
      the template example and verify the image's documented authentication configuration.
  - name: SDB_PASSWORD
    label: Root password
    default: default_password
    description: Private SurrealDB root account password for image releases using this legacy variable.
      Replace the template example and verify the image's documented authentication configuration.
