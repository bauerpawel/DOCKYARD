name: Homeassistant
slug: homeassistant
category: Automation
type: container
image: linuxserver/homeassistant:latest@sha256:29bdfa746fb4426b265d80f3dbb307d5c01215bde705a6951e86abb5f81665ea
description: '[Home Assistant Core](https://www.home-assistant.io/) - Open source home automation that
  puts local control and privacy first. Powered by a worldwide community of tinkerers and DIY enthusiasts.
  Perfect to run on a Raspberry Pi or a local server'
logo: https://github.com/home-assistant/home-assistant.io/raw/next/source/images/favicon-192x192-full.png
website: https://github.com/linuxserver/docker-homeassistant
ports:
- 8123:8123/tcp
volumes:
- container: /config
  bind: /srv/lsio/homeassistant/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
