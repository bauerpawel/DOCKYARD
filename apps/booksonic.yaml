name: Booksonic
slug: booksonic
category: Books & Documents
type: container
image: linuxserver/booksonic:latest
description: Booksonic is a server and an app for streaming your audiobooks to any pc or android phone.
  Most of the functionality is also availiable on other platforms that have apps for subsonic
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/booksonic.png
website: https://github.com/popeen/Booksonic-Air
ports:
- 4040:4040/tcp
volumes:
- container: /books
  bind: /portainer/Books
- container: /podcast
  bind: /portainer/Files/Podcasts
- container: /config
  bind: /portainer/Files/AppData/Config/Booksonic
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- default: booksonic
  label: CONTEXT_PATH
  name: CONTEXT_PATH
  description: Web application URL path when supported by the selected image, for example airsonic.
    Use the path syntax documented for that image; this does not configure a reverse proxy by itself.
