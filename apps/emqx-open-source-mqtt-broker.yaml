name: EMQX Open Source MQTT Broker
slug: emqx-open-source-mqtt-broker
category: Other
type: compose
repository:
  url: https://github.com/portainer/templates
  stackfile: edge/emqx/docker-compose.yml
description: Open-source MQTT broker for IoT, IIoT, and connected vehicles - Single Broker deployment
logo: https://raw.githubusercontent.com/docker-library/docs/68aa4264fa058f323993fdaceacd63a8acbbeb48/emqx/logo.svg
website: https://www.emqx.io
env:
- name: EMQX_DASHBOARD__DEFAULT_USERNAME
  label: EMQX Dashboard Username
  description: Initial EMQX dashboard administrator username. Used when initializing the dashboard account;
    changing it does not rename an existing user.
- name: EMQX_DASHBOARD__DEFAULT_PASSWORD
  label: EMQX Dashboard Password
  description: Private password for the initial EMQX dashboard administrator. Replace example values
    before first start; update an existing account through EMQX administration.
