name: Kicad
slug: kicad
category: 3D Printing & Modeling
type: container
image: linuxserver/kicad:latest@sha256:3bb954a49d88c2bc798ca191e38b602cbed0e6938df5d92e0f685d50aa54adfa
description: '[KiCad](https://www.kicad.org/) - A Cross Platform and Open Source Electronics Design Automation
  Suite.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kicad-logo.png
website: https://github.com/linuxserver/docker-kicad
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/kicad/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
