name: Sematext Docker Agent (container)
slug: sematext-docker-agent-container
category: Monitoring
type: container
image: sematext/sematext-agent-docker:latest
description: Collect logs, metrics and docker events
logo: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/sematext_agent.png
website: https://github.com/sematext/sematext-agent-docker
volumes:
- container: /var/run/docker.sock
  bind: /var/run/docker.sock
env:
- name: LOGSENE_TOKEN
  label: Logs token
  description: Private Sematext Logs application token used to ship logs. Obtain the token for the intended
    logs application; it is distinct from the monitoring token.
- name: SPM_TOKEN
  label: SPM monitoring token
  description: Private Sematext monitoring application token used to submit metrics. Use the token for
    the intended monitoring application, separate from LOGSENE_TOKEN.
