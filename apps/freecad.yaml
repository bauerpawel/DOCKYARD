name: Freecad
slug: freecad
category: 3D Printing & Modeling
type: container
image: linuxserver/freecad:latest
description: '[FreeCAD](https://www.freecad.org/) is a general-purpose parametric 3D computer-aided design
  (CAD) modeler and a building information modeling (BIM) software application with finite element method
  (FEM) support.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/freecad-logo.png
website: https://github.com/linuxserver/docker-freecad
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/freecad/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
