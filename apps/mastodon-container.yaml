name: Mastodon (container)
slug: mastodon-container
category: Communication
type: container
image: linuxserver/mastodon:latest
description: '[Mastodon](https://github.com/mastodon/mastodon/) is a free, open-source social network
  server based on ActivityPub where users can follow friends and discover new ones..'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mastodon-banner.png
website: https://github.com/linuxserver/docker-mastodon
ports:
- 80:80/tcp
- 443:443/tcp
- 9394:9394/tcp
volumes:
- container: /config
  bind: /srv/lsio/mastodon/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: LOCAL_DOMAIN
  label: LOCAL_DOMAIN
  default: example.com
  description: This is the unique identifier of your server in the network. It cannot be safely changed
    later.
- name: REDIS_HOST
  label: REDIS_HOST
  default: redis
  description: Redis server hostname
- name: REDIS_PORT
  label: REDIS_PORT
  default: '6379'
  description: Redis port
- name: DB_HOST
  label: DB_HOST
  default: db
  description: Postgres database hostname
- name: DB_USER
  label: DB_USER
  default: mastodon
  description: Postgres username
- name: DB_NAME
  label: DB_NAME
  default: mastodon
  description: Postgres db name
- name: DB_PASS
  label: DB_PASS
  default: mastodon
  description: Postgres password
- name: DB_PORT
  label: DB_PORT
  default: '5432'
  description: Postgres port
- name: ES_ENABLED
  label: ES_ENABLED
  default: 'false'
  description: Enable or disable Elasticsearch (requires a separate ES instance)
- name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
  label: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
  default: ''
  description: Primary key for [Active Record Encryption](https://github.com/mastodon/mastodon/pull/29831/files).
- name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
  label: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
  default: ''
  description: Deterministic key for [Active Record Encryption](https://github.com/mastodon/mastodon/pull/29831/files).
- name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
  label: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
  default: ''
  description: Derivation salt for [Active Record Encryption](https://github.com/mastodon/mastodon/pull/29831/files).
- name: SECRET_KEY_BASE
  label: SECRET_KEY_BASE
  default: ''
  description: Browser session secret. Changing it will break all active browser sessions.
- name: OTP_SECRET
  label: OTP_SECRET
  default: ''
  description: MFA secret. Changing it after initial setup will break two-factor authentication.
- name: VAPID_PRIVATE_KEY
  label: VAPID_PRIVATE_KEY
  default: ''
  description: Push notification private key. Changing it after initial setup will break push notifications.
- name: VAPID_PUBLIC_KEY
  label: VAPID_PUBLIC_KEY
  default: ''
  description: Push notification public key. Changing it after initial setup will break push notifications.
- name: SMTP_SERVER
  label: SMTP_SERVER
  default: mail.example.com
  description: SMTP server for email notifications
- name: SMTP_PORT
  label: SMTP_PORT
  default: '25'
  description: SMTP server port
- name: SMTP_LOGIN
  label: SMTP_LOGIN
  default: ''
  description: SMTP username
- name: SMTP_PASSWORD
  label: SMTP_PASSWORD
  default: ''
  description: SMTP password
- name: SMTP_FROM_ADDRESS
  label: SMTP_FROM_ADDRESS
  default: notifications@example.com
  description: From address for emails send from Mastodon
- name: S3_ENABLED
  label: S3_ENABLED
  default: 'false'
  description: Enable or disable S3 storage of uploaded files
- name: WEB_DOMAIN
  label: WEB_DOMAIN
  default: mastodon.example.com
  description: This can be set if you want your server identifier to be different to the subdomain hosting
    Mastodon. See [https://docs.joinmastodon.org/admin/config/#basic](https://docs.joinmastodon.org/admin/config/#basic)
    [OPTIONAL]
- name: ES_HOST
  label: ES_HOST
  default: es
  description: Elasticsearch server hostname [OPTIONAL]
- name: ES_PORT
  label: ES_PORT
  default: '9200'
  description: Elasticsearch port [OPTIONAL]
- name: ES_USER
  label: ES_USER
  default: elastic
  description: Elasticsearch username [OPTIONAL]
- name: ES_PASS
  label: ES_PASS
  default: elastic
  description: Elasticsearch password [OPTIONAL]
- name: S3_BUCKET
  label: S3_BUCKET
  default: ''
  description: S3 bucket hostname [OPTIONAL]
- name: AWS_ACCESS_KEY_ID
  label: AWS_ACCESS_KEY_ID
  default: ''
  description: S3 bucket access key ID [OPTIONAL]
- name: AWS_SECRET_ACCESS_KEY
  label: AWS_SECRET_ACCESS_KEY
  default: ''
  description: S3 bucket secret access key [OPTIONAL]
- name: S3_ALIAS_HOST
  label: S3_ALIAS_HOST
  default: ''
  description: Alternate hostname for object fetching if you are front the S3 connections. [OPTIONAL]
- name: SIDEKIQ_ONLY
  label: SIDEKIQ_ONLY
  default: 'false'
  description: Only run the sidekiq service in this container instance. For large scale instances that
    need better queue handling. [OPTIONAL]
- name: SIDEKIQ_QUEUE
  label: SIDEKIQ_QUEUE
  default: ''
  description: The name of the sidekiq queue to run in this container. See [notes](https://docs.joinmastodon.org/admin/scaling/#sidekiq-queues).
    [OPTIONAL]
- name: SIDEKIQ_DEFAULT
  label: SIDEKIQ_DEFAULT
  default: 'false'
  description: Set to `true` on the main container if you're running additional sidekiq instances. It
    will run the `default` queue. [OPTIONAL]
- name: SIDEKIQ_THREADS
  label: SIDEKIQ_THREADS
  default: '5'
  description: The number of threads for sidekiq to use. See [notes](https://docs.joinmastodon.org/admin/scaling/#sidekiq-threads).
    [OPTIONAL]
- name: DB_POOL
  label: DB_POOL
  default: '5'
  description: The size of the DB connection pool, must be *at least* the same as `SIDEKIQ_THREADS`. See
    [notes](https://docs.joinmastodon.org/admin/scaling/#sidekiq-threads). [OPTIONAL]
- name: NO_CHOWN
  label: NO_CHOWN
  default: ''
  description: Set to `true` to skip chown of /config on init. *READ THE APPLICATION NOTES BEFORE SETTING
    THIS*. [OPTIONAL]
- name: MASTODON_PROMETHEUS_EXPORTER_ENABLED
  label: MASTODON_PROMETHEUS_EXPORTER_ENABLED
  default: ''
  description: If set to `true`, Mastodon’s Ruby processes (web & Sidekiq) will enable the Prometheus
    instrumentation. [OPTIONAL]
