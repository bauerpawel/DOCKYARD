name: Qdirstat
slug: qdirstat
category: Cloud & Storage
type: container
image: linuxserver/qdirstat:latest@sha256:9c1cfe1fcc815fad09b1f4e67d0e51dd7b28800c72d7ba70215f085d623d9860
description: '[QDirStat](https://github.com/shundhammer/qdirstat) Qt-based directory statistics: KDirStat
  without any KDE -- from the author of the original KDirStat.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/qdirstat-logo.png
website: https://github.com/linuxserver/docker-qdirstat
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/qdirstat/config
- container: /data
  bind: /srv/lsio/qdirstat/data
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
