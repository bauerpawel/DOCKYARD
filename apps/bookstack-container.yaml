name: Bookstack (container)
slug: bookstack-container
category: CMS
type: container
image: linuxserver/bookstack:latest
description: '[Bookstack](https://codeberg.org/bookstack/bookstack) is a free and open source Wiki designed
  for creating beautiful documentation. Featuring a simple, but powerful WYSIWYG editor it allows for
  teams to create detailed and useful documentation with ease. Powered by SQL and including a Markdown
  editor for those who prefer it, BookStack is geared towards making documentation more of a pleasure
  than a chore. For more information on BookStack visit their website and check it out: https://www.bookstackapp.com'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bookstack-logo.png
website: https://github.com/linuxserver/docker-bookstack
ports:
- 6875:80/tcp
volumes:
- container: /config
  bind: /srv/lsio/bookstack/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: APP_URL
  label: APP_URL
  default: ''
  description: The protocol, IP/URL, and port that your application will be accessed on (ie. `http://192.168.1.1:6875`
    or `https://bookstack.mydomain.com`
- name: APP_KEY
  label: APP_KEY
  default: ''
  description: Session encryption key. You will need to generate this with `docker run -it --rm --entrypoint
    /bin/bash lscr.io/linuxserver/bookstack:latest appkey`
- name: DB_HOST
  label: DB_HOST
  default: ''
  description: The database instance hostname
- name: DB_PORT
  label: DB_PORT
  default: '3306'
  description: Database port
- name: DB_USERNAME
  label: DB_USERNAME
  default: ''
  description: Database user
- name: DB_PASSWORD
  label: DB_PASSWORD
  default: ''
  description: Database password (minimum 4 characters & non-alphanumeric passwords must be properly escaped.)
- name: DB_DATABASE
  label: DB_DATABASE
  default: ''
  description: Database name
- name: QUEUE_CONNECTION
  label: QUEUE_CONNECTION
  default: ''
  description: Set to `database` to enable async actions like sending email or triggering webhooks. See
    [documentation](https://www.bookstackapp.com/docs/admin/email-webhooks/#async-action-handling). [OPTIONAL]
