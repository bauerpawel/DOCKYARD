name: SickRage
slug: sickrage
category: Downloaders
type: container
image: linuxserver/sickrage:latest
description: Automatic Video Library Manager for TV Shows. It watches for new episodes of your favorite
  shows, and when they are posted it does its magic.
logo: https://mediadepot.github.io/templates/img/sickrage-icon.png
website: https://github.com/SiCKRAGE/SiCKRAGE
ports:
- 8081/tcp
volumes:
- container: /config
  bind: /opt/mediadepot/apps/sickrage
- container: /downloads
  bind: /media/storage/downloads/tvshows
- container: /tv
  bind: /media/storage/tvshows
- container: /blackhole
  bind: /media/temp/blackhole/tvshows
env:
- name: PGID
  label: PGID
  default: '15000'
  preset: true
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- name: PUID
  label: PUID
  default: '15000'
  preset: true
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- name: TZ
  label: TZ
  default: America/Los_Angeles
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
