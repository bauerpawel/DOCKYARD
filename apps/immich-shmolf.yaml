name: Immich {shmolf}
slug: immich-shmolf
category: Media
type: compose
repository:
  url: https://github.com/shmolf/portainer-templates
  stackfile: stacks/immich/docker-compose.yml
description: Self-hosted backup solution for photos and videos on mobile device.
logo: https://raw.githubusercontent.com/shmolf/portainer-templates/main/assets/logos/immich-logo.svg
website: https://immich.app
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- label: PGID
  name: PGID
  default: '1000'
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: Immich version
  name: IMMICH_VERSION
  default: release
  description: To want to lock to a specific tag, provide a value such as 'v1.71.0'
- label: Database username
  name: DB_USERNAME
  default: postgres
  description: Application database username. Match the role configured in the database service and
    retain it when connecting to an existing database.
- label: Database password
  name: DB_PASSWORD
  default: please-change-this-to-a-random-secret
  description: This should be changed to a random secret
- label: Database name
  name: DB_DATABASE_NAME
  default: immich
  description: Immich database name. Match the database service and keep the name already used by existing
    Immich data.
- label: Database hostname
  name: DB_HOSTNAME
  default: immich_postgres
  description: The default value references a service within the stack
- label: File backup location
  name: UPLOAD_LOCATION
  default: /portainer/Files/AppData/Immich/upload
  description: You can leave this path as-is, and the system will auto-create the needed folders. Feel
    free to change if you desire an alternative location.
- label: Redis hostname
  name: REDIS_HOSTNAME
  default: immich_redis
  description: The default value references a service within the stack
- default: '2283'
  label: Http Port
  name: PORT
  description: Free host TCP port published by this Compose stack, from 1 to 65535. This selects the
    host side of the mapping; the container's internal application port remains defined in the stackfile.
