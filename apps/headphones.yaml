name: Headphones
slug: headphones
category: Media
type: container
image: linuxserver/headphones:latest
description: Headphones is an automated music downloader for NZB and Torrent, written in Python. It supports
  SABnzbd, NZBget, Transmission, µTorrent and Blackhole.
logo: https://raw.githubusercontent.com/Qballjos/portainer_templates/master/Images/headphones-icon.png
website: https://github.com/rembo10/headphones
ports:
- 8181:8181/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/Headphones
- container: /Downloads
  bind: /portainer/Downloads
- container: /music
  bind: /portainer/Music
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
