name: Let's Encrypt
slug: let-s-encrypt
category: Utilities
type: container
image: linuxserver/letsencrypt:latest
description: "This container sets up an Nginx webserver and reverse proxy with php support and a built-in\
  \ letsencrypt client that automates free SSL server certificate generation and renewal processes. It\
  \ also contains fail2ban for intrusion prevention.\r\n  \r\n  Before running this container, make sure\
  \ that the url and subdomains are properly forwarded to this container's host.\r\n  \r\n  - Port 443\
  \ on the internet side of the router should be forwarded to this container's port 443.\r\n  - If you\
  \ need a dynamic dns provider, you can use the free provider duckdns.org where the url will be yoursubdomain.duckdns.org\
  \ and the subdomains    can be www,ftp,cloud\r\n  - The container detects changes to url and subdomains,\
  \ revokes existing certs and generates new ones during start. \r\n  - It also detects changes to the\
  \ DHLEVEL parameter and replaces the dhparams file.\r\n  \r\n  - If you'd like to password protect your\
  \ sites, you can use htpasswd. Run the following command on your host to generate the htpasswd file\
  \ docker exec -it letsencrypt htpasswd -c /config/nginx/.htpasswd &lt;username&gt;"
logo: https://raw.githubusercontent.com/SelfhostedPro/selfhosted_templates/master/Images/letsencrypt.png
website: https://github.com/linuxserver-archive/docker-letsencrypt
ports:
- 80/tcp
- 443/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/LetsEncrypt
env:
- label: EMAIL
  name: EMAIL
  default: -Xms256m -Xmx512m
  preset: true
  description: Contact email for certificate registration and renewal notices, for example admin@example.com.
    The existing JVM-options example is not an email address; replace it in the template before enabling
    automatic certificate issuance.
- label: URL
  name: URL
  default: -Xms256m -Xmx512m
  preset: true
  description: Base domain for certificate issuance, for example example.com, without a URL scheme.
    The existing JVM-options example is invalid here and must be corrected in the template before deployment.
- label: SUBDOMAINS
  name: SUBDOMAINS
  default: www,
  preset: true
  description: Comma-separated certificate subdomains, for example www,cloud. Use only names with matching
    DNS and configure the required validation method separately.
- label: ONLY_SUBDOMAINS
  name: ONLY_SUBDOMAINS
  default: 'false'
  preset: true
  description: true requests certificates only for the listed subdomains; false includes the base domain
    where supported by the deployed LinuxServer image.
- label: DHLEVEL
  name: DHLEVEL
  default: '2048'
  preset: true
  description: Legacy Diffie-Hellman parameter bit length, such as 2048. Support depends on the selected
    LinuxServer image release; it does not choose certificate key length.
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: VALIDATION
  name: VALIDATION
  default: http
  preset: true
  description: Certificate domain-validation method supported by the deployed image, such as http or
    dns. HTTP requires reachable validation ports; DNS requires the matching provider plugin and credentials.
- label: DNSPLUGIN
  name: DNSPLUGIN
  default: http
  preset: true
  description: DNS provider plugin name used for dns validation. Use a provider supported by the deployed
    image and configure its credential file; http is not a DNS provider plugin.
