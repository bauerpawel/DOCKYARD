name: Nginx Proxy Manager v2 with Sqlite and Goaccess Charts
slug: nginx-proxy-manager-v2-with-sqlite-and-goaccess-charts
category: Networking
type: compose
repository:
  url: https://github.com/pi-hosted/pi-hosted
  stackfile: stack/nginx-proxy-manager-sqlite-goaccess.yml
description: Nginx Proxy Manager v2 with sqlite and Goaccess Charts enables you to easily forward to your
  websites running at home or otherwise, including free SSL, without having to know too much about Nginx
  or Letsencrypt.  Please see the install document at https://github.com/pi-hosted/pi-hosted/tree/master/docs
  installing the template
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/proxy_mgr.png
website: null
ports:
- 80:80/tcp
- 81:81/tcp
- 443:443/tcp
- 7880:7880/tcp
env:
- default: '1000'
  label: PUID
  name: PUID
- default: '1000'
  label: PGID
  name: PGID
- default: America/New_York
  label: TZ
  name: TZ
- default: 'false'
  label: SKIP_ARCHIVED_LOGS
  name: SKIP_ARCHIVED_LOGS
  description: Defaults to false. Set to true to skip archived logs, i.e. proxy-host*.gz
- default: 'false'
  label: BASIC_AUTH
  name: BASIC_AUTH
  description: Defaults to false. Set to true to enable nginx basic authentication. Docker container needs
    to stopped or restarted each time this flag is modified. This allows for the .htpasswd file to be
    changed accordingly.
- default: user
  label: BASIC_AUTH_USERNAME Ignore if Basic Auth set to false
  name: BASIC_AUTH_USERNAME
  description: (Optional) Requires BASIC_AUTH to bet set to true. Username for basic authentication.
- default: Password
  label: BASIC_AUTH_PASSWORD Ignore if Basic Auth set to false
  name: BASIC_AUTH_PASSWORD
  description: (Optional) Requires BASIC_AUTH to bet set to true. Password for basic authentication.
