name: Openssh-server
slug: openssh-server
category: Utilities
type: container
image: linuxserver/openssh-server:latest
description: '[Openssh-server](https://www.openssh.com/) is a sandboxed environment that allows ssh access
  without giving keys to the entire server. Giving ssh access via private key often means giving full
  access to the server. This container creates a limited and sandboxed environment that others can ssh
  into. The users only have access to the folders mapped and the processes running inside this container.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/openssh-server-logo.png
website: https://github.com/linuxserver/docker-openssh-server
ports:
- 2222:2222/tcp
volumes:
- container: /config
  bind: /srv/lsio/openssh-server/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: PUBLIC_KEY
  label: PUBLIC_KEY
  default: yourpublickey
  description: Optional ssh public key, which will automatically be added to authorized_keys. [OPTIONAL]
- name: PUBLIC_KEY_FILE
  label: PUBLIC_KEY_FILE
  default: /path/to/file
  description: Optionally specify a file containing the public key (works with docker secrets). [OPTIONAL]
- name: PUBLIC_KEY_DIR
  label: PUBLIC_KEY_DIR
  default: /path/to/directory/containing/_only_/pubkeys
  description: Optionally specify a directory containing the public keys (works with docker secrets).
    [OPTIONAL]
- name: PUBLIC_KEY_URL
  label: PUBLIC_KEY_URL
  default: https://github.com/username.keys
  description: Optionally specify a URL containing the public key. [OPTIONAL]
- name: SUDO_ACCESS
  label: SUDO_ACCESS
  default: 'false'
  description: Set to `true` to allow `linuxserver.io`, the ssh user, sudo access. Without `USER_PASSWORD`
    set, this will allow passwordless sudo access. [OPTIONAL]
- name: PASSWORD_ACCESS
  label: PASSWORD_ACCESS
  default: 'false'
  description: Set to `true` to allow user/password ssh access. You will want to set `USER_PASSWORD` or
    `USER_PASSWORD_FILE` as well. [OPTIONAL]
- name: USER_PASSWORD
  label: USER_PASSWORD
  default: password
  description: Optionally set a sudo password for `linuxserver.io`, the ssh user. If this or `USER_PASSWORD_FILE`
    are not set but `SUDO_ACCESS` is set to true, the user will have passwordless sudo access. [OPTIONAL]
- name: USER_PASSWORD_FILE
  label: USER_PASSWORD_FILE
  default: /path/to/file
  description: Optionally specify a file that contains the password. This setting supersedes the `USER_PASSWORD`
    option (works with docker secrets). [OPTIONAL]
- name: USER_NAME
  label: USER_NAME
  default: linuxserver.io
  description: Optionally specify a user name (Default:`linuxserver.io`) [OPTIONAL]
- name: LOG_STDOUT
  label: LOG_STDOUT
  default: ''
  description: Set to `true` to log to stdout instead of file. [OPTIONAL]
