name: JDownloader
slug: jdownloader
category: Downloaders
type: container
image: jaymoulin/jdownloader:latest
description: JDownloader docker image
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/jdownloader.png
website: https://github.com/jaymoulin/docker-jdownloader
ports:
- 3129:3129/tcp
volumes:
- container: /opt/JDownloader/app/cfg
  bind: /portainer/Files/AppData/Config/JDownloader
- container: /opt/JDownloader/Downloads
  bind: /portainer/Downloads
env:
- default: ''
  label: MYJD_DEVICE_NAME
  name: MYJD_DEVICE_NAME
  description: Name identifying this JDownloader instance in MyJDownloader. Choose a distinct name when
    registering multiple downloaders.
- default: ''
  label: MYJD_USER
  name: MYJD_USER
  description: Email address of the MyJDownloader account used to register this instance. Use together
    with MYJD_PASSWORD; leave empty only when not using that integration.
- default: ''
  label: MYJD_PASSWORD
  name: MYJD_PASSWORD
  description: Private MyJDownloader account password. Use together with MYJD_USER; it is separate from
    any remote desktop password.
