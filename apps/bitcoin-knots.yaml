name: Bitcoin-knots
slug: bitcoin-knots
category: Business & Finance
type: container
image: linuxserver/bitcoin-knots:latest
description: '[Bitcoin Knots](https://bitcoinknots.org/) can be used as a desktop client for regular payments
  or as a full node server utility for merchants and other payment services.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bitcoin-knots-logo.png
website: https://github.com/linuxserver/docker-bitcoin-knots
ports:
- 3000:3000/tcp
- 3001:3001/tcp
- 8333:8333/tcp
volumes:
- container: /config
  bind: /srv/lsio/bitcoin-knots/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
