name: systemprompt
slug: systemprompt
category: Automation
type: compose
repository:
  url: https://github.com/lissy93/portainer-templates
  stackfile: sources/stacks/systemprompt.yml
description: 'Self-owned AI control plane: governance gateway for Claude, OpenAI, and Gemini with policy
  checks, audit, rate limits, and MCP orchestration. Bundles Postgres. GitHub: [systempromptio/systemprompt-template](https://github.com/systempromptio/systemprompt-template)'
logo: https://raw.githubusercontent.com/systempromptio/systemprompt-template/main/storage/files/images/icon-256.png
website: null
env:
- name: POSTGRES_PASSWORD
  label: Postgres password
  description: Set before first deploy; the database volume is initialised with it.
- default: ''
  name: ANTHROPIC_API_KEY
  label: Anthropic API key
  description: At least one provider key is required (leave others blank).
- default: ''
  name: OPENAI_API_KEY
  label: OpenAI API key
  description: Optional.
- default: ''
  name: GEMINI_API_KEY
  label: Gemini API key
  description: Optional.
- default: ''
  name: EXTERNAL_URL
  label: External URL
  description: Public URL of this deployment (e.g. https://gateway.example.com). Optional; used for API
    URL + CORS.
- default: '8080'
  name: HTTP_PORT
  label: HTTP port
  description: Host port to publish the gateway on.
