name: Mysql-workbench
slug: mysql-workbench
category: Database
type: container
image: linuxserver/mysql-workbench:latest
description: '[MySQL Workbench](https://www.mysql.com/products/workbench/) is a unified visual tool for
  database architects, developers, and DBAs. MySQL Workbench provides data modeling, SQL development,
  and comprehensive administration tools for server configuration, user administration, backup, and much
  more.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mysql-workbench-icon.png
website: https://github.com/linuxserver/docker-mysql-workbench
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/mysql-workbench/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
