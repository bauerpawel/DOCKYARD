name: Speedtest-tracker (container)
slug: speedtest-tracker-container
category: Monitoring
type: container
image: linuxserver/speedtest-tracker:latest
description: '[Speedtest-tracker](https://github.com/alexjustesen/speedtest-tracker) is a self-hosted
  internet performance tracking application that runs speedtest checks against Ookla''s Speedtest service.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/speedtest-tracker-logo.png
website: https://github.com/linuxserver/docker-speedtest-tracker
ports:
- 80:80/tcp
volumes:
- container: /config
  bind: /srv/lsio/speedtest-tracker/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: APP_KEY
  label: APP_KEY
  default: ''
  description: App key used for encrypting stored data. You can generate a key as per [https://speedtest-tracker.dev](https://docs.speedtest-tracker.dev/getting-started/installation/using-docker-compose#install-with-docker-compose)
- name: APP_URL
  label: APP_URL
  default: ''
  description: The IP:port or URL your application will be accessed on (ie. `http://192.168.1.1:6875`
    or `https://bookstack.mydomain.com`
- name: DB_CONNECTION
  label: DB_CONNECTION
  default: sqlite
  description: Set the database type to use. `sqlite`, `pgsql`, or `mysql`
- name: SPEEDTEST_SCHEDULE
  label: SPEEDTEST_SCHEDULE
  default: ''
  description: Set the test schedule in cron format. e.g. `0 */6 * * *`
- name: SPEEDTEST_SERVERS
  label: SPEEDTEST_SERVERS
  default: ''
  description: A comma-separated list of server IDs to test against. Run `docker run -it --rm --entrypoint
    /bin/bash lscr.io/linuxserver/speedtest-tracker:latest list-servers` to get a list of nearby servers.
- name: DB_HOST
  label: DB_HOST
  default: ''
  description: Database hostname (postgres/mysql). [OPTIONAL]
- name: DB_PORT
  label: DB_PORT
  default: ''
  description: Database port (postgres/mysql). [OPTIONAL]
- name: DB_DATABASE
  label: DB_DATABASE
  default: ''
  description: Database name (postgres/mysql). [OPTIONAL]
- name: DB_USERNAME
  label: DB_USERNAME
  default: ''
  description: Database username (postgres/mysql). [OPTIONAL]
- name: DB_PASSWORD
  label: DB_PASSWORD
  default: ''
  description: Database password (postgres/mysql). [OPTIONAL]
- name: DISPLAY_TIMEZONE
  label: DISPLAY_TIMEZONE
  default: Etc/UTC
  description: Timezone for the UI. [OPTIONAL]
- name: PRUNE_RESULTS_OLDER_THAN
  label: PRUNE_RESULTS_OLDER_THAN
  default: '0'
  description: Days to keep test results. [OPTIONAL]
