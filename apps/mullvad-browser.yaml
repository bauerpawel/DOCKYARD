name: Mullvad-browser
slug: mullvad-browser
category: Web
type: container
image: linuxserver/mullvad-browser:latest
description: The [Mullvad Browser](https://mullvad.net/en/browser) is a privacy-focused web browser developed
  in a collaboration between Mullvad VPN and the Tor Project. It’s designed to minimize tracking and fingerprinting.
  You could say it’s a Tor Browser to use without the Tor Network. Instead, you can use it with a trustworthy
  VPN.
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mullvad-browser-logo.png
website: https://github.com/linuxserver/docker-mullvad-browser
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/mullvad-browser/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: LOCAL_NET
  label: LOCAL_NET
  default: 192.168.0.0/16
  description: If using a VPN, set this to your local LAN IP range using CIDR notation. Without it you
    will be unable to access the web interface. If you have multiple ranges or a complex LAN setup you
    will need to manage this yourself in the wg0.conf, see the App Setup section for details. [OPTIONAL]
