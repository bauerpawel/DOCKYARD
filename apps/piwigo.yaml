name: Piwigo
slug: piwigo
category: Media
type: container
image: linuxserver/piwigo:latest
description: '[Piwigo](http://piwigo.org/) is a photo gallery software for the web that comes with powerful
  features to publish and manage your collection of pictures.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/piwigo-banner.png
website: https://github.com/linuxserver/docker-piwigo
ports:
- 80:80/tcp
volumes:
- container: /config
  bind: /srv/lsio/piwigo/config
- container: /gallery
  bind: /srv/lsio/piwigo/gallery
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
