name: MeTube
slug: metube
category: Downloaders
type: container
image: alexta69/metube:latest
description: Web GUI for youtube-dl (using the yt-dlp fork) with playlist support. Allows you to download
  videos from YouTube and dozens of other sites (https://github.com/yt-dlp/yt-dlp/blob/master/supportedsites.md)
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/metube.png
website: https://github.com/alexta69/metube
ports:
- 8081:8081/tcp
volumes:
- container: /downloads
  bind: /portainer/Downloads
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
