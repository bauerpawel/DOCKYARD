name: Stump
slug: stump
category: Media
type: container
image: aaronleopold/stump:latest
description: 'A free and open source comics, manga, and digital book server with OPDS support. Source:
  https://github.com/stumpapp/stump'
logo: https://avatars.githubusercontent.com/u/114969632
website: https://github.com/stumpapp/stump
ports:
- 10801:10801/tcp
volumes:
- container: /config
- container: /data
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- default: /config
  label: STUMP_CONFIG_DIR
  name: STUMP_CONFIG_DIR
  description: Absolute Stump configuration directory inside the container, such as /config. Keep it
    on the persistent configuration mount and ensure it is writable by the service.
