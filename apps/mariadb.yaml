name: Mariadb
slug: mariadb
category: Database
type: container
image: linuxserver/mariadb:latest
description: '[Mariadb](https://mariadb.org/) is one of the most popular database servers. Made by the
  original developers of MySQL.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mariadb-git.png
website: https://github.com/linuxserver/docker-mariadb
ports:
- 3306:3306/tcp
volumes:
- container: /config
  bind: /srv/lsio/mariadb/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: MYSQL_ROOT_PASSWORD
  label: MYSQL_ROOT_PASSWORD
  default: ROOT_ACCESS_PASSWORD
  description: Set this to root password for installation (minimum 4 characters & non-alphanumeric passwords
    must be properly escaped). (valid only for first run)
- name: MYSQL_DATABASE
  label: MYSQL_DATABASE
  default: USER_DB_NAME
  description: Specify the name of a database to be created. (valid only for first run) [OPTIONAL]
- name: MYSQL_USER
  label: MYSQL_USER
  default: MYSQL_USER
  description: This user will have superuser access to the database specified by MYSQL_DATABASE (do not
    use root here). (valid only for first run) [OPTIONAL]
- name: MYSQL_PASSWORD
  label: MYSQL_PASSWORD
  default: DATABASE_PASSWORD
  description: Set this to the password you want to use for you MYSQL_USER (minimum 4 characters & non-alphanumeric
    passwords must be properly escaped). (valid only for first run) [OPTIONAL]
- name: REMOTE_SQL
  label: REMOTE_SQL
  default: http://URL1/your.sql,https://URL2/your.sql
  description: Set this to ingest sql files from an http/https endpoint (comma seperated array). [OPTIONAL]
- name: CLI_OPTS
  label: CLI_OPTS
  default: ''
  description: Pass CLI options to mariadbd via mariadbd-safe. Use with caution as mariadbd option precedence
    is complex. [OPTIONAL]
