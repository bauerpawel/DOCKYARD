name: RustDesk (container)
slug: rustdesk-container
category: Remote Access
type: container
image: rustdesk/rustdesk-server-s6:latest@sha256:5974cd791a5aca6fbf01a167b37e7427db1d136e95b2710c33a34fdc9fea724c
description: A remote desktop software, the open source TeamViewer alternative, works out of the box,
  no configuration required. You have full control of your data, with no concerns about security.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/rustdesk.png
website: https://github.com/rustdesk/rustdesk-server
ports:
- 21115:21115/tcp
- 21116:21116/tcp
- 21116:21116/udp
- 21117:21117/tcp
- 21118:21118/tcp
- 21119:21119/tcp
volumes:
- container: /data
  bind: /portainer/Files/AppData/Config/rustdesk
env:
- default: rustdesk.example.com:21117
  description: Use your domain with the default 21117 port
  label: RELAY
  name: RELAY
- default: '1'
  description: if set to "1" unencrypted connection will not be accepted
  label: ENCRYPTED_ONLY
  name: ENCRYPTED_ONLY
