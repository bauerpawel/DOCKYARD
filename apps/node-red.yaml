name: Node Red
slug: node-red
category: Other
type: compose
repository:
  url: https://github.com/pi-hosted/pi-hosted/
  stackfile: stack/node-red.yml
description: Node-RED is a programming tool for wiring together hardware devices, APIs and online services
  in new and interesting ways.  It provides a browser-based editor that makes it easy to wire together
  flows using the wide range of nodes in the palette that can be deployed to its runtime in a single-click.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/node-red.png
website: https://nodered.org
ports:
- 1880:1880/tcp
env:
- default: your_secret_goes_here
  label: NODE_RED_CREDENTIAL_SECRET
  name: NODE_RED_CREDENTIAL_SECRET
  description: Private key used to encrypt Node-RED credentials. Replace the example before initial
    use and retain the key across updates so stored credentials remain readable.
- default: America/New_York
  label: TZ
  name: TZ
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
