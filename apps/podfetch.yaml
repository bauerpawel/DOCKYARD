name: PodFetch
slug: podfetch
category: Media
type: container
image: samuel19982/podfetch:latest
description: 'Sleek, self-hosted podcast manager that automatically downloads new episodes, offers a web
  UI for listening, and provides a GPodder-compatible sync API for mobile apps like AntennaPod. GitHub:
  [SamTV12345/PodFetch](https://github.com/SamTV12345/PodFetch)'
logo: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/podfetch.png
website: https://github.com/SamTV12345/PodFetch
ports:
- 8000:8000/tcp
volumes:
- container: /app/podcasts
  bind: /portainer/Files/AppData/PodFetch/podcasts
- container: /app/db
  bind: /portainer/Files/AppData/PodFetch/db
env:
- default: sqlite:///app/db/podcast.db
  label: DATABASE_URL
  name: DATABASE_URL
  description: PodFetch database connection URL. Keep SQLite files under its persistent database mount,
    or supply the connection URL for a supported external database.
- default: '300'
  label: POLLING_INTERVAL
  name: POLLING_INTERVAL
  description: Interval in seconds between PodFetch feed checks, as a positive integer. Shorter intervals
    increase network requests and server load.
- default: 'false'
  label: BASIC_AUTH
  name: BASIC_AUTH
  description: true enables PodFetch HTTP Basic authentication using USERNAME and PASSWORD; false disables
    it. Set both credentials before enabling authentication.
- default: ''
  label: USERNAME
  name: USERNAME
  description: PodFetch HTTP Basic authentication username when BASIC_AUTH=true. Set it together with
    PASSWORD; it is not a database account.
- default: ''
  label: PASSWORD
  name: PASSWORD
  description: Private PodFetch HTTP Basic authentication password when BASIC_AUTH=true. Set it together
    with USERNAME; it is not the database password.
- default: 'false'
  label: GPODDER_INTEGRATION_ENABLED
  name: GPODDER_INTEGRATION_ENABLED
  description: true enables the PodFetch gPodder-compatible integration; false disables it. Configure
    clients and authentication according to the deployed release.
