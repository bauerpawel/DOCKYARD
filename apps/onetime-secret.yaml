name: Onetime Secret
slug: onetime-secret
category: Security
type: compose
image: onetimesecret/onetimesecret:v0.26.19@sha256:eb630051046042195a1dee73367f4f02a33ab3275bdc4d77a5d2c3dba88d3f0e
compose: stacks/onetime-secret/docker-compose.yml
description: >-
  Shares confidential text through single-use links with expiration and optional passphrases. Includes
  the simple authentication mode and a password-protected persistent Valkey datastore. Full authentication
  with MFA/SSO and background workers is not deployed.
note: >-
  Set SECRET, VALKEY_PASSWORD and ONETIME_HOST. ONETIME_HOST is the exact public hostname, with port when
  nonstandard, without a scheme. The default expects HTTPS through an existing reverse proxy. For a trusted
  HTTP-only deployment, set both ONETIME_SSL and SESSION_COOKIE_SECURE to false. Configure SMTP before
  relying on account verification or email notifications. Back up Valkey and SECRET together; losing or
  changing the root secret can invalidate stored data. This stack uses only the upstream simple mode.
  Documentation: https://docs.onetimesecret.com/en/self-hosting
logo: https://cdn.jsdelivr.net/gh/selfhst/icons/png/onetime-secret.png
website: https://onetimesecret.com/
env:
  - name: SECRET
    label: Root encryption secret
    description: Required. Generate with openssl rand -hex 32. Preserve it with the data volumes on updates.
  - name: VALKEY_PASSWORD
    label: Datastore password
    description: 'Required. URL-safe hexadecimal password: openssl rand -hex 32. Preserve it on updates.'
  - name: ONETIME_HOST
    label: Public hostname
    description: Required. Exact public hostname, with port if nonstandard, such as secrets.example.com.
      No scheme or path.
  - name: ONETIME_SSL
    label: Public HTTPS
    description: true when the public URL uses HTTPS. For HTTP-only testing, set false together with SESSION_COOKIE_SECURE.
    default: 'true'
  - name: SESSION_COOKIE_SECURE
    label: HTTPS-only session cookies
    description: Keep true for HTTPS; set false only together with ONETIME_SSL=false for trusted HTTP
      testing.
    default: 'true'
  - name: ONETIME_PORT
    label: Web port
    description: Free host TCP port, from 1 to 65535. Match it in the public URL or reverse proxy.
    default: '3000'
