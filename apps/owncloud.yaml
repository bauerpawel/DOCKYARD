name: Owncloud
slug: owncloud
category: Cloud & Storage
type: compose
repository:
  url: https://github.com/Qballjos/portainer_templates
  stackfile: Template/Stack/owncloud.yml
description: ownCloud is a self-hosted file sync and share server. It provides access to your data through
  a web interface, sync clients or WebDAV while providing a platform to view, sync and share across devices
  easily—all under your control. ownCloud’s open architecture is extensible via a simple but powerful
  API for applications and plugins and it works with any storage.
logo: https://raw.githubusercontent.com/docker-library/docs/9d36b4ed7cabc35dbd3849272ba2bd7abe482172/owncloud/logo.png
website: https://owncloud.com
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: TZ
  name: TZ
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
- label: OWNCLOUD_DOMAIN
  name: OWNCLOUD_DOMAIN
  description: Public ownCloud host or host:port value in the format supported by its image, for example
    cloud.example.com. Match the external address and configure TLS separately.
- label: DB_PASSWORD
  name: DB_PASSWORD
  description: Private application database password, matching the configured database account. Replace
    any example value before first use; an environment change alone does not rotate an existing database
    password.
- label: ADMIN_USERNAME
  name: ADMIN_USERNAME
  description: Initial application administrator username. Choose it before first setup; changing the
    variable does not rename an existing stored account.
- label: ADMIN_PASSWORD
  name: ADMIN_PASSWORD
  description: Private initial application administrator password. Set a deployment-specific value before
    first setup and change stored accounts through the application later.
- label: PORT
  name: PORT
  description: Free host TCP port published by this Compose stack, from 1 to 65535. This selects the
    host side of the mapping; the container's internal application port remains defined in the stackfile.
