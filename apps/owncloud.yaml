name: Owncloud
slug: owncloud
category: Cloud & Storage
type: compose
repository:
  url: https://github.com/Qballjos/portainer_templates
  stackfile: Template/Stack/owncloud.yml
description: ownCloud is a self-hosted file sync and share server. It provides access to your data through
  a web interface, sync clients or WebDAV while providing a platform to view, sync and share across devices
  easily—all under your control. ownCloud’s open architecture is extensible via a simple but powerful
  API for applications and plugins and it works with any storage.
logo: https://raw.githubusercontent.com/docker-library/docs/9d36b4ed7cabc35dbd3849272ba2bd7abe482172/owncloud/logo.png
website: null
env:
- default: '1000'
  label: PUID
  name: PUID
- default: '100'
  label: PGID
  name: PGID
- label: TZ
  name: TZ
- label: OWNCLOUD_DOMAIN
  name: OWNCLOUD_DOMAIN
- label: DB_PASSWORD
  name: DB_PASSWORD
- label: ADMIN_USERNAME
  name: ADMIN_USERNAME
- label: ADMIN_PASSWORD
  name: ADMIN_PASSWORD
- label: PORT
  name: PORT
