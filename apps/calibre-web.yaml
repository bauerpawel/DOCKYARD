name: Calibre Web
slug: calibre-web
category: Books & Documents
type: container
image: linuxserver/calibre-web:latest
description: '[Calibre-web](https://github.com/janeczku/calibre-web) is a web app providing a clean interface
  for browsing, reading and downloading eBooks using an existing Calibre database. It is also possible
  to integrate google drive and edit metadata and your calibre library through the app itself. This software
  is a fork of library and licensed under the GPL v3 License.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/calibre-web-icon.png
website: https://github.com/linuxserver/docker-calibre-web
ports:
- 8083/tcp
volumes:
- container: /config
  bind: /opt/mediadepot/apps/calibre-web/config
- container: /books
  bind: /media/storage/ebooks
env:
- name: PUID
  label: PUID
  default: '15000'
  description: for UserID
- name: PGID
  label: PGID
  default: '15000'
  description: for GroupID
- name: TZ
  label: TZ
  default: America/Los_Angeles
  description: Specify a timezone to use for example Europe/Amsterdam
- name: DOCKER_MODS
  label: DOCKER_MODS
  default: linuxserver/mods:universal-calibre
  description: '#optional & **x86-64 only** Adds the ability to perform ebook conversion'
- name: OAUTHLIB_RELAX_TOKEN_SCOPE
  label: OAUTHLIB_RELAX_TOKEN_SCOPE
  default: '1'
  description: Optionally set this to allow Google OAUTH to work
