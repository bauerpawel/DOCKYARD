name: Htpcmanager
slug: htpcmanager
category: Media
type: container
image: linuxserver/htpcmanager:latest
description: '[Htpcmanager](https://github.com/HTPC-Manager/HTPC-Manager) is a front end for many htpc
  related applications.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/htpcmanager-icon.png
website: https://github.com/linuxserver/docker-htpcmanager
ports:
- 8085:8085/tcp
volumes:
- container: /config
  bind: /srv/lsio/htpcmanager/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
