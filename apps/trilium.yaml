name: Trilium
slug: trilium
category: Productivity
type: container
image: triliumnext/trilium:latest
description: Trilium Notes is a hierarchical note taking application with focus on building large personal
  knowledge bases
logo: https://www.saashub.com/images/app/service_logos/55/2901389fab77/large.png?1561117248
website: https://github.com/TriliumNext/Trilium
ports:
- 3388:8080/tcp
volumes:
- container: /home/node/trilium-data
  bind: /portainer/Files/AppData/Config/trilium-data
env:
- default: /home/node/trilium-data
  label: TRILIUM_DATA_DIR
  name: TRILIUM_DATA_DIR
  description: Absolute Trilium data directory inside the container, such as /home/node/trilium-data.
    Keep it within persistent mounted storage to preserve notes and database state.
- label: PORT
  name: PORT
  description: Legacy field in this Trilium template. Do not assume PORT changes the selected image
    listener; check its documented configuration. This field does not change the fixed 3388:8080 Docker
    port mapping.
