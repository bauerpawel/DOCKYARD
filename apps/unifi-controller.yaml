name: UniFi Controller
slug: unifi-controller
category: Utilities
type: container
image: linuxserver/unifi-controller:latest
description: The Unifi-controller Controller software is a powerful, enterprise wireless software engine
  ideal for high-density client deployments requiring low latency and high uptime performance.
logo: https://raw.githubusercontent.com/Qballjos/portainer_templates/master/Images/unifi-icon.png
website: https://www.ui.com
ports:
- 3478:3478/udp
- 10001:10001/udp
- 8080:8080/tcp
- 8081:8081/tcp
- 8443:8443/tcp
- 8843:8843/tcp
- 8880:8880/tcp
- 6789:6789/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/Unifi
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
