name: Manubes Edge Node
slug: manubes-edge-node
category: Other
type: compose
repository:
  url: https://github.com/portainer/templates
  stackfile: edge/inray-manubes-edge-node/docker-compose.yml
description: High-performance cloud platform for industrial production management. Manubes is a no-code
  solution that is used to structure, monitor and control production data, systems and processes in the
  cloud.
logo: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/inray-manubes.png
website: https://manubes.com
env:
- name: MANUBES_SECRET
  label: manubes secret
  description: Private enrollment or connection secret supplied by your manubes deployment. Obtain it
    through the manubes setup process; this template does not generate one.
- name: ACCEPT_EULA
  label: Accept EULA
  select:
  - text: Yes, I accept
    value: 'true'
    default: true
  description: true records acceptance of the manubes license terms. Review the terms before selecting
    acceptance; this is separate from a license or enrollment secret.
