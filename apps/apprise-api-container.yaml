name: Apprise-api (container)
slug: apprise-api-container
category: Monitoring
type: container
image: linuxserver/apprise-api:latest
description: '[Apprise-api](https://github.com/caronc/apprise-api) Takes advantage of [Apprise](https://github.com/caronc/apprise)
  through your network with a user-friendly API. * Send notifications to more than 100 services. * An
  incredibly lightweight gateway to Apprise. * A production ready micro-service at your disposal. * A
  Simple Website to verify and test your configuration with. Apprise API was designed to easily fit into
  existing (and new) eco-systems that are looking for a simple notification solution.'
logo: https://raw.githubusercontent.com/caronc/apprise-api/master/apprise_api/static/logo.png
website: https://github.com/linuxserver/docker-apprise-api
ports:
- 8000:8000/tcp
volumes:
- container: /config
  bind: /srv/lsio/apprise-api/config
- container: /attachments
  bind: /srv/lsio/apprise-api/attachments
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: APPRISE_ATTACH_SIZE
  label: APPRISE_ATTACH_SIZE
  default: '0'
  description: Max attachment size in Mb. `0` disables attachments. Must have `/attachments` mounted to
    set to a positive value. [OPTIONAL]
