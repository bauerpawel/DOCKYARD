name: Mame
slug: mame
category: Gaming
type: container
image: linuxserver/mame:latest
description: '[MAME](https://www.mamedev.org/) is a free and open-source emulator designed to emulate
  the hardware of arcade games, video game consoles, old computers and other systems in software on modern
  personal computers.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mame-logo.png
website: https://github.com/linuxserver/docker-mame
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/mame/config
- container: /mame:ro
  bind: /srv/lsio/mame/mame:ro
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
