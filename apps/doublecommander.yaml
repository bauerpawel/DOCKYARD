name: Doublecommander
slug: doublecommander
category: Cloud & Storage
type: container
image: linuxserver/doublecommander:latest
description: '[Double Commander](https://doublecmd.sourceforge.io/) is a free cross platform open source
  file manager with two panels side by side. It is inspired by Total Commander and features some new ideas.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/doublecommander-icon.png
website: https://github.com/linuxserver/docker-doublecommander
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/doublecommander/config
- container: /data
  bind: /srv/lsio/doublecommander/data
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
