name: Terraria Server {shmolf}
slug: terraria-server-shmolf
category: Gaming
type: container
image: passivelemon/terraria-docker:latest
description: Docker container for a Terraria dedicated server.
logo: https://raw.githubusercontent.com/shmolf/portainer-templates/main/assets/logos/terraria-server.png
website: https://github.com/PassiveLemon/terraria-docker
ports:
- 7777:7777/tcp
volumes:
- container: /usr/share/tesseract-ocr/5/tessdata
  bind: /portainer/Files/AppData/Libraries/StirlingPDF/tessdata
env:
- label: PUID
  name: PUID
  default: '1000'
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- label: PGID
  name: PGID
  default: '1000'
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: World name
  name: WORLD
  default: dockerworld
  description: Terraria world/save name used by this image. Choose the intended existing world when
    reusing persistent storage; changing the name can select or create a different world.
