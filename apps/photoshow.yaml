name: PhotoShow
slug: photoshow
category: Media
type: container
image: linuxserver/photoshow:latest
description: A simple, easy way to turn a photo album into a webgallery
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/photoshow-icon.png
website: https://github.com/linuxserver-archive/docker-photoshow
ports:
- 80/tcp
volumes:
- container: /Pictures
  bind: /portainer/Pictures
- container: /Thumbs
  bind: /portainer/Files/AppData/Photoshow/Thumbs
- container: /config
  bind: /portainer/Files/AppData/Config/PhotoShow
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
