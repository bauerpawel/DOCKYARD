name: Wireguard
slug: wireguard
category: Networking
type: container
image: linuxserver/wireguard:latest
description: '[WireGuard®](https://www.wireguard.com/) is an extremely simple yet fast and modern VPN
  that utilizes state-of-the-art cryptography. It aims to be faster, simpler, leaner, and more useful
  than IPsec, while avoiding the massive headache. It intends to be considerably more performant than
  OpenVPN. WireGuard is designed as a general purpose VPN for running on embedded interfaces and super
  computers alike, fit for many different circumstances. Initially released for the Linux kernel, it is
  now cross-platform (Windows, macOS, BSD, iOS, Android) and widely deployable. It is currently under
  heavy development, but already it might be regarded as the most secure, easiest to use, and simplest
  VPN solution in the industry.'
logo: https://www.wireguard.com/img/wireguard.svg
website: https://github.com/linuxserver/docker-wireguard
ports:
- 51820:51820/udp
volumes:
- container: /config
  bind: /srv/lsio/wireguard/config
- container: /lib/modules
  bind: /lib/modules
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: SERVERURL
  label: SERVERURL
  default: wireguard.domain.com
  description: External IP or domain name for docker host. Used in server mode. If set to `auto`, the
    container will try to determine and set the external IP automatically [OPTIONAL]
- name: SERVERPORT
  label: SERVERPORT
  default: '51820'
  description: External port for docker host. Used in server mode. [OPTIONAL]
- name: PEERS
  label: PEERS
  default: '1'
  description: 'Number of peers to create confs for. Required for server mode. Can also be a list of names:
    `myPC,myPhone,myTablet` (alphanumeric only) [OPTIONAL]'
- name: PEERDNS
  label: PEERDNS
  default: auto
  description: DNS server set in peer/client configs (can be set as `8.8.8.8`). Used in server mode. Defaults
    to `auto`, which uses wireguard docker host's DNS via included CoreDNS forward. [OPTIONAL]
- name: INTERNAL_SUBNET
  label: INTERNAL_SUBNET
  default: 10.13.13.0
  description: Internal subnet for the wireguard and server and peers (only change if it clashes). Used
    in server mode. [OPTIONAL]
- name: ALLOWEDIPS
  label: ALLOWEDIPS
  default: 0.0.0.0/0
  description: 'The IPs/Ranges that the peers will be able to reach using the VPN connection. If not specified
    the default value is: ''0.0.0.0/0, ::0/0'' This will cause ALL traffic to route through the VPN, if
    you want split tunneling, set this to only the IPs you would like to use the tunnel AND the ip of
    the server''s WG ip, such as 10.13.13.1. [OPTIONAL]'
- name: PERSISTENTKEEPALIVE_PEERS
  label: PERSISTENTKEEPALIVE_PEERS
  default: ''
  description: Set to `all` or a list of comma separated peers (ie. `1,4,laptop`) for the wireguard server
    to send keepalive packets to listed peers every 25 seconds. Useful if server is accessed via domain
    name and has dynamic IP. Used only in server mode. [OPTIONAL]
- name: LOG_CONFS
  label: LOG_CONFS
  default: 'true'
  description: Generated QR codes will be displayed in the docker log. Set to `false` to skip log output.
    [OPTIONAL]
