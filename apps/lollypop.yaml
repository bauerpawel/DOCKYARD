name: Lollypop
slug: lollypop
category: Media
type: container
image: linuxserver/lollypop:latest@sha256:4c4e5b4adb74ed062a1052f6c0b94493b9f8edecfb73a6960a1c82131da5eaaa
description: '[Lollypop](https://wiki.gnome.org/Apps/Lollypop) is a lightweight modern music player designed
  to work excellently on the GNOME desktop environment.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lollypop-icon.png
website: https://github.com/linuxserver/docker-lollypop
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/lollypop/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
