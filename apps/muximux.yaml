name: Muximux
slug: muximux
category: Web
type: container
image: linuxserver/muximux:latest
description: A lightweight portal to view, manage your HTPC apps without having to run anything more than
  a PHP enabled webserver. With Muximux you don't need to keep multiple tabs open, or bookmark the URL
  to all of your apps.
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/muximux-icon.png
website: https://github.com/mescon/Muximux
ports:
- 80/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/Muximux
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
