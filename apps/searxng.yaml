name: SearXNG
slug: searxng
category: Web
type: container
image: searxng/searxng:latest@sha256:287af61f1a13e86d02974fcde91a3413a9945788de38b61ffbc491d81a19bcc2
description: Open-Source Privacy-respecting metasearch engine
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/searx.png
website: https://github.com/searxng/searxng
ports:
- 9017:8080/tcp
volumes:
- container: /etc/searxng
  bind: /portainer/Files/AppData/Config/searxng
env:
- default: http://localhost:9017
  label: BASE_URL
  name: BASE_URL
  description: Full public application URL, including scheme and any external port. Match the browser
    address and reverse proxy so generated links and redirects use the correct origin.
- default: my-instance
  label: INSTANCE_NAME
  name: INSTANCE_NAME
  description: Human-readable SearXNG instance name shown by the search interface. This does not set
    a public URL, DNS hostname or authentication policy.
