name: Filezilla
slug: filezilla
category: Utilities
type: container
image: linuxserver/filezilla:latest@sha256:74f5258eb5f397980c8e1ea96ebf009966d78dc23f06b562756a5a12a356eea2
description: '[FIleZilla](https://filezilla-project.org/) Client is a fast and reliable cross-platform
  FTP, FTPS and SFTP client with lots of useful features and an intuitive graphical user interface.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/filezilla-logo.png
website: https://github.com/linuxserver/docker-filezilla
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/filezilla/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
