name: Daapd
slug: daapd
category: Media
type: container
image: linuxserver/daapd:latest
description: DAAP (iTunes) media server with support for AirPlay devices, Apple Remote (and compatibles),
  MPD and internet radio.
logo: https://raw.githubusercontent.com/linuxserver/beta-templates/master/lsiodev/img/daapd-icon.png
website: https://github.com/linuxserver/docker-daapd
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/Daapd
- container: /music
  bind: /portainer/Music
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
