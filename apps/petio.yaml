name: Petio
slug: petio
category: Other
type: compose
repository:
  url: https://github.com/Qballjos/portainer_templates
  stackfile: Template/Stack/petio.yml
description: Petio is a third party companion app available to Plex server owners to allow their users
  to request, review and discover content. Set both TZ and Timezone to the same IANA time zone; the external
  stack uses them for Petio and MongoDB respectively.
logo: https://raw.githubusercontent.com/Qballjos/portainer_templates/master/Images/petio-icon.png
website: https://petio.tv
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: TZ
  name: TZ
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
- label: PORT
  name: PORT
  description: Free host TCP port published by this Compose stack, from 1 to 65535. This selects the
    host side of the mapping; the container's internal application port remains defined in the stackfile.
- name: Timezone
  label: Database time zone
  description: Set an IANA time zone, for example Europe/Warsaw, matching the existing TZ field. This
    upstream stack uses TZ for Petio and the separate case-sensitive Timezone variable for MongoDB.
