name: MySpeed
slug: myspeed
category: Monitoring
type: compose
image: germannewsmaker/myspeed:1.0.9@sha256:3a3e774b3f78d930a5a962d625b99bcb3d71730bfeb4a6b93e04fd38cfe7d9a9
compose: stacks/myspeed/docker-compose.yml
description: >-
  Schedules internet speed tests and records download, upload and latency history in a web dashboard.
  Stores settings and measurement history in a dedicated volume.
note: >-
  Open the loopback-bound web port locally or through a tunnel or authenticated reverse proxy. Finish
  onboarding and set an access password before exposing the dashboard. Choose a test provider and schedule;
  frequent tests consume internet bandwidth. Back up /myspeed/data. Documentation: https://docs.myspeed.dev/setup/linux
logo: https://cdn.jsdelivr.net/gh/selfhst/icons/png/myspeed.png
website: https://myspeed.dev/
env:
  - name: MYSPEED_PORT
    label: Web port
    description: Free host TCP port, from 1 to 65535. Match it in the public URL or reverse proxy.
    default: '5216'
