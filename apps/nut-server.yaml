name: NUT Server
slug: nut-server
category: Other
type: container
restart_policy: unless-stopped
note: >-
  <p>Configure the actual UPS driver/device access and a private monitoring password.
  <b>VENDORID</b> has no space; USB vendor and serial filters are optional. Passing
  environment settings alone does not grant the container access to a USB device.</p>
image: instantlinux/nut-upsd:latest
description: The purpose of NUT Server is to monitor a UPS attached device
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/nut-server.png
website: https://networkupstools.org
ports:
- 3493:3493/tcp
env:
- default: ''
  label: SERIAL
  name: SERIAL
  description: Optional hardware serial number selecting the intended UPS. Leave empty when automatic driver selection
    is sufficient; use the serial reported by the actual device when selecting among multiple UPS devices.
- default: ups
  label: NAME
  name: NAME
  description: NUT configuration name for the UPS. Use the same name in monitoring clients.
- default: ''
  label: USB vendor ID
  name: VENDORID
  description: Optional hexadecimal USB vendor ID used by instantlinux/nut-upsd, for example 09ae. Leave empty when
    the driver can select the intended UPS without it.
- label: API_PASSWORD
  name: API_PASSWORD
  description: Set a private password for the NUT monitoring account and configure matching clients. This is not
    a USB device password.
- default: UPS
  label: DESCRIPTION
  name: DESCRIPTION
  description: Human-readable UPS description used by NUT, for example Office UPS. This is a device description
    rather than a hostname or account name.
