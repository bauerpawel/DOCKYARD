name: Netdata
slug: netdata
category: Other
type: container
image: netdata/netdata:latest
description: Troubleshoot slowdowns and anomalies in your infrastructure with thousands of per-second
  metrics, meaningful visualizations, and insightful health alarms with zero configuration.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/netdata.png
website: https://www.netdata.cloud
ports:
- 19999:19999/tcp
volumes:
- container: /etc/netdata
  bind: /portainer/Files/AppData/Config/netdata/netdataconfig
- container: /var/lib/netdata
  bind: /portainer/Files/AppData/Config/netdata/netdatalib
- container: /host/etc/passwd:ro
  bind: /etc/passwd
- container: /host/etc/group:ro
  bind: /etc/group
- container: /host/proc:ro
  bind: /proc
- container: /host/sys:ro
  bind: /sys
- container: /host/etc/os-release:ro
  bind: /etc/os-release
env:
- default: '1000'
  label: DOCKER_USR
  name: DOCKER_USR
- default: '1000'
  label: DOCKER_GRP
  name: DOCKER_GRP
