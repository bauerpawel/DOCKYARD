name: musicbrainz
slug: musicbrainz
category: Media
type: container
image: linuxserver/musicbrainz:latest
description: MusicBrainz is an open music encyclopedia that collects music metadata and makes it available
  to the public.
logo: https://raw.githubusercontent.com/thesugarat/portainer_templates-1/master/Images/musicbrainz-icon.png
website: https://musicbrainz.org
ports:
- 5000/tcp
volumes:
- container: /config
- container: /data
env:
- label: BRAINZCODE
  name: BRAINZCODE
  default: ''
  preset: true
  description: MusicBrainz replication access token or code for the LinuxServer mirror image. Obtain
    your own through the MusicBrainz account process when using replication.
- label: WEBADDRESS
  name: WEBADDRESS
  default: ''
  preset: true
  description: Public hostname or address used by the LinuxServer MusicBrainz mirror. Set it to the
    address clients actually use; it does not create DNS records or a reverse proxy.
- label: PGID
  name: PGID
  default: '1000'
  preset: true
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: PUID
  name: PUID
  default: '1000'
  preset: true
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- label: TZ
  name: TZ
  default: America/Chicago
  preset: true
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
