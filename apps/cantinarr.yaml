name: Cantinarr
slug: cantinarr
category: Media
type: container
image: ghcr.io/windoze95/cantinarr:latest
description: One app over your whole media stack - household members browse and request movies, TV
  and books, while admins get Radarr, Sonarr and Chaptarr control down to the individual episode, live
  download queues, Tautulli activity, Plex invites and plain-English fixes for stuck downloads.
logo: https://raw.githubusercontent.com/windoze95/cantinarr/main/app/web/icons/Icon-512.png
website: https://github.com/windoze95/cantinarr
ports:
  - 8585/tcp
volumes:
  - container: /config
env:
  - name: CANTINARR_PUSH_GATEWAY_URL
    label: Push gateway URL
    default: https://push.julian.codes
    description: Push gateway for the companion iOS/Android apps. Leave the default, or clear to disable push.
  - name: CANTINARR_ARR_CALLBACK_URL
    label: Arr callback URL
    default: ""
    description: Origin your Radarr/Sonarr/Chaptarr containers should POST webhooks back to, e.g. http://192.168.1.10:8585. Leave blank to use whatever address you browse to.
