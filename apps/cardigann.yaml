name: Cardigann
slug: cardigann
category: Downloaders
type: container
image: linuxserver/cardigann:latest
description: Cardigann, a server for adding extra indexers to Sonarr, SickRage and CouchPotato via Torznab
  and TorrentPotato proxies. Behind the scenes Cardigann logs in and runs searches and then transforms
  the results into a compatible format.
logo: https://raw.githubusercontent.com/SelfhostedPro/selfhosted_templates/master/Images/cardigann.png
website: https://github.com/cardigann/cardigann
ports:
- 5060:5060/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/Cardigann
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
