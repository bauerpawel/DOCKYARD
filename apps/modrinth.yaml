name: Modrinth
slug: modrinth
category: Gaming
type: container
image: linuxserver/modrinth:latest
description: '[Modrinth App](https://modrinth.com/) is a unique, open source launcher that allows you
  to play your favorite mods, and keep them up to date, all in one neat little package.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/modrinth-logo.png
website: https://github.com/linuxserver/docker-modrinth
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/modrinth/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
