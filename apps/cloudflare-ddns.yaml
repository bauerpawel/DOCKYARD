name: Cloudflare DDNS
slug: cloudflare-ddns
category: Networking
type: container
image: favonia/cloudflare-ddns:latest
description: A robust Cloudflare DDNS updater with a small footprint. The program will detect your machine's
  public IP addresses and update DNS records using the Cloudflare API.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/cloudflare-ddns.png
website: https://github.com/favonia/cloudflare-ddns
env:
- default: ''
  label: CLOUDFLARE_API_TOKEN
  name: CLOUDFLARE_API_TOKEN
  description: Private Cloudflare API token with DNS editing permission limited to the zones being updated.
    Obtain it from Cloudflare; an account password is not an API token.
- default: ''
  label: DOMAINS (Comma Separated List)
  name: DOMAINS
  description: Comma-separated DNS names to update, for example home.example.com,vpn.example.com. The
    Cloudflare token must have access to their zones.
- default: 'true'
  label: PROXIED
  name: PROXIED
  description: true enables Cloudflare's proxy for managed DNS records; false leaves them DNS-only.
    Choose according to the protocol and service you expose.
