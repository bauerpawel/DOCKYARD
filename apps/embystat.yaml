name: EmbyStat
slug: embystat
category: Other
type: container
image: linuxserver/embystat:latest
description: Embystat is a personal web server that can calculate all kinds of statistics from your (local)
  Emby server. Just install this on your server and let him calculate all kinds of fun stuff.
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/embystat.png
website: https://github.com/mregni/EmbyStat
ports:
- 6555:6555/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/EmbyStat
