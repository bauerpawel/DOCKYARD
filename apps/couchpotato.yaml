name: Couchpotato
slug: couchpotato
category: Downloaders
type: container
image: linuxserver/couchpotato:latest
description: CouchPotato (CP) is an automatic NZB and torrent downloader. You can keep a "movies I want"-list
  and it will search for NZBs/torrents of these movies every X hours. Once a movie is found, it will send
  it to SABnzbd or download the torrent to a specified directory.
logo: https://mediadepot.github.io/templates/img/couchpotato-icon.png
website: https://github.com/CouchPotato/CouchPotatoServer
ports:
- 5050/tcp
volumes:
- container: /config
  bind: /opt/mediadepot/apps/couchpotato
- container: /downloads
  bind: /media/storage/downloads/movies
- container: /movies
  bind: /media/storage/movies
- container: /blackhole
  bind: /media/temp/blackhole/movies
env:
- name: PGID
  label: PGID
  default: '15000'
  preset: true
- name: PUID
  label: PUID
  default: '15000'
  preset: true
- name: TZ
  label: TZ
  default: America/Los_Angeles
