name: Boinc
slug: boinc
category: Science & Learning
type: container
image: linuxserver/boinc:latest
description: '[BOINC](https://boinc.berkeley.edu/) is a platform for high-throughput computing on a large
  scale (thousands or millions of computers). It can be used for volunteer computing (using consumer devices)
  or grid computing (using organizational resources). It supports virtualized, parallel, and GPU-based
  applications.'
logo: https://raw.githubusercontent.com/BOINC/boinc/master/doc/logo/boinc_logo_black.jpg
website: https://github.com/linuxserver/docker-boinc
ports:
- 8080:8080/tcp
- 8181:8181/tcp
volumes:
- container: /config
  bind: /srv/lsio/boinc/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: PASSWORD
  label: PASSWORD
  default: ''
  description: Optionally set a password for the gui. [OPTIONAL]
