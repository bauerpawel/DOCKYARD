name: Dockhand
slug: dockhand
category: Development
type: compose
image: fnsys/dockhand:latest@sha256:e82db7e76024d288c40a96ed023537961cfa4e60f1a87087f1990f64bde39fac
compose: stacks/dockhand/docker-compose.yml
description: >-
  Docker and Compose management UI with container logs, stack editing and multiple environments. Uses SQLite
  and a persistent data volume. Mounts docker.sock, granting control over Docker containers and broad access
  to the host. Some enterprise features require a license.
note: >-
  Open local port 3010 through a trusted connection and create the first administrator before exposing the
  UI. The Docker socket permits host administration; MCP requires separate host-access approval. Preserve
  /app/data, including SQLite and managed stack files. Configure remote Docker endpoints explicitly in the
  UI. Dockhand uses the Business Source License. Documentation: https://dockhand.pro/manual/
logo: https://raw.githubusercontent.com/Finsys/dockhand/main/src/images/logo.svg
website: https://github.com/Finsys/dockhand
env:
  - name: DOCKHAND_PORT
    label: Local web port
    description: Free host TCP port bound to 127.0.0.1. Use a host reverse proxy or SSH tunnel for remote
      access.
    default: '3010'
