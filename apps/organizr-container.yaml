name: Organizr (container)
slug: organizr-container
category: Other
type: container
image: organizr/organizr:latest
description: Organizr allows you to setup Tabs that will be loaded all in one webpage. You can then work
  on your server with ease.
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/organizr-icon.png
website: https://github.com/causefx/Organizr
ports:
- 80/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/Organizr
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
