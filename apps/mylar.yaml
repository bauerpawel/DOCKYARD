name: Mylar
slug: mylar
category: Downloaders
type: container
image: linuxserver/mylar:latest
description: An automated Comic Book downloader (cbr/cbz) for use with SABnzbd, NZBGet and torrents.
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/mylar-icon.png
website: https://github.com/mylar3/mylar3
ports:
- 8090:8090/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/Mylar
- container: /downloads
  bind: /portainer/Downloads
- container: /comics
  bind: /portainer/Comics
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
