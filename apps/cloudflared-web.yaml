name: Cloudflared-web
slug: cloudflared-web
category: Networking
type: container
image: wisdomsky/cloudflared-web:latest
description: 'A docker image that packages both cloudflared cli and a simple Web UI to easily start or
  stop remotely-managed Cloudflare tunnel. Source: https://github.com/WisdomSky/Cloudflared-web'
logo: https://raw.githubusercontent.com/WisdomSky/Cloudflared-web/refs/heads/main/app/frontend/public/cloudflare.ico
website: https://github.com/WisdomSky/Cloudflared-web
volumes:
- container: /config
env:
- default: '14333'
  label: Web UI port
  name: WEBUI_PORT
  description: TCP port on which the web interface listens inside this container. It does not create
    a host port mapping; configure publishing or the container network separately.
- default: admin
  label: Web UI username
  name: BASIC_AUTH_USER
  description: Username for the Cloudflared Web interface's HTTP Basic authentication. Set together
    with a private BASIC_AUTH_PASS value.
- default: ''
  label: Web UI password (set to protect the tunnel controls)
  name: BASIC_AUTH_PASS
  description: Private password protecting the Cloudflared Web interface and tunnel controls. Set it
    together with BASIC_AUTH_USER before making the interface reachable.
