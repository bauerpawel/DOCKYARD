name: Asciinema {shmolf}
slug: asciinema-shmolf
category: Utilities
type: compose
repository:
  url: https://github.com/shmolf/portainer-templates
  stackfile: stacks/asciinema/docker-compose.yml
description: Self-hosted terminal recording and playback
logo: https://raw.githubusercontent.com/shmolf/portainer-templates/main/assets/logos/asciinema.svg
website: https://asciinema.org
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- label: PGID
  name: PGID
  default: '1000'
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: Hostname
  name: HOST_NAME
  default: localhost
  description: Localhost for use within the application runtime
- label: Host Port
  name: HOST_PORT
  default: '3033'
  description: Published port for use within the application runtime
- label: Secret Application Key
  name: SECRET_KEY
  default: please-change-this-to-a-random-secret
  description: Private Asciinema application secret. Generate a long random value before initial deployment
    and keep it across updates rather than using the shared example.
