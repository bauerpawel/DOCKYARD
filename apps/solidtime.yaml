name: SolidTime
slug: solidtime
category: Productivity
type: compose
repository:
  url: https://github.com/xneo1/portainer_templates
  stackfile: Template/Stack/solidtime.yml
description: The modern Open-Source Time Tracker. Configure the public URL, application key, database password
  and OAuth key pair before deployment. Configure SMTP for mail delivery; S3 fields apply only when S3-compatible
  storage is configured separately. Super-administrator emails do not create accounts or enable registration.
logo: https://github.com/solidtime-io/solidtime/raw/main/docs/solidtime-banner.png
website: https://github.com/solidtime-io/solidtime
env:
- name: APP_URL
  label: Public application URL
  description: Required for a normal deployment. Full external URL, for example https://time.example.com.
    Use the same URL in your reverse proxy and email configuration.
- name: APP_KEY
  label: Application encryption key
  description: 'Required. Use the APP_KEY value from php artisan self-host:generate-keys in the deployed
    Solidtime release, including its base64: prefix. Paste the value without the assignment or surrounding
    quotes and keep it across updates.'
- name: DB_PASSWORD
  label: PostgreSQL password
  description: Required. Set a private password shared by Solidtime, its workers and PostgreSQL. Keep
    the password already used by an existing database.
- name: SUPER_ADMINS
  label: Super-administrator emails
  description: Comma-separated email addresses allowed super-administrator access, for example admin@example.com,owner@example.com,
    without spaces between entries. This grants privileges to matching verified accounts; it does not
    create accounts or enable registration. Leave empty when no super-administrator access is needed.
- name: MAIL_HOST
  label: SMTP server hostname
  description: Required when using SMTP delivery. Server hostname without a scheme, for example smtp.example.com.
    This stack uses the smtp mailer unless overridden and defaults its port to 587.
- name: MAIL_USERNAME
  label: SMTP username
  description: Set the username when your SMTP server requires authentication. Leave empty only when the
    configured mail server permits unauthenticated delivery from this deployment.
- name: MAIL_PASSWORD
  label: SMTP password
  description: Set the private password or app password when your SMTP server requires authentication.
    Use together with MAIL_USERNAME; leave empty only for an authorized relay that needs no authentication.
- name: PASSPORT_PRIVATE_KEY
  label: OAuth private key
  description: Use the PASSPORT_PRIVATE_KEY value from php artisan self-host:generate-keys in the deployed
    Solidtime release. Paste the PEM value without the assignment or surrounding quotes, preserving its
    generated newline escapes. Keep this private key paired with PASSPORT_PUBLIC_KEY across updates.
- name: PASSPORT_PUBLIC_KEY
  label: OAuth public key
  description: Use the PASSPORT_PUBLIC_KEY value paired with PASSPORT_PRIVATE_KEY from php artisan self-host:generate-keys.
    Paste the PEM value without the assignment or surrounding quotes, preserving its generated newline
    escapes. Supply key content rather than a host file path.
- name: S3_ACCESS_KEY_ID
  label: S3 access key (optional)
  description: Set when enabling S3-compatible storage. Account identifier for the chosen storage service;
    leave empty when using local storage. This stack does not select an S3 storage disk automatically.
- name: S3_SECRET_ACCESS_KEY
  label: S3 secret key (optional)
  description: Set the private storage secret when enabling S3-compatible storage. Use together with S3_ACCESS_KEY_ID,
    S3_BUCKET and S3_ENDPOINT; leave empty when using local storage.
- name: S3_BUCKET
  label: S3 bucket (optional)
  description: Existing bucket name when enabling S3-compatible storage, for example solidtime-uploads.
    Provision its access separately; leave empty when using local storage.
- name: S3_ENDPOINT
  label: S3 endpoint URL (optional)
  description: Endpoint URL required by your S3-compatible provider, for example https://s3.example.com.
    Leave empty when using local storage or when the configured provider uses its standard endpoint. Configure
    storage disk selection separately.
