name: Appwrite
slug: appwrite
category: Development
type: compose
description: Appwrite 2.6.2 backend platform with PostgreSQL, Redis, ClickHouse and the official workers, console
  and runtime services. Set the domain and private database and service secrets before first start. Requires Docker
  Compose 2.23.1+ and Docker socket access for function runtimes. This creates a new installation; it does not migrate
  the old 1.1.1 MariaDB stack. Preserve existing encryption keys and use the upstream upgrade path for existing
  data. See stacks/appwrite/README.md.
logo: https://appwrite.io/images/appwrite.svg
website: https://appwrite.io
env:
- name: _APP_DOMAIN
  label: Public hostname
  description: Required. DNS hostname without scheme, path or port, for example appwrite.example.com. Configure
    DNS and HTTPS, including wildcard functions and sites domains, separately.
- name: _APP_DB_SCHEMA
  label: Database name
  description: PostgreSQL database shared by all services. Keep its existing name when reusing PostgreSQL storage.
  default: appwrite
- name: _APP_DB_USER
  label: Database username
  description: PostgreSQL account shared by all services. Keep the existing account when reusing database storage.
  default: appwrite
- name: _APP_DB_PASS
  label: Database password
  description: Required private PostgreSQL password, consistently shared by the API and all workers. Retain it on
    updates; changing this field alone does not rotate an existing database password.
- name: _APP_OPENSSL_KEY_V1
  label: Encryption key
  description: Required. Generate a separate private value with openssl rand -hex 32 and retain it across updates.
    Keep a backup; existing encrypted or signed data depends on the same value.
- name: _APP_NOTIFICATIONS_TRACKING_SECRET
  label: Notification signing secret
  description: Required. Generate a separate private value with openssl rand -hex 32 and retain it across updates.
    Keep a backup; existing encrypted or signed data depends on the same value.
- name: _APP_EXECUTOR_SECRET
  label: Runtime executor secret
  description: Required. Generate a separate private value with openssl rand -hex 32 and retain it across updates.
    Keep a backup; existing encrypted or signed data depends on the same value.
- name: _APP_GEO_SECRET
  label: Geo service secret
  description: Required. Generate a separate private value with openssl rand -hex 32 and retain it across updates.
    Keep a backup; existing encrypted or signed data depends on the same value.
- name: _APP_JOBS_SECRET
  label: Job service secret
  description: Required. Generate a separate private value with openssl rand -hex 32 and retain it across updates.
    Keep a backup; existing encrypted or signed data depends on the same value.
- name: _APP_USAGE_PASS
  label: ClickHouse password
  description: Required. Generate a separate private value with openssl rand -hex 32 and retain it across updates.
    Use hexadecimal characters only because this password is included in a database URL.
- name: _APP_HTTP_PORT
  label: Host HTTP port
  description: Free host TCP port from 1 to 65535. Configure matching firewall and reverse proxy or client endpoints
    separately.
  default: '8081'
- name: _APP_HTTPS_PORT
  label: Host HTTPS port
  description: Free host TCP port from 1 to 65535. Configure matching firewall and reverse proxy or client endpoints
    separately.
  default: '8443'
- name: _APP_MQTT_PORT
  label: Host MQTT TLS port
  description: Free host TCP port from 1 to 65535. Configure matching firewall and reverse proxy or client endpoints
    separately.
  default: '8883'
- name: _APP_MQTT_WSS_PORT
  label: Host MQTT WebSocket TLS port
  description: Free host TCP port from 1 to 65535. Configure matching firewall and reverse proxy or client endpoints
    separately.
  default: '8084'
- name: _APP_OPTIONS_FORCE_HTTPS
  label: Force public HTTPS
  description: enabled for a public HTTPS deployment. Use disabled only for an intentional local HTTP test; configure
    trusted TLS termination separately.
  default: enabled
- name: _APP_SMTP_HOST
  label: SMTP hostname (optional)
  description: Set when enabling email delivery through your SMTP server. Leave empty when SMTP is not configured;
    configure the sender and provider policy separately.
- name: _APP_SMTP_USERNAME
  label: SMTP username (optional)
  description: Set when enabling email delivery through your SMTP server. Leave empty when SMTP is not configured;
    configure the sender and provider policy separately.
- name: _APP_SMTP_PASSWORD
  label: SMTP password (optional)
  description: Set when enabling email delivery through your SMTP server. Leave empty when SMTP is not configured;
    configure the sender and provider policy separately.
- name: _APP_SMTP_PORT
  label: SMTP port
  description: TCP port accepted by your SMTP server. Match its supported transport settings.
  default: '587'
image: appwrite/appwrite:2.6.2
compose: stacks/appwrite/docker-compose.yml
