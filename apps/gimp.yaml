name: Gimp
slug: gimp
category: Media
type: container
image: linuxserver/gimp:latest
description: '[GIMP](https://www.gimp.org/) is a free and open-source raster graphics editor used for
  image manipulation (retouching) and image editing, free-form drawing, transcoding between different
  image file formats, and more specialized tasks. It is extensible by means of plugins, and scriptable.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/gimp-logo.png
website: https://github.com/linuxserver/docker-gimp
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/gimp/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
