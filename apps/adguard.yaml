name: Adguard
slug: adguard
category: Other
type: container
image: adguard/adguardhome:latest
description: AdGuard Home is a network-wide software for blocking ads & tracking. After you set it up,
  it’ll cover ALL your home devices, and you don’t need any client-side software for that. With the rise
  of Internet-Of-Things and connected devices, it becomes more and more important to be able to control
  your whole network.
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/adguard.png
website: https://github.com/AdguardTeam/AdGuardHome
ports:
- 53:53/tcp
- 53:53/udp
- 67:67/udp
- 68:68/tcp
- 68:68/udp
- 80:80/tcp
- 443:443/tcp
- 853:853/tcp
- 3000:3000/tcp
volumes:
- container: /opt/adguardhome/work
  bind: /portainer/Files/AppData/Adguard/Workdir
- container: /opt/adguardhome/conf
  bind: /portainer/Files/AppData/Adguard/Conf
env:
- default: '1000'
  label: PUID
  name: PUID
- default: '100'
  label: PGID
  name: PGID
- label: CONTEXT_PATH
  name: CONTEXT_PATH
  default: adguard home
  preset: true
