name: Obsidian
slug: obsidian
category: CMS
type: container
image: linuxserver/obsidian:latest
description: '[Obsidian](https://obsidian.md) is a note-taking app that lets you create, link, and organize
  your notes on your device, with hundreds of plugins and themes to customize your workflow. You can also
  publish your notes online, access them offline, and sync them securely with end-to-end encryption.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/obsidian-logo.png
website: https://github.com/linuxserver/docker-obsidian
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/obsidian/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
