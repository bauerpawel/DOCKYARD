name: Pelorus
slug: pelorus
category: Remote Access
type: container
image: linuxserver/pelorus:latest
description: '[Pelorus](https://github.com/linuxserver/pelorus) is an AI navigator for Selkies-powered
  Linux desktops. Pelorus runs a FastAPI server that gives an LLM agent (Ollama, OpenAI-compatible, or
  Gemini) control over mouse, keyboard, screenshot, and window management via the [Pixelflux computer-use
  backend](https://github.com/linuxserver/pixelflux#computer-use-interface-wayland), a Linux accessibility
  tree (AT-SPI), and optional KWin D-Bus integration.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pelorus-logo.png
website: https://github.com/linuxserver/docker-pelorus
ports:
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/pelorus/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
