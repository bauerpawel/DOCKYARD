name: PrivateBin
slug: privatebin
category: Cloud & Storage
type: container
image: privatebin/nginx-fpm-alpine:latest
description: PrivateBin is a minimalist, open source online pastebin where the server has zero knowledge
  of pasted data!
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/privatebin.png
website: https://privatebin.info/
ports:
- 8080:8080/tcp
volumes:
- container: /srv/data
  bind: /portainer/Files/AppData/PrivateBin
- container: /srv/cfg
  bind: /portainer/Files/AppData/Config/PrivateBin
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
