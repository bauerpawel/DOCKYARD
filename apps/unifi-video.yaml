name: UniFi Video
slug: unifi-video
category: Media
type: container
image: pducharme/unifi-video-controller:latest
description: UniFi Video is a powerful and flexible, integrated IP video management surveillance system
  designed to work with Ubiquiti’s UniFi Video Camera product line. UniFi Video has an intuitive, configurable,
  and feature‑packed user interface with advanced features such as motion detection, auto‑discovery, user‑level
  security, storage management, reporting, and mobile device support.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/unifivideo-icon.png
website: https://github.com/pducharme/UniFi-Video-Controller
ports:
- 1935:1935/tcp
- 7444:7444/tcp
- 7447:7447/tcp
- 6666:6666/tcp
- 7442:7442/tcp
- 7080:7080/tcp
- 7443:7443/tcp
- 7445:7445/tcp
- 7446:7446/tcp
volumes:
- container: /recordings
  bind: /portainer/Files/AppData/Config/UnifFiVideo/Recordings/
- container: /config
  bind: /portainer/Files/AppData/Config/UniFiVideo/
env:
- default: '99'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- default: '002'
  label: UMASK
  name: UMASK
  description: Octal file-creation mask for images supporting UMASK, for example 002. It removes permission
    bits from newly created files; it is not a decimal UID or GID.
- default: UniFi Video
  label: CONTEXT_PATH
  name: CONTEXT_PATH
  description: Web application URL path when supported by the selected image, for example airsonic.
    Use the path syntax documented for that image; this does not configure a reverse proxy by itself.
