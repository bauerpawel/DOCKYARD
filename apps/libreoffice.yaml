name: Libreoffice
slug: libreoffice
category: Books & Documents
type: container
image: linuxserver/libreoffice:latest
description: '[LibreOffice](https://www.libreoffice.org/) is a free and powerful office suite, and a successor
  to OpenOffice.org (commonly known as OpenOffice). Its clean interface and feature-rich tools help you
  unleash your creativity and enhance your productivity.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/libreoffice-logo.png
website: https://github.com/linuxserver/docker-libreoffice
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/libreoffice/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
