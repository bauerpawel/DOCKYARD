name: Pi-Hole-Unbound
slug: pi-hole-unbound
category: Other
type: container
image: cbcrowe/pihole-unbound:latest
description: A Linux network-level advertisement and Internet tracker blocking application which acts
  as a DNS sinkhole. This version has Ubound software installed on it so you don't need to rely on external
  DNS providers. When the installation is complete, navigate to your.ip.goes.here:1010/admin. Follow the
  article <a href='https://medium.com/@niktrix/getting-rid-of-systemd-resolved-consuming-port-53-605f0234f32f'>here</a>
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/pihole-unbound.png
website: https://pi-hole.net
ports:
- 53:53/tcp
- 53:53/udp
- 1010:80/tcp
- 4443:443/tcp
volumes:
- container: /etc/pihole
  bind: /portainer/Files/AppData/Config/PiHole-Unbound
- container: /etc/dnsmasq.d
  bind: /portainer/Files/AppData/Config/PiHole-Unbound/DNS
env:
- default: 192.168.0.X
  description: Insert the Raspberry Pi IP here
  label: ServerIP
  name: ServerIP
- default: Europe\London
  label: TZ
  name: TZ
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
- label: DNSSEC
  name: DNSSEC
  select:
  - text: Enable DNSSEC
    value: 'true'
    default: true
  - text: Disable DNSSEC
    value: 'false'
  description: true enables upstream DNSSEC validation and false disables it. Select according to the
    DNS resolver chain; this does not sign your own DNS zones.
- default: 127.0.0.1#5335
  label: DNS1
  name: DNS1
  preset: true
  description: Primary upstream DNS resolver in the format accepted by this Pi-hole image, for example
    127.0.0.1#5335 for its bundled Unbound listener. This is not a web interface port.
- default: 127.0.0.1#5335
  label: DNS2
  name: DNS2
  preset: true
  description: Secondary upstream DNS resolver in the image's supported address#port format. Use a resolver
    consistent with the intended DNSSEC and privacy configuration.
