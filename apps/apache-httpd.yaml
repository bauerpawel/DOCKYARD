name: Apache Httpd
slug: apache-httpd
category: Web
type: container
image: httpd:latest
description: The Apache HTTP Server is a free and open-source cross-platform web server software, released
  under the terms of Apache License 2.0. Apache is developed and maintained by an open community of developers
  under the auspices of the Apache Software Foundation.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/apache-httpd.png
website: https://httpd.apache.org/
ports:
- 8080:80/tcp
- 8443:443/tcp
volumes:
- container: /usr/local/apache2/htdocs/
  bind: /portainer/Files/AppData/Config/apache-httpd
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
