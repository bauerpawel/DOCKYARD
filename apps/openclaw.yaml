name: OpenClaw
slug: openclaw
category: Automation
type: compose
repository:
  url: https://github.com/openclaw/openclaw
  stackfile: docker-compose.yml
description: Personal AI assistant platform running on your own hardware. Connects to multiple messaging
  channels (WhatsApp, Telegram, Discord, Slack, Mattermost and more) and acts as a self-hosted AI gateway.
  Built on Node.js 22 with a local-first, privacy-focused architecture.
logo: https://github.com/openclaw.png
website: null
env:
- name: OPENCLAW_GATEWAY_TOKEN
  label: Gateway Token
  description: Authentication token for the OpenClaw gateway WebSocket endpoint (required).
  default: ''
- name: OPENCLAW_CONFIG_DIR
  label: Config Directory
  description: Host path for persistent configuration, sessions and workspace data.
  default: /data/openclaw/config
- name: OPENCLAW_WORKSPACE_DIR
  label: Workspace Directory
  description: Host path for agent files and skills.
  default: /data/openclaw/workspace
- name: CLAUDE_AI_SESSION_KEY
  label: Claude AI Session Key
  description: Session key for Claude AI provider (optional).
  default: ''
- name: OPENCLAW_INSTALL_BROWSER
  label: Install Browser
  description: Set to 'true' to enable Chromium browser automation support.
  default: 'false'
