name: Overseerr (container)
slug: overseerr-container
category: Downloaders
type: container
image: lscr.io/linuxserver/overseerr:latest
description: Overseerr is a request management and media discovery tool built to work with your existing
  Plex ecosystem.
logo: https://mediadepot.github.io/templates/img/overseerr.png
website: https://github.com/linuxserver/docker-overseerr
ports:
- 5055/tcp
volumes:
- container: /config
  bind: /opt/mediadepot/apps/overseerr
- container: /etc/localtime
  bind: /etc/localtime
  readonly: true
env:
- name: PGID
  label: PGID
  default: '15000'
  preset: true
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- name: PUID
  label: PUID
  default: '15000'
  preset: true
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- name: TZ
  label: TZ
  default: America/Los_Angeles
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
