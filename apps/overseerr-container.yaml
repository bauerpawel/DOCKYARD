name: Overseerr (container)
slug: overseerr-container
category: Downloaders
type: container
image: lscr.io/linuxserver/overseerr:latest
description: Overseerr is a request management and media discovery tool built to work with your existing
  Plex ecosystem.
logo: https://mediadepot.github.io/templates/img/overseerr.png
website: https://github.com/linuxserver/docker-overseerr
ports:
- 5055/tcp
volumes:
- container: /config
  bind: /opt/mediadepot/apps/overseerr
- container: /etc/localtime
  bind: /etc/localtime
  readonly: true
env:
- name: PGID
  label: PGID
  default: '15000'
  preset: true
- name: PUID
  label: PUID
  default: '15000'
  preset: true
- name: TZ
  label: TZ
  default: America/Los_Angeles
