name: Webtop
slug: webtop
category: Remote Access
type: container
image: linuxserver/webtop:latest@sha256:211570631c76df794bc2beb451cefdba225a58643be396cc911cef205a0db7a5
description: '[Webtop](https://github.com/linuxserver/docker-webtop) - Alpine, Ubuntu, Fedora, and Arch
  based containers containing full desktop environments in officially supported flavors accessible via
  any modern web browser.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webtop-logo.png
website: https://github.com/linuxserver/docker-webtop
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/webtop/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
