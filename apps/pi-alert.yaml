name: Pi.alert
slug: pi-alert
category: Networking
type: container
image: jokobsk/pi.alert
description: WIFI / LAN intruder detector
logo: https://raw.githubusercontent.com/pucherot/Pi.Alert/main/docs/img/1_devices.jpg
website: https://github.com/pucherot/Pi.Alert
ports:
- 20211:20211/udp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/pi.alert
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
