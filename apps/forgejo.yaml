name: Forgejo
slug: forgejo
category: Development
type: container
image: codeberg.org/forgejo/forgejo:15
description: 'A self-hosted lightweight software forge, providing Git hosting, code review, issue tracking,
  and CI/CD. Source: https://codeberg.org/forgejo/forgejo'
logo: https://avatars.githubusercontent.com/u/118922216
website: https://forgejo.org/
ports:
- 3000:3000/tcp
- 222:22/tcp
volumes:
- container: /data
env:
- default: '1000'
  label: USER_UID
  name: USER_UID
  description: Numeric UID used by the Forgejo container account. Match ownership of the persistent
    Git and application data, for example the value returned by id -u for its host owner.
- default: '1000'
  label: USER_GID
  name: USER_GID
  description: Numeric GID used by the Forgejo container account. Match a host group with access to
    persistent Git and application data.
