name: quassel-core
slug: quassel-core
category: Communication
type: container
image: linuxserver/quassel-core:latest
description: Quassel IRC is a modern, cross-platform, distributed IRC client, meaning that one (or multiple)
  client(s) can attach to and detach from a central core -- much like the popular combination of screen
  and a text-based IRC client such as WeeChat, but graphical. Blowfish support and optional web-ui included.
logo: https://raw.githubusercontent.com/thesugarat/portainer_templates-1/master/Images/quassel-core-icon.png
website: https://github.com/quassel/quassel
ports:
- 4242/tcp
volumes:
- container: /config
env:
- label: PGID
  name: PGID
  default: '1000'
  preset: true
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: PUID
  name: PUID
  default: '1000'
  preset: true
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- label: TZ
  name: TZ
  default: America/Chicago
  preset: true
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
