name: quassel-core
slug: quassel-core
category: Communication
type: container
image: linuxserver/quassel-core:latest
description: Quassel IRC is a modern, cross-platform, distributed IRC client, meaning that one (or multiple)
  client(s) can attach to and detach from a central core -- much like the popular combination of screen
  and a text-based IRC client such as WeeChat, but graphical. Blowfish support and optional web-ui included.
logo: https://raw.githubusercontent.com/thesugarat/portainer_templates-1/master/Images/quassel-core-icon.png
website: https://github.com/quassel/quassel
ports:
- 4242/tcp
volumes:
- container: /config
env:
- label: PGID
  name: PGID
  default: '1000'
  preset: true
- label: PUID
  name: PUID
  default: '1000'
  preset: true
- label: TZ
  name: TZ
  default: America/Chicago
  preset: true
