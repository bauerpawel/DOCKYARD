name: AriaNG
slug: ariang
category: Downloaders
type: container
image: hurlenko/aria2-ariang:latest
description: AriaNg is a modern web frontend making aria2 easier to use. AriaNg is written in pure html
  & javascript, thus it does not need any compilers or runtime environment. You can just put AriaNg in
  your web server and open it in your browser. AriaNg uses responsive layout, and supports any desktop
  or mobile devices.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/ariang.png
website: https://github.com/hurlenko/aria2-ariang-docker
ports:
- 8080:8080/tcp
volumes:
- container: /aria2/conf
  bind: /portainer/Files/AppData/Config/AriaNG
- container: /aria2/data
  bind: /portainer/Downloads
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- default: '443'
  label: ARIA2RPCPORT
  name: ARIA2RPCPORT
  description: Port of the Aria2 RPC endpoint the interface should connect to, for example 6800 or the
    port exposed by your reverse proxy. It does not start an Aria2 backend or publish its port.
