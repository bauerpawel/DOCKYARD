description: The SORBA Smart Data Engine (SDE) is an industrial data collection/gateway device capable
  of Advanced Edge Analytics & Machine Learning Edge Processing. SORBA-SDE is equipped with multiple communication
  driver/protocol applicable to the industrial market. The SORBA-SDE is a sensor/hardware agnostic device
  that serves as your point & click gateway capable of talking to multiple devices in real-time. The SDE
  provides easy access to equipment for troubleshooting and remote programming support for PLCs & HMIs
  utilizing a hassle-free easy, set-up approach to your assets.
