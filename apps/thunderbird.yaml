name: Thunderbird
slug: thunderbird
category: Communication
type: container
image: linuxserver/thunderbird:latest
description: '[Thunderbird](https://www.thunderbird.net/) is a free and open-source personal information
  manager primarily used as an e-mail client with a calendar and contactbook, as well as an RSS feed reader,
  chat client, and news client.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/thunderbird-logo.png
website: https://github.com/linuxserver/docker-thunderbird
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/thunderbird/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
