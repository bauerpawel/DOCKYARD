name: Duplicati
slug: duplicati
category: Utilities
type: container
image: linuxserver/duplicati:latest
description: '[Duplicati](https://www.duplicati.com/) is a backup client that securely stores encrypted,
  incremental, compressed backups on local storage, cloud storage services and remote file servers. It
  works with standard protocols like FTP, SSH, WebDAV as well as popular services like Microsoft OneDrive,
  Amazon S3, Google Drive, box.com, Mega, B2, and many others.'
logo: https://github.com/linuxserver/docker-templates/raw/master/linuxserver.io/img/duplicati-icon.png
website: https://github.com/linuxserver/docker-duplicati
ports:
- 8200:8200/tcp
volumes:
- container: /config
  bind: /srv/lsio/duplicati/config
- container: /backups
  bind: /srv/lsio/duplicati/backups
- container: /source
  bind: /srv/lsio/duplicati/source
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: SETTINGS_ENCRYPTION_KEY
  label: SETTINGS_ENCRYPTION_KEY
  default: ''
  description: Encryption key for settings database. Minimum 8 characters, alphanumeric.
- name: CLI_ARGS
  label: CLI_ARGS
  default: ''
  description: Optionally specify any [CLI variables](https://duplicati.readthedocs.io/en/latest/07-other-command-line-utilities/)
    you want to launch the app with [OPTIONAL]
- name: DUPLICATI__WEBSERVICE_PASSWORD
  label: DUPLICATI__WEBSERVICE_PASSWORD
  default: ''
  description: Password for the webui. If left unset will default to `changeme` and can be changed from
    the webui settings. [OPTIONAL]
