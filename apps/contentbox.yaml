name: ContentBox
slug: contentbox
category: CMS
type: container
restart_policy: unless-stopped
note: >-
  <p>Use <b>INSTALL=true</b> only for initial setup, persist the database and then
  set <b>INSTALL=false</b>. The documented EXPRESS and INSTALL variable names are
  uppercase. Review the CFML engine when moving an existing installation.</p>
image: ortussolutions/contentbox:latest
description: Open-source modular CMS
logo: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/ortussolutions-contentbox.png
website: https://www.ortussolutions.com/products/contentbox
ports:
- 8080/tcp
- 8443/tcp
volumes:
- container: /data/contentbox/db
- container: /app/includes/shared/media
env:
- name: EXPRESS
  default: 'true'
  preset: true
  label: Express H2 database mode
  description: true uses ContentBox Express with its bundled H2 database. Persist the configured database directory;
    use a separately configured database when Express is disabled.
- name: INSTALL
  default: 'true'
  label: Run initial installer
  description: true enables the ContentBox initial installation wizard. Set false after the database has been initialized
    and persisted; it is not a routine update flag.
  select:
  - text: 'true'
    value: 'true'
    default: true
  - text: 'false'
    value: 'false'
- name: CFENGINE
  default: lucee@6
  preset: true
  label: CFML engine
  description: Supported CommandBox CFML engine identifier. This template uses Lucee 6; select an engine supported
    by the selected image and application when adapting it.
