name: hydra2
slug: hydra2
category: Downloaders
type: container
image: linuxserver/hydra2:latest
description: NZBHydra is a meta search for NZB indexers and the "spiritual successor" to NZBmegasearcH.
  It provides easy access to a number of raw and newznab based indexers.
logo: https://raw.githubusercontent.com/thesugarat/portainer_templates-1/master/Images/hydra-icon.png
website: https://github.com/theotherp/nzbhydra2
ports:
- 5076/tcp
volumes:
- container: /config
- container: /downloads
env:
- label: PUID
  name: PUID
  default: '1000'
  preset: true
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- label: PGID
  name: PGID
  default: '1000'
  preset: true
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: TZ
  name: TZ
  default: America/Chicago
  preset: true
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
