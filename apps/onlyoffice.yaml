name: Onlyoffice
slug: onlyoffice
category: Books & Documents
type: container
image: linuxserver/onlyoffice:latest
description: '[ONLYOFFICE](https://www.onlyoffice.com/) provides a full range of tools to create, edit
  and collaborate on text documents, spreadsheets, presentations, PDF forms and regular PDF files on web,
  desktop and mobile platforms.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/onlyoffice-logo.png
website: https://github.com/linuxserver/docker-onlyoffice
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/onlyoffice/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
