name: Sealskin
slug: sealskin
category: Business & Finance
type: container
image: linuxserver/sealskin:latest
description: '[Sealskin](https://github.com/selkies-project/sealskin/) is a self-hosted, client-server
  platform that enables users to run powerful, containerized desktop applications streamed directly to
  a web browser. It uses a browser extension to intercept user actions—such as clicking a link or downloading
  a file and redirects them to a secure, isolated application environment running on a remote server.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/selkies-logo.png
website: https://github.com/linuxserver/docker-sealskin
ports:
- 8443:8443/tcp
- 8000:8000/tcp
volumes:
- container: /config
  bind: /srv/lsio/sealskin/config
- container: /storage
  bind: /srv/lsio/sealskin/storage
- container: /var/run/docker.sock
  bind: /var/run/docker.sock
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: HOST_URL
  label: HOST_URL
  default: IP or subdomain.doman.com
  description: On initial setup this will be used to fill in the default admin configuration file in the
    `/config` directory, if unset the string HOST_URL will need to be replaced. [OPTIONAL]
