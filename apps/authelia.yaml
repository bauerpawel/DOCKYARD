name: Authelia
slug: authelia
category: Security
type: container
image: authelia/authelia:latest
description: An open-source authentication and authorization server providing 2-factor authentication
  and single sign-on (SSO) for your applications via a web portal.
logo: https://raw.githubusercontent.com/SelfhostedPro/selfhosted_templates/master/Images/authelia.png
website: https://www.authelia.com/
ports:
- 9091:9091/tcp
volumes:
- container: /etc/authelia/
  bind: /portainer/Files/AppData/Config/Authelia
env:
- label: TZ
  name: TZ
