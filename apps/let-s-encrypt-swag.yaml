name: Let's Encrypt / SWAG
slug: let-s-encrypt-swag
category: Utilities
type: container
image: linuxserver/swag:latest@sha256:705de71e24e98f3a2907664d6ae37a83d85001748abedf0d10904b928f191029
description: SWAG HTTPS reverse proxy and certificate management using a verified image digest. Set your certificate
  domain and contact email, then configure HTTP or DNS validation. Existing linuxserver/letsencrypt installations
  require the upstream SWAG migration procedure; preserve the /config volume. See stacks/README.md.
logo: https://raw.githubusercontent.com/Qballjos/portainer_templates/master/Images/letsencrypt.png
website: https://github.com/linuxserver/docker-swag
ports:
- 80:80/tcp
- 443:443/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/LetsEncrypt
env:
- label: EMAIL
  name: EMAIL
  description: Contact email for certificate registration and renewal notices, for example admin@example.com. Supply
    your own valid address before requesting certificates.
- label: URL
  name: URL
  description: Required base DNS domain for certificates, for example example.com, without scheme or path. Configure
    public DNS and the selected validation method separately.
- label: SUBDOMAINS
  name: SUBDOMAINS
  default: www
  description: Comma-separated certificate subdomains, for example www,cloud. Use only names with matching DNS and
    configure the required validation method separately.
- label: ONLY_SUBDOMAINS
  name: ONLY_SUBDOMAINS
  default: 'false'
  description: true requests certificates only for the listed subdomains; false includes the base domain where supported
    by the deployed LinuxServer image.
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files; find that
    user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted host files;
    find it with id -g. This variable does not itself change Docker's configured group.
- label: VALIDATION
  name: VALIDATION
  default: http
  description: Certificate domain-validation method supported by the deployed image, such as http or dns. HTTP requires
    reachable validation ports; DNS requires the matching provider plugin and credentials.
  select:
  - text: HTTP
    value: http
    default: true
  - text: DNS
    value: dns
- label: DNSPLUGIN
  name: DNSPLUGIN
  description: DNS provider plugin name when VALIDATION=dns, for example cloudflare. Leave empty for HTTP validation.
    Prepare the provider credential file in /config/dns-conf separately.
