name: Authentik
slug: authentik
category: Utilities
type: compose
note: >-
  <p>Set <b>PG_PASS</b> and prepare the release-specific <b>.env</b> required by the
  external stack for Authentik and GeoIP configuration. The HTTP/HTTPS port fields
  configure published ports; they do not supply TLS certificates or DNS.</p>
repository:
  url: https://github.com/xneo1/portainer_templates
  stackfile: Template/Stack/authentik.yml
description: Authentik identity provider. Set PG_PASS and prepare the required upstream .env file before deployment.
  The HTTP and HTTPS port fields map to the actual upstream substitutions. See stacks/README.md.
logo: https://d33wubrfki0l68.cloudfront.net/228cc7243c167d0ad9f9adf2129d69b787129ccb/73d36/img/icon_left_brand.svg
website: https://goauthentik.io
env:
- name: PG_PASS
  label: PostgreSQL password
  description: Required. Set a private database password shared by PostgreSQL and Authentik. Keep the password already
    used by an existing database. The upstream stack also requires a separately prepared .env file for Authentik
    and GeoIP settings.
- name: AUTHENTIK_PORT_HTTP
  label: Host HTTP port
  default: '9000'
  description: Free host TCP port from 1 to 65535, used by the referenced Authentik Compose stack. Configure DNS
    and TLS separately.
- name: AUTHENTIK_PORT_HTTPS
  label: Host HTTPS port
  default: '9443'
  description: Free host TCP port from 1 to 65535, used by the referenced Authentik Compose stack. Configure DNS
    and TLS separately.
