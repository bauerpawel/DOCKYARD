name: Bambustudio
slug: bambustudio
category: 3D Printing & Modeling
type: container
image: linuxserver/bambustudio:latest
description: '[Bambu Studio](https://bambulab.com/en/download/studio) is an open-source, cutting-edge,
  feature-rich slicing software. It contains project-based workflows, systematically optimized slicing
  algorithms, and an easy-to-use graphical interface, bringing users an incredibly smooth printing experience.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bambustudio-logo.png
website: https://github.com/linuxserver/docker-bambustudio
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/bambustudio/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: DARK_MODE
  label: DARK_MODE
  default: 'true'
  description: Set this to true to enable dark mode for Bambu Studio. [OPTIONAL]
