name: Doplarr_rs
slug: doplarr-rs
category: Downloaders
type: container
image: linuxserver/doplarr_rs:latest
description: '[Doplarr_rs](https://github.com/activexray/doplarr_rs) is a Discord bot for requesting media
  through *arr backends, written in Rust.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/doplarr_rs-logo.png
website: https://github.com/linuxserver/docker-doplarr_rs
ports:
- 80:80/tcp
volumes:
- container: /config
  bind: /srv/lsio/doplarr_rs/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
