name: Bookstack (stack)
slug: bookstack-stack
category: CMS
type: compose
repository:
  url: https://github.com/Qballjos/portainer_templates
  stackfile: Template/Stack/bookstack.yml
description: Bookstack is a free and open source Wiki designed for creating beautiful documentation. Feautring
  a simple, but powerful WYSIWYG editor it allows for teams to create detailed and useful documentation
  with ease.
logo: https://raw.githubusercontent.com/Qballjos/portainer_templates/master/Images/bookstack2.png
website: https://github.com/bauerpawel/DOCKYARD
env:
- default: '1000'
  label: PUID
  name: PUID
- default: '100'
  label: PGID
  name: PGID
- label: TZ
  name: TZ
- label: DATABASE_PASSWORD
  name: DATABASE_PASSWORD
- label: MYSQL_ROOT_PASSWORD
  name: MYSQL_ROOT_PASSWORD
- label: PORT
  name: PORT
