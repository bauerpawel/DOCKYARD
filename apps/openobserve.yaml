name: OpenObserve
slug: openobserve
category: Monitoring
type: container
image: public.ecr.aws/zinclabs/openobserve:v1.1.2@sha256:4a154849432f75c4fb024de32fe34163c02406c905dab22bf8d213d2e3386392
description: >-
  Centralized logs, metrics, traces, dashboards and alerting. This single-server deployment keeps its
  metadata and captured data on local persistent storage. Collection agents and application instrumentation
  must be configured separately.
note: >-
  Set ZO_ROOT_USER_EMAIL and a unique ZO_ROOT_USER_PASSWORD before starting. Open port 5080 with those
  credentials, create data streams and configure your applications or collectors to send telemetry. No
  Docker socket or automatic container-log collection is included. Put the service behind HTTPS, review
  retention limits and back up /data. This is a standalone deployment, not a high-availability cluster.
  Documentation: https://openobserve.ai/docs/quickstart/
logo: https://openobserve.ai/img/logo/o2-logo-readme.svg
website: https://openobserve.ai/
restart_policy: unless-stopped
ports:
  - 5080:5080/tcp
volumes:
  - container: /data
env:
  - name: ZO_ROOT_USER_EMAIL
    label: Initial administrator email
    description: Required. Email address used for initial OpenObserve administrator login.
  - name: ZO_ROOT_USER_PASSWORD
    label: Initial administrator password
    description: Required. Unique initial administrator password. Changing this variable does not necessarily
      reset an existing account.
  - name: ZO_DATA_DIR
    label: Local data directory
    description: Persistent directory inside the container for standalone metadata and stored telemetry.
    default: /data
    preset: true
