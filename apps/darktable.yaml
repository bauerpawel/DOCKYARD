name: Darktable
slug: darktable
category: Media
type: container
image: linuxserver/darktable:latest
description: '[darktable](https://www.darktable.org/) is an open source photography workflow application
  and raw developer. A virtual lighttable and darkroom for photographers. It manages your digital negatives
  in a database, lets you view them through a zoomable lighttable and enables you to develop raw images
  and enhance them.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/darktable-logo.png
website: https://github.com/linuxserver/docker-darktable
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/darktable/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
