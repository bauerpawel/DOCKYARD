name: Maloja
slug: maloja
category: Media
type: container
image: krateng/maloja:latest@sha256:4c39b5daa893451a379802f267a1d83f2b5d15d8b369e73349e530133cc8fdb6
description: Simple self-hosted music scrobble database to create personal listening statistics. No recommendations,
  no social network, no nonsense.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/maloja.png
website: https://github.com/krateng/maloja
ports:
- 42010:42010/tcp
volumes:
- container: /data
  bind: /portainer/Files/AppData/Config/Maloja/Data
env:
- default: malojapassword
  label: MALOJA_FORCE_PASSWORD
  name: MALOJA_FORCE_PASSWORD
  description: Private password enforced for Maloja's protected operations. Replace the template example
    before exposing the service and keep client configuration consistent.
- default: /data
  label: MALOJA_DATA_DIRECTORY
  name: MALOJA_DATA_DIRECTORY
  description: Absolute directory inside the container for Maloja's persistent data, such as /data.
    Keep it within the mounted data directory so updates preserve the collection.
