name: Backrest
slug: backrest
category: Utilities
type: container
image: ghcr.io/garethgeorge/backrest:v1.14.1
description: >-
  Web interface for Restic backups with schedules, snapshot browsing, restores and
  repository maintenance. Supports local repositories, S3, SFTP and rclone remotes.
  Create an account on first start. Put files to back up in the host source directory;
  it is mounted read-only at /userdata. Choose a writable destination when restoring.
logo: https://cdn.jsdelivr.net/gh/selfhst/icons/png/backrest.png
website: https://github.com/garethgeorge/backrest
ports:
  - 9898:9898/tcp
volumes:
  - container: /data
    bind: /srv/dockyard/backrest/data
  - container: /config
    bind: /srv/dockyard/backrest/config
  - container: /cache
    bind: /srv/dockyard/backrest/cache
  - container: /userdata
    bind: /srv/dockyard/backrest/source
    readonly: true
  - container: /repos
    bind: /srv/dockyard/backrest/repos
env:
  - name: BACKREST_DATA
    default: /data
    preset: true
    label: Backrest data directory
    description: Absolute directory inside the container for Backrest state and managed binaries. Keep
      it on the persistent data mount, such as /data; this is not the host directory being backed up.
  - name: BACKREST_CONFIG
    default: /config/config.json
    preset: true
    label: Backrest configuration file
    description: Absolute path to Backrest's configuration file inside the container, such as /config/config.json.
      Keep its parent directory on the persistent configuration mount.
  - name: XDG_CACHE_HOME
    default: /cache
    preset: true
    label: Cache directory
    description: Absolute cache directory inside the container, such as /cache. Match the mounted cache
      directory and ensure Backrest can write to it.
  - name: TZ
    label: Time zone
    default: Etc/UTC
    description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
      Use forward slashes in region names.
