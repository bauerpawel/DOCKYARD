name: Rsnapshot
slug: rsnapshot
category: Utilities
type: container
image: linuxserver/rsnapshot:latest
description: '[Rsnapshot](http://www.rsnapshot.org/) is a filesystem snapshot utility based on rsync.
  rsnapshot makes it easy to make periodic snapshots of local machines, and remote machines over ssh.
  The code makes extensive use of hard links whenever possible, to greatly reduce the disk space required.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/rsnapshot.png
website: https://github.com/linuxserver/docker-rsnapshot
ports:
- 80:80/tcp
volumes:
- container: /config
  bind: /srv/lsio/rsnapshot/config
- container: /.snapshots
  bind: /srv/lsio/rsnapshot/.snapshots
- container: /data
  bind: /srv/lsio/rsnapshot/data
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
