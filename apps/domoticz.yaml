name: Domoticz
slug: domoticz
category: Automation
type: container
image: linuxserver/domoticz:latest
description: 'Domoticz is a Home Automation System that lets you monitor and configure various devices
  like: Lights, Switches, various sensors/meters like Temperature, Rain, Wind, UV, Electra, Gas, Water
  and much more. Notifications/Alerts can be sent to any mobile device'
logo: https://github.com/domoticz/domoticz/raw/master/www/images/logo.png
website: https://www.domoticz.com/
ports:
- 1443:1443/tcp
- 6144:6144/tcp
- 8080:8080/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/Domoticz
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
