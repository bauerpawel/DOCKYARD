name: Joomla
slug: joomla
category: CMS
type: container
image: joomla:latest
description: Another free and open-source CMS
logo: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/joomla.png
website: https://www.joomla.org
ports:
- 80/tcp
volumes:
- container: /var/www/html
env:
- name: JOOMLA_DB_HOST
  label: MySQL database host
  description: MySQL or MariaDB hostname reachable from Joomla, optionally with its supported port syntax.
    The database service and matching user credentials must be configured separately.
- name: JOOMLA_DB_PASSWORD
  label: Database password
  description: Private password for the Joomla database account. Match the database service's configured
    account and preserve existing credentials when reusing data.
