name: Inductive Automation - Ignition Gateway
slug: inductive-automation-ignition-gateway
category: Other
type: compose
repository:
  url: https://github.com/portainer/templates
  stackfile: edge/ignition_gw/docker-compose.yml
description: Ignition Gateway is the primary software service that drives everything in Ignition - Single
  Server Deployment. Set EDGE_ID as the gateway name used by the startup command, accept the license and
  supply administrator credentials before deployment.
logo: https://pbs.twimg.com/profile_images/859108636504805376/QHpq7wuh_400x400.jpg
website: https://www.inductiveautomation.com
env:
- name: EULA
  label: Accept Igntion EULA
  select:
  - text: Yes, I accept
    value: Y
    default: true
- name: adminuser
  label: Gateway UI Admin Username
- name: adminpass
  label: Gateway UI Admin Password
- name: TZ
  label: Time Zone
- name: gwedition
  label: Gateway Edition
  select:
  - text: Standard
    value: standard
    default: true
  - text: Edge
    value: edge
  - text: Maker
    value: maker
- name: EDGE_ID
  label: Gateway name
  description: Required by the Ignition startup command. Set a unique gateway name, using letters, digits
    and hyphens without whitespace; for example ignition-gateway-01. Supply this deployment value explicitly.
