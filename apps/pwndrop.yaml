name: Pwndrop
slug: pwndrop
category: Cloud & Storage
type: container
image: linuxserver/pwndrop:latest
description: '[Pwndrop](https://github.com/kgretzky/pwndrop) is a self-deployable file hosting service
  for sending out red teaming payloads or securely sharing your private files over HTTP and WebDAV.'
logo: https://raw.githubusercontent.com/kgretzky/pwndrop/master/media/pwndrop-logo-512.png
website: https://github.com/linuxserver/docker-pwndrop
ports:
- 8080:8080/tcp
volumes:
- container: /config
  bind: /srv/lsio/pwndrop/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: SECRET_PATH
  label: SECRET_PATH
  default: /pwndrop
  description: Secret path for admin access. Defaults to `/pwndrop`. This parameter only takes effect
    during initial install; it can later be changed in the web gui. [OPTIONAL]
