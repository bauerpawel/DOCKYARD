name: Code Server
slug: code-server-2
category: Other
type: container
image: lscr.io/linuxserver/code-server:latest
description: Code-server is VS Code running on a remote server, accessible through the browser.
logo: https://raw.githubusercontent.com/SelfhostedPro/selfhosted_templates/master/Images/code-server.png
website: https://github.com/linuxserver/docker-code-server
ports:
- 8443:8443/tcp
volumes:
- bind: /portainer/Files/AppData/Config/Code-Server
  container: /config
env:
- default: '1000'
  label: PUID
  name: PUID
- default: '1000'
  label: PUID
  name: GUID
- label: TZ
  name: TZ
- label: PASSWORD
  name: PASSWORD
- label: SUDO_PASSWORD
  name: SUDO_PASSWORD
- default: example.my.domain
  label: PROXY_DOMAIN
  name: PROXY_DOMAIN
