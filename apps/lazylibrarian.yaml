name: Lazylibrarian
slug: lazylibrarian
category: Books & Documents
type: container
image: linuxserver/lazylibrarian:latest
description: '[Lazylibrarian](https://lazylibrarian.gitlab.io/) is a program to follow authors and grab
  metadata for all your digital reading needs. It uses a combination of Goodreads Librarything and optionally
  GoogleBooks as sources for author info and book info. This container is based on the DobyTang fork.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lazylibrarian-icon.png
website: https://github.com/linuxserver/docker-lazylibrarian
ports:
- 5299:5299/tcp
volumes:
- container: /config
  bind: /srv/lsio/lazylibrarian/config
- container: /downloads
  bind: /srv/lsio/lazylibrarian/downloads
- container: /books
  bind: /srv/lsio/lazylibrarian/books
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: DOCKER_MODS
  label: DOCKER_MODS
  default: linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg
  description: Allows additional functionality to be added, e.g. the Calibredb import program (optional,
    more info below) [OPTIONAL]
