name: pgAdmin
slug: pgadmin
category: Other
type: container
image: dpage/pgadmin4:latest
description: PGAdmin is a web-based GUI tool used to interact with the Postgres database sessions, both
  locally and remote servers as well. You can use PGAdmin to perform any sort of database administration
  required for a Postgres database.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/pgadmin.png
website: https://www.pgadmin.org/
ports:
- 5050:80/tcp
volumes:
- container: /var/lib/pgadmin
  bind: /portainer/Files/AppData/Config/pgadmin
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '1000'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- default: ''
  label: PGADMIN_DEFAULT_EMAIL
  name: PGADMIN_DEFAULT_EMAIL
  description: Email address for the initial pgAdmin administrator login. Set it before initializing
    empty pgAdmin storage; it is not a PostgreSQL role name.
- default: ''
  label: PGADMIN_DEFAULT_PASSWORD
  name: PGADMIN_DEFAULT_PASSWORD
  description: Private password for the initial pgAdmin administrator login. Set it before initial setup
    and manage existing account changes through pgAdmin.
- default: America/New_York
  label: TZ
  name: TZ
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
