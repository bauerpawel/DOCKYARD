name: pgAdmin
slug: pgadmin
category: Other
type: container
image: dpage/pgadmin4:latest
description: PGAdmin is a web-based GUI tool used to interact with the Postgres database sessions, both
  locally and remote servers as well. You can use PGAdmin to perform any sort of database administration
  required for a Postgres database.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/pgadmin.png
website: https://www.pgadmin.org/
ports:
- 5050:80/tcp
volumes:
- container: /var/lib/pgadmin
  bind: /portainer/Files/AppData/Config/pgadmin
env:
- default: '1000'
  label: PUID
  name: PUID
- default: '1000'
  label: PGID
  name: PGID
- default: ''
  label: PGADMIN_DEFAULT_EMAIL
  name: PGADMIN_DEFAULT_EMAIL
- default: ''
  label: PGADMIN_DEFAULT_PASSWORD
  name: PGADMIN_DEFAULT_PASSWORD
- default: America/New_York
  label: TZ
  name: TZ
