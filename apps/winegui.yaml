name: Winegui
slug: winegui
category: Business & Finance
type: container
image: linuxserver/winegui:latest
description: '[WineGUI](https://gitlab.melroy.org/melroy/winegui) is a user-interface friendly Wine manager
  that provides a graphical frontend for creating and managing Wine bottles.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/winegui-logo.png
website: https://github.com/linuxserver/docker-winegui
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/winegui/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
