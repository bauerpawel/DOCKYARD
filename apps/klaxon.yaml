name: Klaxon
slug: klaxon
category: Books & Documents
type: compose
repository:
  url: https://github.com/mediadepot/templates
  stackfile: stacks/klaxon/docker-compose.yml
description: Klaxon website change monitoring. The legacy external stack requires an existing Traefik network and
  prepared host paths. It hardcodes development database and application settings; customize and review it before
  use. The domain field configures only the router and does not configure email or administrator accounts. See stacks/README.md.
logo: https://mediadepot.github.io/templates/img/klaxon-logo.png
website: https://github.com/bauerpawel/DOCKYARD
env:
- name: DEPOT_DOMAIN_NAME
  label: Base domain
  description: Required by the Traefik router. Parent DNS domain without a scheme or path, for example example.com;
    the router uses klaxon.example.com. Configure DNS and the expected Traefik network and certificate resolver
    separately.
