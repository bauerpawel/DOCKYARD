name: Codiad
slug: codiad
category: Productivity
type: container
image: linuxserver/codiad:latest@sha256:cc90f1708971eb94345fe5c22d1ac58082aa439e76768e47284dcb6cad863916
description: Codiad is a web-based IDE framework with a small footprint and minimal requirements.
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/codiad-icon.png
website: https://github.com/Codiad/Codiad
ports:
- 80/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/Codiad
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
