name: Minecraft Server
slug: minecraft-server
category: Other
type: container
image: itzg/minecraft-server:latest
description: This docker image provides a Minecraft Server that will automatically download the latest
  stable version at startup. You can also run/upgrade to any specific version or the latest snapshot.
  See the Versions section below for more information.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/minecraft.png
website: https://github.com/itzg/docker-minecraft-server
ports:
- 25565:25565/tcp
volumes:
- container: /data
  bind: /portainer/Files/AppData/Config/Minecraft-data
env:
- default: 'TRUE'
  label: EULA
  name: EULA
  description: TRUE records acceptance of the Minecraft server EULA as expected by the image. Read the
    agreement before enabling this setting; the template does not grant ownership of the game.
