name: Eden
slug: eden
category: Gaming
type: container
image: linuxserver/eden:latest@sha256:68efef540e09e5e51646c1ba302f218a8a0e24ea2f5934f6b4fd7d9c0ea189f6
description: '[Eden](https://eden-emu.dev/) is an experimental open-source emulator for the Nintendo Switch,
  built with performance and stability in mind.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/eden-logo.png
website: https://github.com/linuxserver/docker-eden
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/eden/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
