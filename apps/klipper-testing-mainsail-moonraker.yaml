name: Klipper[Testing], Mainsail, Moonraker
slug: klipper-testing-mainsail-moonraker
category: Other
type: compose
description: Klipper, Moonraker and Mainsail using pinned images. Supply the printer device and a prepared host
  configuration directory containing printer.cfg, moonraker.conf and Mainsail config.json. This requires physical
  printer configuration and device access; it does not generate firmware settings. See stacks/klipper/README.md.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/drupal.png
website: https://www.klipper3d.org
env:
- name: PRINTER_DEVICE
  label: Printer device
  description: Required absolute printer device path on the Docker host, preferably /dev/serial/by-id/... for a
    stable device identity. It is passed to Klipper through the devices mapping.
- name: KLIPPER_CONFIG_DIR
  label: Prepared configuration directory
  description: Required absolute host directory containing klipper/printer.cfg, moonraker/moonraker.conf and mainsail/config.json.
    Prepare real hardware settings and file permissions before deployment.
- name: KLIPPER_WEB_PORT
  label: Mainsail host port
  default: '4070'
  description: Free host TCP port for the Mainsail web interface.
- name: MOONRAKER_PORT
  label: Moonraker host port
  default: '7125'
  description: Free host TCP port for Moonraker. Configure the actual API URL in Mainsail and restrict access to
    the trusted local network.
compose: stacks/klipper/docker-compose.yml
