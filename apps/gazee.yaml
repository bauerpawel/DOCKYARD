name: gazee
slug: gazee
category: Web
type: container
image: linuxserver/gazee:latest
description: A WebApp Comic Reader for your favorite digital comics. Reach and read your comic library
  from any web connected device with a modern web browser
logo: https://raw.githubusercontent.com/thesugarat/portainer_templates-1/master/Images/gazee-logo.png
website: https://github.com/hubbcaps/gazee
ports:
- 4242/tcp
volumes:
- container: /config
- container: /comics
- container: /mylar
env:
- label: PUID
  name: PUID
  default: '1000'
  preset: true
- label: PGID
  name: PGID
  default: '1000'
  preset: true
