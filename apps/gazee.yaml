name: gazee
slug: gazee
category: Web
type: container
image: linuxserver/gazee:latest
description: A WebApp Comic Reader for your favorite digital comics. Reach and read your comic library
  from any web connected device with a modern web browser
logo: https://raw.githubusercontent.com/thesugarat/portainer_templates-1/master/Images/gazee-logo.png
website: https://github.com/hubbcaps/gazee
ports:
- 4242/tcp
volumes:
- container: /config
- container: /comics
- container: /mylar
env:
- label: PUID
  name: PUID
  default: '1000'
  preset: true
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- label: PGID
  name: PGID
  default: '1000'
  preset: true
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
