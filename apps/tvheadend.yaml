name: Tvheadend
slug: tvheadend
category: Media
type: container
image: linuxserver/tvheadend:latest
description: '[Tvheadend](https://www.tvheadend.org/) works as a proxy server: is a TV streaming server
  and recorder for Linux, FreeBSD and Android supporting DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV,
  SAT>IP and HDHomeRun as input sources. Tvheadend offers the HTTP (VLC, MPlayer), HTSP (Kodi, Movian)
  and SAT>IP streaming. Multiple EPG sources are supported (over-the-air DVB and ATSC including OpenTV
  DVB extensions, XMLTV, PyXML).'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/tvheadend-big.png
website: https://github.com/linuxserver/docker-tvheadend
ports:
- 9981:9981/tcp
- 9982:9982/tcp
volumes:
- container: /config
  bind: /srv/lsio/tvheadend/config
- container: /recordings
  bind: /srv/lsio/tvheadend/recordings
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: RUN_OPTS
  label: RUN_OPTS
  default: ''
  description: Optionally specify additional arguments to be passed. See Additional runtime parameters.
    [OPTIONAL]
