name: SickChill
slug: sickchill
category: Downloaders
type: container
image: linuxserver/sickchill:latest
description: Automatic Video Library Manager for TV Shows. It watches for new episodes of your favorite
  shows, and when they are posted it does its magic.
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/sickchill-icon.png
website: https://github.com/linuxserver/docker-sickchill
ports:
- 8081:8081/tcp
volumes:
- container: /config
  bind: /portainer/Files/AppData/Config/SickChill
- container: /downloads
  bind: /portainer/Downloads
- container: /tv
  bind: /portainer/TV
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
