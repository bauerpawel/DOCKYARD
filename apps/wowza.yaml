name: Wowza
slug: wowza
category: Media
type: container
image: sameersbn/wowza:4.1.2-8
description: Streaming media server
logo: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/wowza.png
website: https://www.wowza.com/products/streaming-engine
ports:
- 1935/tcp
- 8086/tcp
- 8087/tcp
- 8088/tcp
volumes:
- container: /var/lib/wowza
env:
- name: WOWZA_ACCEPT_LICENSE
  label: Agree to Wowza EULA
  default: 'yes'
  preset: true
  description: yes records acceptance of the Wowza license agreement as expected by this image. Review
    the terms before accepting; this does not supply a license key.
- name: WOWZA_KEY
  label: License key
  description: Private Wowza license key issued for your deployment. Supply a valid key separately from
    the license-acceptance flag.
