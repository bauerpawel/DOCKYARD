name: McMyAdmin 2
slug: mcmyadmin-2
category: Other
type: container
image: linuxserver/mcmyadmin2:latest
description: McMyAdmin 2 is the leading web control panel and administration console for Minecraft servers.
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/mcmyadmin-icon.png
website: https://mcmyadmin.com
ports:
- 8080:8080/tcp
- 25565:25565/tcp
volumes:
- container: /minecraft
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
