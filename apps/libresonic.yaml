name: libresonic
slug: libresonic
category: Media
type: container
image: linuxserver/libresonic:latest
description: Libresonic is a free, web-based media streamer, providing ubiqutious access to your music.
  Use it to share your music with friends, or to listen to your own music while at work. You can stream
  to multiple players simultaneously, for instance to one player in your kitchen and another in your living
  room. /music = Location of music. /media = Location of other media. /podcasts = Location of podcasts.
  /playlists = Location for playlists storage. CONTEXT_PATH is for setting url-base in reverse proxy setups
  - (optional) Default user/pass is admin/admin
logo: https://raw.githubusercontent.com/thesugarat/portainer_templates-1/master/Images/libresonic.png
website: https://github.com/airsonic/airsonic
ports:
- 4040/tcp
volumes:
- container: /music
- container: /playlists
- container: /podcasts
- container: /media
- container: /config
env:
- label: CONTEXT_PATH
  name: CONTEXT_PATH
  default: ''
  preset: true
  description: Web application URL path when supported by the selected image, for example airsonic.
    Use the path syntax documented for that image; this does not configure a reverse proxy by itself.
- label: PUID
  name: PUID
  default: '1000'
  preset: true
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- label: PGID
  name: PGID
  default: '1000'
  preset: true
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: TZ
  name: TZ
  default: America/Chicago
  preset: true
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
