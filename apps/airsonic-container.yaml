name: Airsonic (container)
slug: airsonic-container
category: Media
type: container
image: linuxserver/airsonic:latest
description: Airsonic is a free, web-based media streamer, providing ubiqutious access to your music.
  Use it to share your music with friends, or to listen to your own music while at work. You can stream
  to multiple players simultaneously, for instance to one player in your kitchen and another in your living
  room.
logo: https://raw.githubusercontent.com/mikestraney/portainer-templates/master/Images/airsonic-logo.png
website: https://github.com/airsonic/airsonic
ports:
- 4040:4040/tcp
volumes:
- container: /music
  bind: /portainer/Music
- container: /playlists
  bind: /portainer/Files/AppData/Airsonic/Playlists
- container: /podcasts
  bind: /portainer/Podcasts
- container: /media
  bind: /portainer/Files/AppData/Airsonic/Media
- container: /config
  bind: /portainer/Files/AppData/Config/Airsonic/
env:
- default: '1000'
  label: PUID
  name: PUID
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- default: '100'
  label: PGID
  name: PGID
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- label: CONTEXT_PATH
  name: CONTEXT_PATH
  default: airsonic
  preset: true
  description: Web application URL path when supported by the selected image, for example airsonic.
    Use the path syntax documented for that image; this does not configure a reverse proxy by itself.
- label: JAVA_OPTS
  name: JAVA_OPTS
  default: -Xms256m -Xmx512m
  preset: true
  description: Space-separated JVM options, for example -Xms256m -Xmx512m for initial and maximum heap
    size. Size the heap within the container's available memory.
