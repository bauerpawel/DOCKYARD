name: Homepage (container)
slug: homepage-container
category: Utilities
type: container
image: ghcr.io/benphelps/homepage:latest
description: A modern (fully static, fast), secure (fully proxied), highly customizable application dashboard
  with integrations for more than 25 services and translations for over 15 languages. Easily configured
  via YAML files (or discovery via docker labels).
logo: https://mediadepot.github.io/templates/img/homepage.png
website: https://gethomepage.dev
ports:
- 3000/tcp
volumes:
- container: /app/config
  bind: /opt/mediadepot/apps/homepage
- container: /etc/localtime
  bind: /etc/localtime
  readonly: true
env:
- name: PGID
  label: PGID
  default: '15000'
  preset: true
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- name: PUID
  label: PUID
  default: '15000'
  preset: true
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
- name: TZ
  label: TZ
  default: America/Los_Angeles
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
