name: Kiwix Serve
slug: kiwix-serve
category: Science & Learning
type: container
image: ghcr.io/kiwix/kiwix-serve:3.8.2@sha256:e478554a9920412eeb5ce1d73f24e4b28445ebed233187cdd03c623c32be46a5
description: >-
  Offline web server for ZIM archives such as Wikipedia, Wiktionary, Stack Exchange, Project Gutenberg and
  TED. Serves every .zim file found in /srv/kiwix with a library page, full-text search and no internet access
  needed after the download. Reads the archives through a read-only bind mount and stores nothing else.
note: >-
  Download ZIM files from https://library.kiwix.org into /srv/kiwix on the Docker host before starting; the
  container exits when the directory has no .zim file. Make the files readable by UID 1001. Open port 8080 to
  browse the library. Restart the container after adding or removing archives. Large archives such as the full
  English Wikipedia need over 100 GB. Documentation: https://github.com/kiwix/kiwix-tools/blob/main/docker/README.md
logo: https://cdn.jsdelivr.net/gh/selfhst/icons/png/kiwix.png
website: https://www.kiwix.org/
restart_policy: unless-stopped
command: '*.zim'
ports:
  - 8080:8080/tcp
volumes:
  - container: /data
    bind: /srv/kiwix
    readonly: true
