name: Pure-FTP Server
slug: pure-ftp-server
category: Networking
type: container
image: stilliard/pure-ftpd:hardened
description: Pure-FTPd is a free (BSD), secure, production-quality and standard-conformant FTP server.
logo: https://mediadepot.github.io/templates/img/pureftpd-icon.jpg
website: https://github.com/stilliard/docker-pure-ftpd
ports:
- 21/tcp
- 30000/tcp
- 30001/tcp
- 30002/tcp
- 30003/tcp
- 30004/tcp
- 30005/tcp
- 30006/tcp
- 30007/tcp
- 30008/tcp
- 30009/tcp
volumes:
- container: /etc/pure-ftpd/passwd
  bind: /opt/mediadepot/apps/pureftp
- container: /data/tvshows
  bind: /media/storage/tvshows
- container: /data/movies
  bind: /media/storage/movies
- container: /data/music
  bind: /media/storage/music
- container: /data/ebooks
  bind: /media/storage/ebooks
- container: /data/photos
  bind: /media/storage/photos
- container: /data/documents
  bind: /media/storage/documents
- container: /data/downloads
  bind: /media/storage/downloads
- container: /data/software
  bind: /media/storage/software
- container: /data/blackhole
  bind: /media/temp/blackhole
- container: /data/processing
  bind: /media/temp/processing
env:
- name: FTP_USER_NAME
  label: FTP_USER_NAME
  default: depot
  preset: true
  description: FTP account username created by the Pure-FTPd image. Choose a deployment-specific account
    and use the same name in clients.
- name: FTP_USER_PASS
  label: FTP_USER_PASS
  default: badpass
  description: Private password for FTP_USER_NAME. Replace the template example before first deployment
    and manage changes according to the image's account initialization behavior.
- name: FTP_USER_HOME
  label: FTP_USER_HOME
  default: /data
  preset: true
  description: Absolute home directory for the FTP account inside the container, such as /data. Keep
    it within the intended mounted storage directory.
- name: FTP_USER_GID
  label: FTP_USER_GID
  default: '15000'
  preset: true
  description: Numeric group ID for the FTP account. Match the group allowed to read or write the mounted
    FTP storage.
- name: FTP_USER_UID
  label: FTP_USER_UID
  default: '15000'
  preset: true
  description: Numeric user ID for the FTP account. Match ownership of the mounted FTP storage so uploads
    have the intended permissions.
- name: TZ
  label: TZ
  default: America/Los_Angeles
  description: IANA time zone used for local times and schedules, for example Europe/Warsaw or Etc/UTC.
    Use forward slashes in region names.
- name: PUBLICHOST
  label: PUBLICHOST
  default: localhost
  description: Public IP address or hostname advertised for FTP passive connections. Match the address
    clients can reach and forward the configured passive port range separately.
