name: Foldingathome
slug: foldingathome
category: Science & Learning
type: container
image: linuxserver/foldingathome:latest
description: '[Folding@home](https://foldingathome.org/) is a distributed computing project for simulating
  protein dynamics, including the process of protein folding and the movements of proteins implicated
  in a variety of diseases. It brings together citizen scientists who volunteer to run simulations of
  protein dynamics on their personal computers. Insights from this data are helping scientists to better
  understand biology, and providing new opportunities for developing therapeutics.'
logo: https://foldingathome.org/wp-content/uploads/2016/09/folding-at-home-logo.png
website: https://github.com/linuxserver/docker-foldingathome
ports:
- 80:80/tcp
- 7396:7396/tcp
volumes:
- container: /config
  bind: /srv/lsio/foldingathome/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: ACCOUNT_TOKEN
  label: ACCOUNT_TOKEN
  default: ''
  description: Register for an account on `https://app.foldingathome.org` and retrieve account token in
    settings. Required on first start.
- name: MACHINE_NAME
  label: MACHINE_NAME
  default: ''
  description: Assign a friendly name to this instance (no spaces). Required on first start.
- name: CLI_ARGS
  label: CLI_ARGS
  default: ''
  description: Optionally pass additional cli arguments to `fah-client` on container start. [OPTIONAL]
