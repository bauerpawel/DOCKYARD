name: Aurral
slug: aurral
category: Media
type: compose
repository:
  url: https://github.com/xneo1/portainer_templates
  stackfile: Template/Stack/aurral.yml
description: Streamlined Artist Request Manager for Lidarr. Search for artists using the MusicBrainz database
  and seamlessly add them to your Lidarr music library. Features personalized recommendations, genre analysis,
  and one-click requests. Configure a reachable Lidarr instance and its API key, a private login password
  and, when used, a Last.fm API key. Review the external stack's host paths before deployment.
logo: https://github.com/lklynet/aurral/raw/main/frontend/public/arralogo.svg
website: https://github.com/lklynet/aurral
env:
- name: LIDARR_API_KEY
  label: Lidarr API key
  description: Required for Lidarr integration. Copy the API key from the Lidarr instance reachable at
    LIDARR_URL; it is not generated by this template.
- name: LASTFM_API_KEY
  label: Last.fm API key
  description: Set your Last.fm API key when using Last.fm recommendations. Obtain it from your Last.fm
    application; leave empty only if the deployed Aurral release supports disabling this integration.
- name: AUTH_PASSWORD
  label: Aurral login password
  description: Set a private password for Aurral authentication before exposing the service. This stack
    supplies no default password.
