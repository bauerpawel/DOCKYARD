name: Freshrss
slug: freshrss
category: Communication
type: container
image: linuxserver/freshrss:latest
description: '[Freshrss](https://freshrss.org/) is a free, self-hostable aggregator for rss feeds.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/freshrss-banner.png
website: https://github.com/linuxserver/docker-freshrss
ports:
- 80:80/tcp
volumes:
- container: /config
  bind: /srv/lsio/freshrss/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
