name: Netboot.xyz (container)
slug: netboot-xyz-container
category: Downloaders
type: container
image: linuxserver/netbootxyz:latest
description: Netbootxyz is a way to PXE boot various operating system installers or utilities from one
  place within the BIOS without the need of having to go retrieve the media to run the tool
logo: https://mediadepot.github.io/templates/img/netbootxyz.jpg
website: https://github.com/linuxserver/docker-netbootxyz
ports:
- 3000/tcp
- 69/udp
volumes:
- container: /config
  bind: /opt/mediadepot/apps/netbootxyz
- container: /assets
  bind: /media/storage/software/netbootxyz
- container: /etc/localtime
  bind: /etc/localtime
  readonly: true
env:
- name: PGID
  label: PGID
  default: '15000'
  preset: true
  description: Numeric Linux group ID for images that support PGID. Match a group with access to mounted
    host files; find it with id -g. This variable does not itself change Docker's configured group.
- name: PUID
  label: PUID
  default: '15000'
  preset: true
  description: Numeric Linux user ID for images that support PUID. Match the owner of mounted host files;
    find that user's ID with id -u. This variable does not itself change Docker's configured user.
