name: Windows (dockur)
slug: dockur-windows
category: Remote Access
type: container
image: dockurr/windows:latest
description: Runs a full Windows installation inside a Docker container, with automatic hands-free
  download and setup. Supports Windows 11 down to 95, plus several Windows Server releases, via
  near-native KVM acceleration. Access it through the built-in web viewer on port 8006 during setup,
  then over RDP afterwards. NOTE - requires a Linux host with KVM support (not available under Docker
  Desktop on Mac/Windows, or most container-only cloud hosts). It also needs the NET_ADMIN capability
  plus /dev/kvm and /dev/net/tun device access; since Portainer's template format can't grant just
  those, this deploys in --privileged mode instead (full access to the host's devices and capabilities)
  - a much bigger grant than the container actually needs, so prefer a host you trust before deploying.
logo: https://raw.githubusercontent.com/dockur/windows/master/.github/logo.png
website: https://github.com/dockur/windows
privileged: true
ports:
  - 8006/tcp
  - 3389:3389/tcp
  - 3389:3389/udp
volumes:
  - container: /storage
  - container: /shared
env:
  - name: VERSION
    label: Windows version
    description: Which Windows release to automatically download and install.
    default: "11"
    select:
      - text: Windows 11 Pro
        value: "11"
        default: true
      - text: Windows 11 LTSC
        value: 11l
      - text: Windows 11 Enterprise
        value: 11e
      - text: Windows 10 Pro
        value: "10"
      - text: Windows 10 LTSC
        value: 10l
      - text: Windows 10 Enterprise
        value: 10e
      - text: Windows Server 2025
        value: "2025"
      - text: Windows Server 2022
        value: "2022"
      - text: Windows Server 2019
        value: "2019"
      - text: Windows Server 2016
        value: "2016"
      - text: Windows 8.1 Enterprise
        value: 8e
      - text: Windows 7 Ultimate
        value: 7u
      - text: Tiny11
        value: tiny11
      - text: Tiny10
        value: tiny10
      - text: ReactOS
        value: reactos
  - name: RAM_SIZE
    label: RAM
    default: 4G
    description: Memory allocated to the Windows virtual machine, using the image's size format, for example
      4G. Leave enough RAM for the Docker host and other services.
  - name: CPU_CORES
    label: CPU cores
    default: "2"
    description: Positive integer number of virtual CPU cores assigned to Windows. Choose a count supported
      by the Docker host's available CPU resources.
  - name: DISK_SIZE
    label: Disk size
    default: 64G
    description: Virtual Windows disk size, for example 64G. Ensure the persistent storage has enough
      free space; reducing this value does not safely shrink an existing Windows filesystem.
  - name: USERNAME
    label: Username
    default: Docker
    description: Windows account username used during guest installation. It is a Windows login, not a
      Linux container UID; changing it may not rename an existing installed account.
  - name: PASSWORD
    label: Password
    default: admin
    description: Private password for the Windows guest account used for desktop or RDP login. Replace
      the template example before installation; an existing guest may require password changes inside
      Windows.
  - name: LANGUAGE
    label: Language
    default: English
    description: Windows installation language supported by the chosen image, for example English. Installation
      settings may not change an already installed guest.
  - name: KEYBOARD
    label: Keyboard layout
    default: en-US
    description: Windows keyboard layout code, for example en-US. Use a layout supported by the selected
      Windows image.
  - name: REGION
    label: Region
    default: en-US
    description: Windows regional locale code, for example en-US. Use a locale supported by the selected
      Windows image.
  - name: AUDIO
    label: Enable audio streaming to the web viewer
    default: "N"
    select:
      - text: "N"
        value: "N"
        default: true
      - text: "Y"
        value: "Y"
    description: Y enables audio streaming to the browser viewer; N disables it. Choose one of the supplied
      dropdown values.
