name: Melonds
slug: melonds
category: Gaming
type: container
image: linuxserver/melonds:latest@sha256:4539f3208abf649a23144c8019bd2740df0e768fe9c45f9686625847ada41b0a
description: '[melonDS](https://melonds.kuribo64.net/) aims at providing fast and accurate Nintendo DS
  emulation.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/melonds-logo.png
website: https://github.com/linuxserver/docker-melonds
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/melonds/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
