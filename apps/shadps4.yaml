name: Shadps4
slug: shadps4
category: Gaming
type: container
image: linuxserver/shadps4:latest
description: '[shadPS4](https://shadps4.net/) is an early PlayStation 4 emulator for Windows, Linux and
  macOS written in C++.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/shadps4-logo.png
website: https://github.com/linuxserver/docker-shadps4
ports:
- 3000:3000/tcp
- 3001:3001/tcp
volumes:
- container: /config
  bind: /srv/lsio/shadps4/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
