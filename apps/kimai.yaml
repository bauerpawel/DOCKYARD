name: Kimai
slug: kimai
category: Business & Finance
type: container
image: linuxserver/kimai:latest
description: '[Kimai](https://kimai.org/) is a professional grade time-tracking application, free and
  open-source. It handles use-cases of freelancers as well as companies with dozens or hundreds of users.
  Kimai was build to track your project times and ships with many advanced features, including but not
  limited to: JSON API, invoicing, data exports, multi-timer and punch-in punch-out mode, tagging, multi-user
  - multi-timezones - multi-language ([over 30 translations existing](https://hosted.weblate.org/projects/kimai/)!),
  authentication via SAML/LDAP/Database, two-factor authentication (2FA) with TOTP, customizable role
  and team permissions, responsive design, user/customer/project specific rates, advanced search & filtering,
  money and time budgets, advanced reporting, support for [plugins](https://www.kimai.org/store/) and
  so much more.'
logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kimai-logo.png
website: https://github.com/linuxserver/docker-kimai
ports:
- 80:80/tcp
- 443:443/tcp
volumes:
- container: /config
  bind: /srv/lsio/kimai/config
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: APP_SECRET
  label: APP_SECRET
  default: ''
  description: Random string used for session encryption. Generate using e.g. `openssl rand -hex 32`.
- name: DATABASE_URL
  label: DATABASE_URL
  default: mysql://your_db_user:your_db_pass@your_db_host:3306/your_db_name?charset=your_db_charset&serverVersion=your_db_version
  description: Configure your database connection, see Application Setup instructions.
- name: TRUSTED_HOSTS
  label: TRUSTED_HOSTS
  default: kimai.example.com
  description: Domain or IP you will be using to access Kimai. Can be a regex like `localhost|127.0.0.1|kimai.example.com`
- name: TRUSTED_PROXIES
  label: TRUSTED_PROXIES
  default: 127.0.0.1/32
  description: If behind a reverse proxy set this to its IP or network CIDR so that Kimai trusts its headers.
    [OPTIONAL]
