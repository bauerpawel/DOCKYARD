name: Qbittorrent
slug: qbittorrent
category: Downloaders
type: container
image: linuxserver/qbittorrent:latest
description: The [Qbittorrent](https://www.qbittorrent.org/) is a bittorrent client programmed in C++
  / Qt that uses libtorrent (sometimes called libtorrent-rasterbar) by Arvid Norberg.
logo: https://github.com/linuxserver/docker-templates/raw/master/linuxserver.io/img/qbittorrent-icon.png
website: https://github.com/linuxserver/docker-qbittorrent
ports:
- 8080:8080/tcp
- 6881:6881/tcp
- 6881:6881/udp
volumes:
- container: /config
  bind: /srv/lsio/qbittorrent/config
- container: /downloads
  bind: /srv/lsio/qbittorrent/downloads
env:
- name: PUID
  label: PUID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
- name: PGID
  label: PGID
  default: '1000'
  description: Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
- name: TZ
  label: TZ
  default: Etc/UTC
  description: specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
- name: WEBUI_PORT
  label: WEBUI_PORT
  default: '8080'
  description: for changing the port of the web UI, see below for explanation
- name: TORRENTING_PORT
  label: TORRENTING_PORT
  default: '6881'
  description: for changing the port of tcp/udp connection, see below for explanation
