name: CommandBox
slug: commandbox
category: Development
type: container
restart_policy: unless-stopped
image: ortussolutions/commandbox:latest
description: ColdFusion (CFML) CLI
logo: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/ortussolutions-commandbox.png
website: https://www.ortussolutions.com/products/commandbox
ports:
- 8080/tcp
- 8443/tcp
env:
- name: CFENGINE
  default: lucee@6
  preset: true
  label: CFML engine
  description: Supported CommandBox CFML engine identifier. This template uses Lucee 6; select an engine supported
    by the selected image and application when adapting it.
