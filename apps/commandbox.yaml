name: CommandBox
slug: commandbox
category: Development
type: container
image: ortussolutions/commandbox:latest
description: ColdFusion (CFML) CLI
logo: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/ortussolutions-commandbox.png
website: https://www.ortussolutions.com/products/commandbox
ports:
- 8080/tcp
- 8443/tcp
env:
- name: CFENGINE
  default: lucee@4.5
  preset: true
  label: CFML engine
  description: CommandBox CFML engine identifier and version, for example lucee@6. Use an engine supported
    by the selected image; the template's existing lucee@4.5 value is a legacy example.
