name: Datadog agent (container)
slug: datadog-agent-container
category: Monitoring
type: container
image: datadog/agent:latest
description: Collect events and metrics
logo: https://portainer-io-assets.sfo2.digitaloceanspaces.com/logos/datadog_agent.png
website: https://www.datadoghq.com/
volumes:
- container: /var/run/docker.sock
  bind: /var/run/docker.sock
  readonly: true
- container: /host/sys/fs/cgroup
  bind: /sys/fs/cgroup
  readonly: true
- container: /host/proc
  bind: /proc
  readonly: true
env:
- name: DD_API_KEY
  label: Datadog API key
