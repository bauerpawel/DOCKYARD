name: Archivebox
slug: archivebox
category: Other
type: container
image: archivebox/archivebox:latest
description: ArchiveBox is a powerful, self-hosted internet archiving solution to collect, save, and view
  sites you want to preserve offline.
logo: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/archivebox.png
website: https://archivebox.io/
ports:
- 8002:8000/tcp
volumes:
- container: /data
  bind: /portainer/Files/AppData/Config/archivebox
env:
- default: '*'
  label: ALLOWED_HOSTS
  name: ALLOWED_HOSTS
- default: 750m
  label: MEDIA_MAX_SIZE
  name: MEDIA_MAX_SIZE
- default: 'true'
  label: PUBLIC_INDEX
  name: PUBLIC_INDEX
- default: 'true'
  label: PUBLIC_SNAPSHOTS
  name: PUBLIC_SNAPSHOTS
- default: 'false'
  label: PUBLIC_ADD_VIEW
  name: PUBLIC_ADD_VIEW
