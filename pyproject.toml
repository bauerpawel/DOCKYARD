[project]
name = "DOCKYARD"
version = "0.1.0"
description = "Builds a Portainer v3 app-template JSON feed and a browsable static website from Docker Hub-based app definitions."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "PyYAML>=6.0.3",
    "Jinja2>=3.1.6",
    "requests>=2.34.2",
    "jsonschema>=4.26.0",
    # Requests permits older releases with known vulnerabilities.
    "urllib3>=2.8.0,<3",
    "idna>=3.20,<4",
    "certifi>=2026.7.22",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
audit = ["pip-audit>=2.10.1"]

[project.scripts]
gallery = "gallery.cli:main"

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
