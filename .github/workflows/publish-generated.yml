name: Publish generated files

# Called after a build job. This job holds the write token, so it runs no
# Python packages: it takes the build job's "generated" artifact and commits
# only the generated paths. main requires passing tests, so the commit goes to
# a staging branch first; the tests run there and the branch the caller runs
# on moves to the same commit only once they pass. Branch protection ignores
# check runs from another branch when a push moves main, so the job copies the
# passed jobs to commit statuses on the same commit first. deploy/refresh.php
# reads the check runs.

on:
  workflow_call:
    inputs:
      paths:
        description: Space-separated generated paths that the build job uploaded.
        required: true
        type: string
      message:
        description: Commit message.
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
      statuses: write
    env:
      STAGING: publish/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove the generated files before unpacking the new ones
        env:
          GENERATED: ${{ inputs.paths }}
        run: rm -rf -- $GENERATED

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated

      - name: Commit if anything changed
        id: commit
        env:
          GENERATED: ${{ inputs.paths }}
          MESSAGE: ${{ inputs.message }}
        run: |
          for path in $GENERATED; do
            if [ ! -e "$path" ]; then
              echo "::error::The build artifact has no $path."
              exit 1
            fi
          done
          git add -A -- $GENERATED
          # The artifact comes from a job that ran third-party packages, so it may touch nothing else.
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::The build artifact changed files outside: $GENERATED"
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes to $GENERATED - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "$MESSAGE"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push the commit to a staging branch
        id: stage
        if: steps.commit.outputs.sha != ''
        run: git push origin "HEAD:refs/heads/$STAGING"

      # A push made with this token starts no workflows, so the tests are started explicitly.
      - name: Test the staged commit
        id: test
        if: steps.stage.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run checks.yml --ref "$STAGING" --repo "$GITHUB_REPOSITORY"
          run=""
          for _ in $(seq 1 24); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --branch "$STAGING" \
              --event workflow_dispatch --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n 1)
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "::error::The test run for $SHA did not start."
            exit 1
          fi
          if ! gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30; then
            echo "::error::Tests failed for $SHA; $GITHUB_REF was not updated."
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Record the passed jobs as commit statuses
        if: steps.stage.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          RUN: ${{ steps.test.outputs.run }}
        run: |
          gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.conclusion == "success") | .name' |
          while IFS= read -r job; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context="$job" \
              -f description="Passed on $STAGING" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN" > /dev/null
          done

      - name: Move the branch to the tested commit
        if: steps.stage.outcome == 'success'
        run: git push origin "HEAD:$GITHUB_REF"

      - name: Delete the staging branch
        if: always() && steps.stage.outcome == 'success'
        run: git push origin --delete "$STAGING"

      - name: Purge jsDelivr cache for templates.json and stacks.lock.json
        run: |
          for file in templates.json stacks.lock.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@main/$file" || true
          done
