name: Tests and dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python and PHP test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y php-cli php-zip
          php -r 'exit(class_exists("ZipArchive") ? 0 : 1);'
          node --version
          docker compose version
      - name: Run tests
        run: python -m pytest -q
      - name: Build and validate
        run: |
          python -m gallery build --repo-url "https://github.com/${{ github.repository }}"
          python -m gallery validate

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install project and audit tool
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Audit installed dependencies
        run: |
          python -m pip freeze --exclude-editable > audit-requirements.txt
          python -m pip_audit -r audit-requirements.txt --no-deps --disable-pip --strict --progress-spinner off
      - name: Audit locked PHP dependencies
        run: composer audit --working-dir=mcp --locked --no-dev
