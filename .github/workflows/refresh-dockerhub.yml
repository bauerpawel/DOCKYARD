name: Refresh Docker Hub metadata

on:
  schedule:
    # 1st of every month at 06:00 UTC - the closest calendar-cron
    # equivalent to "every 30 days" (cron has no native N-day interval).
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Runs the Python packages with a read-only token; publish commits its output.
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Fetch Docker Hub metadata
        run: python -m gallery fetch-metadata

      - name: Rebuild templates.json and the site with the refreshed cache
        run: python -m gallery build --repo-url "https://github.com/${{ github.repository }}"

      - name: Validate templates.json
        run: python -m gallery validate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated
          path: |
            cache/dockerhub.json
            templates.json
            repository.json
            docs
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: refresh
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/publish-generated.yml
    with:
      paths: cache/dockerhub.json templates.json repository.json docs
      message: Refresh Docker Hub metadata
