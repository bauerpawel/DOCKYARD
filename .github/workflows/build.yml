name: Build templates.json and site

on:
  push:
    branches: [main]
  schedule:
    # Every Saturday at 09:00 CET / 10:00 CEST (08:00 UTC). GitHub Actions
    # cron is UTC-only, so this drifts by an hour during CEST (late March -
    # late October) - adjust the hour below if that matters to you.
    - cron: "0 8 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e .

      - name: Build templates.json and the site
        run: python -m gallery build --repo-url "https://github.com/${{ github.repository }}"

      - name: Validate templates.json
        run: python -m gallery validate

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- templates.json docs repository.json; then
            echo "No changes to templates.json, docs/ or repository.json - nothing to commit."
            exit 0
          fi
          git add templates.json docs repository.json
          git commit -m "Rebuild templates.json and site from apps/ and stacks/"
          git push

      - name: Purge jsDelivr cache for templates.json and stacks.lock.json
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/templates.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/stacks.lock.json" || true
