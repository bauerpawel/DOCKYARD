name: Build templates.json and site

on:
  push:
    branches: [main]
  schedule:
    # Every Saturday at 09:00 CET / 10:00 CEST (08:00 UTC). GitHub Actions
    # cron is UTC-only, so this drifts by an hour during CEST (late March -
    # late October) - adjust the hour below if that matters to you.
    - cron: "0 8 * * 6"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Runs the Python packages with a read-only token; publish commits its output.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Build templates.json and the site
        run: python -m gallery build --repo-url "https://github.com/${{ github.repository }}"

      - name: Validate templates.json
        run: python -m gallery validate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated
          path: |
            templates.json
            repository.json
            docs
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/publish-generated.yml
    with:
      paths: templates.json repository.json docs
      message: Rebuild templates.json and site from apps/ and stacks/
