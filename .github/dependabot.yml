version: 2
updates:
  # Hash-pinned CI dependencies, generated by the uv command in each file's header.
  # The dependency graph skips a .txt here unless its name contains "requirements"
  # or a same-named .in exists, so requirements-dev.txt must keep its name. Do not
  # add requirements-dev.in: Dependabot then recompiles the lock from the .in alone,
  # which is how it emptied build.txt in #14.
  # No pip entry for /: it also reads requirements/ and opens duplicate PRs, and a
  # push to requirements/ does not run its graph job, so its snapshot goes stale.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # composer.json targets PHP 8.2 (config.platform), which Symfony 8+ does not
  # support. Without the ignore, Dependabot only tries the newest major, fails to
  # resolve it and offers no 7.4 patch either.
  - package-ecosystem: composer
    directory: /mcp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: symfony/*
        update-types:
          - version-update:semver-major
