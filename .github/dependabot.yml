version: 2
updates:
  # Hash-pinned CI dependencies, generated by the uv command in each file's header.
  # No pip entry for /: it also reads requirements/ and opened duplicate PRs.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: composer
    directory: /mcp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
