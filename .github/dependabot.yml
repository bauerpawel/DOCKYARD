version: 2
updates:
  # Hash-pinned CI dependencies, generated by the uv command in each file's header.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The /requirements entry leaves requirements/dev.txt out of the dependency
  # graph, which then keeps stale versions and alerts open. This entry covers it.
  # It opens no PRs, because it also reads requirements/ and duplicated them.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # composer.json targets PHP 8.2 (config.platform), which Symfony 8+ does not
  # support. Without the ignore, Dependabot only tries the newest major, fails to
  # resolve it and offers no 7.4 patch either.
  - package-ecosystem: composer
    directory: /mcp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: symfony/*
        update-types:
          - version-update:semver-major
